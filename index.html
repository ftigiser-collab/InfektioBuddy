<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Infektio</title>
<meta name="theme-color" content="#123a5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Infektio">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/icon-192.png">
<link rel="manifest" href="./manifest.webmanifest">
<style>
:root{
  --teal:#17a2a1; --teal-d:#0e7f80; --navy:#123a5c; --navy-l:#2b5a80;
  --bg:#eef3f5; --card:#ffffff; --ink:#16232e; --muted:#5c7183; --line:#dae4ea;
  --gut:#1a7f52; --maessig:#b3801d; --schlecht:#a8483a; --untauglich:#7b2d46;
  --haeufig:#123a5c; --moeglich:#5c7183; --selten:#9aabb8;
  --warn:#a8483a; --warnbg:#fbf0ee; --star:#c9962a;
  --radius:14px; --shadow:0 1px 2px rgba(18,58,92,.08), 0 4px 16px rgba(18,58,92,.06);
}
[data-theme="dark"]{
  --bg:#0e1a22; --card:#152530; --ink:#e6eef3; --muted:#93a8b6; --line:#243a48;
  --navy:#8fc4e8; --navy-l:#a9d3f0; --teal:#3fc4bd; --teal-d:#61d6cf;
  --gut:#4cb98a; --maessig:#d6a445; --schlecht:#e0796a; --untauglich:#c96b8c;
  --haeufig:#cfe3f0; --moeglich:#93a8b6; --selten:#63798a;
  --warn:#e0796a; --warnbg:#2a1c1c; --star:#e0b552; --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 64px}
header{position:sticky;top:0;z-index:30;background:var(--bg);padding-top:env(safe-area-inset-top);
  border-bottom:1px solid transparent;transition:border-color .2s}
header.scrolled{border-bottom-color:var(--line)}
.bar{max-width:820px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.back{border:none;background:none;padding:6px 8px 6px 0;cursor:pointer;display:flex;
  align-items:center;gap:6px;color:var(--navy);font-weight:600;font-size:15px}
.back svg{width:16px;height:16px}
.crumb{font-size:13px;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{border:none;background:none;cursor:pointer;padding:6px;color:var(--muted);font-size:17px;line-height:1}
.iconbtn.on{color:var(--star)}
.logo{display:block;margin:6px auto 2px;max-width:230px;width:62%}
.tagline{text-align:center;color:var(--muted);font-size:14px;margin:0 0 20px}
.tiles{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:620px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;box-shadow:var(--shadow)}
@media(min-width:620px){.tile{flex-direction:column;text-align:center;gap:10px;padding:22px 14px}}
.tile img{width:56px;height:56px;object-fit:contain;flex:none}
@media(min-width:620px){.tile img{width:76px;height:76px}}
.tile b{display:block;font-size:17px;color:var(--navy);letter-spacing:-.01em}
.tile span{font-size:13px;color:var(--muted);display:block;margin-top:2px}
[data-theme="dark"] .tile img{filter:brightness(.94) saturate(1.05)}
.search{position:relative;margin:18px 0 6px}
.search input{width:100%;padding:13px 15px;font-size:16px;border:1px solid var(--line);
  border-radius:var(--radius);background:var(--card);color:var(--ink)}
.search input:focus{outline:2px solid var(--teal);outline-offset:-1px;border-color:transparent}
.minor{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.minor button{border:1px solid var(--line);background:var(--card);border-radius:999px;
  padding:7px 14px;font-size:13.5px;cursor:pointer;color:var(--navy)}
.recent{margin-top:22px}
.recent h3{font-size:13px;color:var(--muted);font-weight:600;margin:0 0 8px}
h1{font-size:23px;line-height:1.25;margin:2px 0 4px;letter-spacing:-.02em}
h2.group{font-size:12.5px;font-weight:700;color:var(--muted);margin:22px 0 8px;letter-spacing:.04em}
.gbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:11px;padding:13px 14px;cursor:pointer;margin-top:8px}
.gbtn:hover{border-color:var(--teal)}
.gbtn b{flex:1;font-size:15.5px;font-weight:650;letter-spacing:-.01em}
.gbtn .cnt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.gbtn .chev{color:var(--muted);transition:transform .18s}
.gbtn.open{border-color:var(--teal);border-bottom-left-radius:0;border-bottom-right-radius:0}
.gbtn.open .chev{transform:rotate(90deg);color:var(--teal)}
.gbody{border:1px solid var(--teal);border-top:none;border-radius:0 0 11px 11px;
  padding:8px;display:flex;flex-direction:column;gap:7px;background:var(--bg)}
.gbody .item{border-color:var(--line)}
.gtools{display:flex;gap:8px;margin:14px 0 2px}
.rfield{display:grid;grid-template-columns:1fr 92px;gap:10px;align-items:center;
  padding:11px 0;border-bottom:1px solid var(--line)}
.rfield:last-of-type{border-bottom:none}
.rfield label{font-size:14.5px}
.rfield .sub{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.rfield input{width:100%;padding:9px 10px;font-size:15px;border:1px solid var(--line);
  border-radius:9px;background:var(--bg);color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.rfield input:focus{outline:2px solid var(--teal);outline-offset:-1px}
.rhit{border-left:3px solid var(--warn);padding:2px 0 2px 13px;margin-bottom:14px}
.rhit b{display:block;font-size:13px;color:var(--warn);margin-bottom:4px}
.rbanner{background:var(--warnbg);border:1px solid var(--warn);border-radius:11px;
  padding:12px 14px;margin-top:12px;font-size:14.5px}
.rbanner b{color:var(--warn);display:block;font-size:12.5px;margin-bottom:4px;letter-spacing:.03em}
table.dur{width:100%;border-collapse:collapse;font-size:14px}
table.dur td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.dur td:first-child{padding-right:12px}
table.dur tr:last-child td{border-bottom:none}
table.dur a{color:var(--teal-d);cursor:pointer;text-decoration:none}
.rgwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px}
table.rg{border-collapse:separate;border-spacing:0;font-size:12px;min-width:640px}
table.rg th{font-weight:700;color:var(--muted);font-size:11px;padding:6px 4px;text-align:center;white-space:nowrap}
table.rg th.er{text-align:left;position:sticky;left:0;background:var(--card);z-index:2;min-width:170px;padding-left:0}
table.rg td{padding:5px 4px;text-align:center;border-top:1px solid var(--line)}
table.rg td.er{text-align:left;position:sticky;left:0;background:var(--card);z-index:2;
  font-size:12.5px;padding-left:0;line-height:1.3}
table.rg td.er a{color:var(--ink);cursor:pointer}
.sq{display:inline-block;width:15px;height:15px;border-radius:3px}
.sq.gruen{background:var(--gut)} .sq.gelb{background:var(--maessig)}
.sq.rot{background:var(--schlecht)} .sq.leer{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.rglegend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted);margin-top:12px}
.rglegend span{display:inline-flex;align-items:center;gap:6px}
.lokal{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.rgcard{border-left:3px solid var(--maessig);padding:2px 0 2px 13px;margin-bottom:14px}
.rgcard.rot{border-left-color:var(--schlecht)}
.rgcard.gruen{border-left-color:var(--gut)}
.rgcard b{display:block;font-size:13.5px;margin-bottom:5px}
.rgcard.rot b{color:var(--schlecht)} .rgcard.gelb b{color:var(--maessig)} .rgcard.gruen b{color:var(--gut)}
.gtools button{border:1px solid var(--line);background:var(--card);border-radius:999px;
  padding:6px 13px;font-size:13px;cursor:pointer;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:7px}
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:11px;padding:12px 14px;cursor:pointer}
.row:hover{border-color:var(--teal)}
.row .rt{flex:1;min-width:0}
.row b{display:block;font-weight:600;font-size:15.5px;line-height:1.3}
.row small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.row .chev{color:var(--line);flex:none;transition:transform .18s}
.item{background:var(--card);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.item.open{border-color:var(--teal)}
.item .row{border:none;border-radius:0;background:none}
.item.open .chev{transform:rotate(90deg);color:var(--teal)}
.peek{padding:0 14px 14px;border-top:1px solid var(--line);margin-top:-2px}
.peek dl{margin:12px 0 0}
.peek .full{margin-top:12px}
.kicker{font-size:12.5px;color:var(--teal-d);font-weight:700;margin:0 0 3px}
[data-theme="dark"] .kicker{color:var(--teal)}
.lede{color:var(--muted);font-size:14.5px;margin:8px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:12px}
.card > h3{font-size:12.5px;font-weight:700;color:var(--muted);margin:0 0 10px;letter-spacing:.03em}
.card p{margin:0 0 10px;font-size:15px}
.card p:last-child{margin-bottom:0}
.card ul{margin:0;padding-left:18px;font-size:15px}
.card li{margin-bottom:7px}
.card li:last-child{margin-bottom:0}
.card.warn{background:var(--warnbg);border-color:var(--warn)}
.card.warn > h3{color:var(--warn)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px;align-items:baseline}
.dl dt{color:var(--muted);font-size:13px}
.dl dd{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;
  font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;color:var(--ink)}
.chip:hover{border-color:var(--teal)}
.chip.plain{cursor:default}
.chip.plain:hover{border-color:var(--line)}
.chip.ext{border-style:dashed}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.dot.haeufig{background:var(--haeufig)}
.dot.moeglich{background:var(--moeglich)}
.dot.selten{background:transparent;box-shadow:inset 0 0 0 1.5px var(--selten)}
.amp{font-weight:700;font-size:18px;line-height:1}
.amp.gut{color:var(--gut)} .amp.maessig{color:var(--maessig)}
.amp.schlecht{color:var(--schlecht)} .amp.untauglich{color:var(--untauglich)}
.amp.eingeschraenkt{color:var(--maessig)} .amp.unwirksam{color:var(--muted)}
.ampw{font-size:12.5px;color:var(--muted);margin-left:6px}
.penrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 0;
  border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:none;
  border-right:none;border-top:none;text-align:left;font-size:14.5px}
.penrow:last-of-type{border-bottom:none}
.penrow:hover span:first-child{color:var(--teal-d);text-decoration:underline}
.penval{display:inline-flex;align-items:baseline;white-space:nowrap}
.ther{border-left:3px solid var(--teal);padding:2px 0 2px 13px;margin-bottom:16px}
.ther:last-child{margin-bottom:0}
.ther b{display:block;font-size:13px;color:var(--teal-d);margin-bottom:5px}
[data-theme="dark"] .ther b{color:var(--teal)}
.ther p{font-size:14.5px;margin:7px 0 0}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;vertical-align:middle}
.badge.ueberholt{background:var(--warnbg);color:var(--warn);border:1px solid var(--warn)}
.badge.ext{background:transparent;color:var(--muted);border:1px dashed var(--muted);font-weight:600}
.badge.std{background:rgba(23,162,161,.14);color:var(--teal-d);font-weight:600}
[data-theme="dark"] .badge.std{color:var(--teal)}
.badge.ev-belastbar{background:rgba(26,127,82,.12);color:var(--gut)}
.badge.ev-solide{background:rgba(23,162,161,.14);color:var(--teal-d)}
.badge.ev-begrenzt{background:rgba(179,128,29,.14);color:var(--maessig)}
.badge.ev-umstritten{background:rgba(92,113,131,.14);color:var(--muted)}
[data-theme="dark"] .badge.ev-solide{color:var(--teal)}
.abk{border-bottom:1px dotted var(--muted);cursor:help}
.note{font-size:13px;color:var(--muted);margin-top:6px}
.ungeprueft{color:var(--maessig);font-weight:600}
.empty{color:var(--muted);font-size:14.5px;padding:24px 0;text-align:center}
.foot{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.legend{margin-top:12px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.legend div{display:flex;gap:8px;align-items:baseline}
.legend .amp{flex:none;width:18px;text-align:center}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header id="hdr"><div class="bar" id="bar"></div></header>
<main class="wrap" id="app"></main>
<script>
const KOMPARTIMENTE = [
 {id:"liquor_ne",name:"Liquor, nicht entzündet",kurz:"Liquor (n. entz.)",barriere:"Intakte Blut-Hirn- und Blut-Liquor-Schranke, Effluxpumpen. Betalaktame erreichen meist unter 5 % der Plasmakonzentration.",regeln:["Relevant für Prophylaxe und Frühphase nach neurochirurgischem Eingriff.","Wichtig für den Verlauf: mit nachlassender Entzündung schließt sich die Schranke wieder — eine anfangs wirksame Substanz kann unter die Zielkonzentration fallen."]},
 {id:"liquor_e",name:"Liquor bei Entzündung",kurz:"Liquor (entz.)",barriere:"Bei Ventrikulitis lag das Verhältnis der Liquor- zur Plasma-AUC für Vancomycin zwischen 0,85 und 15,6 %, für Meropenem zwischen 0,09 und 13,2 %. Auf dieser Streuung lässt sich keine feste Dosis begründen.",regeln:["Dosis erhöhen, nicht Intervall verlängern: Meropenem 2 g alle 8 h statt 1 g.","TDM ist hier am wenigsten verzichtbar.","Fosfomycin, Rifampicin und Aminoglykoside niemals als Monotherapie.","Bei Staphylokokken-Ventrikulitis ist intraventrikuläres Vancomycin eine Option, genannt werden etwa 10 mg/d beim Erwachsenen.","Unter Dexamethason empfiehlt die DGN vorsichtshalber Ceftriaxon plus Rifampicin statt Ceftriaxon plus Vancomycin."]},
 {id:"lunge",name:"Lunge / epitheliale Auskleidungsflüssigkeit",kurz:"Lunge (ELF)",barriere:"Blut-Luft-Schranke. Entscheidend ist die ELF-Konzentration, nicht der Plasmaspiegel.",regeln:["Vancomycin penetriert schlecht — bei MRSA-Pneumonie ist Linezolid vorzuziehen.","Daptomycin wird durch Surfactant inaktiviert: bei Pneumonie unbrauchbar trotz In-vitro-Wirksamkeit.","Tigecyclin erreicht zu niedrige Spiegel für Pneumonie und Bakteriämie."]},
 {id:"pleura",name:"Pleuraempyem",kurz:"Pleura",barriere:"Keine echte Membran, aber saures Milieu, hohes Inokulum und Fibrinsepten. Antibiotika kommen an, wirken aber schlecht.",regeln:["Kein Antibiotikum saniert ein Empyem — Drainage, ggf. Fibrinolyse oder Dekortikation entscheiden.","Therapiedauer 2–4 Wochen, deutlich länger als bei Pneumonie."]},
 {id:"peritoneum",name:"Peritoneum",kurz:"Peritoneum",barriere:"Gut erreichbar für alle Betalaktame, Metronidazol und Linezolid.",regeln:["Bei offenem Abdomen, Lavagen und hohem Drainagevolumen gehen relevante Wirkstoffmengen verloren — Unterdosierung ist wahrscheinlicher als Überdosierung.","Kapillarleck und Volumentherapie vergrößern das Verteilungsvolumen hydrophiler Substanzen: Aufsättigungsdosis nicht reduzieren."]},
 {id:"galle",name:"Galle",kurz:"Galle",barriere:"Hohe biliäre Ausscheidung bei Acylaminopenicillinen, Carbapenemen und Makroliden.",regeln:["Bei vollständiger Obstruktion ist die biliäre Ausscheidung aufgehoben — gute Gallengängigkeit nützt nichts, solange der Gang zu ist.","Literaturdaten stammen von Patienten mit offenem Gallengang und sind nicht übertragbar.","Bei Cholangitis entscheidet die Entlastung (ERCP, PTCD)."]},
 {id:"pankreas",name:"Pankreas und Pankreasnekrose",kurz:"Pankreas",barriere:"Bewährt haben sich Carbapeneme sowie Chinolone plus Metronidazol; Aminoglykoside erreichen keine ausreichenden Gewebekonzentrationen.",regeln:["Die Indikationsfrage steht vor der Penetrationsfrage: keine generelle Prophylaxe bei prognostiziert schwerer Pankreatitis.","Behandelt wird bei Nachweis oder begründetem Verdacht auf infizierte Nekrose.","Breites Regime begünstigt grampositive Selektion und Pilzbesiedlung der Nekrose mit schlechter Prognose."]},
 {id:"nierenparenchym",name:"Nierenparenchym",kurz:"Nierenparenchym",barriere:"Bei Pyelonephritis und Urosepsis zählt die Gewebekonzentration, nicht die Harnkonzentration.",regeln:["Substanzen mit hoher Harn-, aber niedriger Gewebekonzentration (Nitrofurantoin, orales Fosfomycin-Trometamol) sind bei Zystitis brauchbar und bei Pyelonephritis falsch."]},
 {id:"urin",name:"Urin",kurz:"Urin",barriere:"Renale Elimination bestimmt die Konzentration im Harn.",regeln:["Caspofungin erreicht den Urin nicht — bei Candidurie ist Fluconazol die richtige Substanz.","Bei Anurie unter Nierenersatzverfahren entfällt der Urinweg vollständig; dann entscheidet die Katheterentfernung."]},
 {id:"prostata",name:"Prostata",kurz:"Prostata",barriere:"Lipidmembran und pH-Gradient — nur lipophile, basische Substanzen kommen an.",regeln:["Betalaktame und Vancomycin erreichen die Prostata nicht, obwohl das Antibiogramm sensibel meldet.","Geeignet wären Cotrimoxazol und Chinolone — nicht im Routinebestand."]},
 {id:"knochen",name:"Knochen",kurz:"Knochen",barriere:"Mineralisierte Matrix mit geringer Perfusion; Sequester sind gar nicht perfundiert.",regeln:["Vancomycin ist schlecht knochengängig — bei MRSA-Osteomyelitis ein relevanter Nachteil.","Ohne Débridement nekrotischen Knochens kein Therapieerfolg.","Therapiedauer Wochen bis Monate."]},
 {id:"gelenk",name:"Gelenk",kurz:"Gelenk",barriere:"Synoviale Penetration meist gut; begrenzend sind Inokulum und Fremdmaterial.",regeln:["Spülung oder Arthroskopie gehören zur Therapie.","Bei Prothese zusätzlich Biofilmproblematik."]},
 {id:"vegetation",name:"Vegetation bei Endokarditis",kurz:"Vegetation",barriere:"Avaskuläre Fibrin-Thrombozyten-Schicht, sehr hohes Inokulum, Bakterien in metabolischer Ruhe.",regeln:["Entscheidend ist Bakterizidie und Dauer, nicht Penetration.","Linezolid ist bakteriostatisch und deshalb nicht Mittel der Wahl, obwohl es das Spektrum abdeckt.","Bei MSSA sind Flucloxacillin oder Cefazolin klar überlegen; Vancomycin ist unterlegen."]},
 {id:"abszess",name:"Abszess",kurz:"Abszess",barriere:"Saurer pH, anaerobes Milieu, sehr hohes Inokulum mit Betalaktamase-Last, Bakterien in Stationärphase — vier Versagensgründe gleichzeitig.",regeln:["Aminoglykoside sind im sauren, anaeroben Milieu inaktiv — untauglich, nicht nur schlecht.","Metronidazol wirkt hier besonders gut.","Ab relevanter Größe ist der Abszess ein Drainageproblem."]},
 {id:"weichteil",name:"Weichteil",kurz:"Weichteil",barriere:"Für die meisten Substanzen unproblematisch — solange perfundiert.",regeln:["Bei Schock mit hoher Vasopressordosis bricht die Mikrozirkulation ein, Gewebespiegel fallen deutlich unter die Plasmaspiegel.","Bei nekrotisierender Infektion entscheidet die chirurgische Sanierung, nicht die Substanzwahl."]},
 {id:"eschar",name:"Eschar und avitale Nekrose",kurz:"Eschar",barriere:"Keine Perfusion, kein Antibiotikum. Systemische Substanzen erreichen verbranntes oder nekrotisches Gewebe praktisch nicht.",regeln:["Escharektomie steht vor jeder Substanzempfehlung.","Frühphase: verändertes Verteilungsvolumen; später augmentierte renale Clearance mit systematischer Unterdosierung.","TDM ist beim Verbrennungspatienten Standard, nicht Kür — Dosis nach oben korrigieren."]},
 {id:"biofilm",name:"Biofilm und Fremdmaterial",kurz:"Biofilm",barriere:"Extrazelluläre Polymermatrix, Persisterzellen mit stark reduziertem Stoffwechsel. MHK-Werte aus dem Antibiogramm sind an planktonischen Bakterien bestimmt und hier bedeutungslos.",regeln:["Vancomycin und Betalaktame sind praktisch unwirksam.","Vergleichsweise aktiv: Rifampicin (nie Monotherapie), Fosfomycin, Daptomycin, eingeschränkt Linezolid und Echinocandine.","Ohne Entfernung oder Wechsel des Materials ist die Therapie Suppression, keine Heilung — gilt für ZVK, EVD, Schrittmacher, Gefäß- und Gelenkprothese."]},

/* ---------- Suche ---------- */
let IDX=null;
function searchIndex(){
  const i=[];
  ALLE_SUBS.forEach(s=>i.push({t:s.name,s:s.klasse,h:'#/sub/'+s.id,k:(s.name+' '+s.klasse+' '+s.deckt.join(' ')).toLowerCase()}));
  ALLE_FOKI.forEach(f=>i.push({t:f.name,s:f.block,h:'#/fokus/'+f.id,k:(f.name+' '+f.block+' '+f.def).toLowerCase()}));
  ERREGER.forEach(e=>i.push({t:e.name,s:e.gruppe,h:'#/err/'+e.id,k:(e.name+' '+e.kurz+' '+e.gruppe+' '+e.res.join(' ')).toLowerCase()}));
  KOMPARTIMENTE.forEach(k=>i.push({t:k.name,s:'Kompartiment',h:'#/komp/'+k.id,k:(k.name+' '+k.barriere).toLowerCase()}));
  ABK.forEach(a=>i.push({t:a[0],s:'Abkürzung: '+a[1],h:'#/abk',k:(a[0]+' '+a[1]).toLowerCase()}));
  RG_ZEILEN.forEach(z=>i.push({t:z.name,s:'Hausresistogramm',h:'#/resistogramm',k:(z.name+' resistogramm resistenz').toLowerCase()}));
  RG_BEFUNDE.forEach(b=>i.push({t:b.titel,s:'Hausresistogramm',h:'#/resistogramm',k:(b.titel+' '+b.text).toLowerCase()}));
  return i;
}
function suggest(v){
  const box=document.getElementById('sugg'); v=(v||'').trim().toLowerCase();
  if(v.length<2){box.innerHTML='';document.getElementById('tiles').style.display='';return;}
  IDX=IDX||searchIndex();
  const hits=IDX.filter(x=>x.k.includes(v)).slice(0,12);
  document.getElementById('tiles').style.display='none';
  box.innerHTML=hits.length
    ? `<div class="list" style="margin-top:10px">${hits.map(x=>
      `<button class="row" onclick="go('${x.h}')"><div class="rt"><b>${esc(x.t)}</b><small>${esc(x.s)}</small></div>${chev()}</button>`).join('')}</div>`
    : `<p class="empty">Nichts gefunden. Andere Schreibweise oder kürzeres Stichwort versuchen.</p>`;
}

/* ---------- Aufklappbare Listen ---------- */
function togglePeek(id,kind){
  const el=document.getElementById('it-'+id);
  const open=el.classList.contains('open');
  document.querySelectorAll('.item.open').forEach(x=>{x.classList.remove('open');
    const p=x.querySelector('.peek'); if(p) p.remove();});
  if(open) return;
  el.classList.add('open');
  el.insertAdjacentHTML('beforeend',`<div class="peek">${peekHTML(id,kind)}</div>`);
}
function peekHTML(id,kind){
  if(kind==='sub'){
    const s=byId(ALLE_SUBS,id); const d=s.dosis[0];
    return `<dl class="dl">
      <dt>Deckt</dt><dd>${esc(s.deckt.slice(0,4).join(', '))}</dd>
      <dt>Lücke</dt><dd>${esc(s.decktNicht.slice(0,3).join(', '))}</dd>
      <dt>${esc(d[0])}</dt><dd>${esc(d[1])}</dd>
      <dt>TDM</dt><dd>${esc(s.tdm.split('.')[0])}.</dd></dl>
      <button class="chip full" onclick="go('#/sub/${id}')">Ganze Karte öffnen</button>`;
  }
  if(kind==='fokus'){
    const f=byId(ALLE_FOKI,id); const t=f.therapie[0];
    const subs=(t.subs||[]).map(x=>byId(ALLE_SUBS,x)).filter(Boolean);
    return `<dl class="dl">
      <dt>${esc(t.label)}</dt><dd>${subs.length?esc(subs.map(s=>s.name).join(' + ')):'—'}</dd>
      <dt>Dauer</dt><dd>${esc(f.dauer.split('.')[0])}.</dd>
      <dt>Häufig</dt><dd>${esc(f.erreger.filter(e=>e.h==='haeufig').map(e=>(byId(ERREGER,e.id)||{}).kurz).filter(Boolean).join(', ')||'—')}</dd></dl>

function openGroups(view){return ls('ifk_grp_'+view,'[]');}
function toggleGroup(view,name){
  let o=openGroups(view);
  o = o.includes(name) ? o.filter(x=>x!==name) : o.concat([name]);
  save('ifk_grp_'+view,o); route();
  setTimeout(()=>{const el=document.getElementById('g-'+cssId(name)); if(el&&o.includes(name))
    el.scrollIntoView({block:'nearest'});},20);
}
function allGroups(view,names,open){save('ifk_grp_'+view,open?names:[]);route();}
const cssId=n=>n.replace(/[^a-zA-Z0-9]/g,'');
function groupList(view,groups,order,renderItem){
  const open=openGroups(view);
  const names=order.filter(n=>groups[n]&&groups[n].length);
  return `<div class="gtools">
      <button onclick='allGroups("${view}",${JSON.stringify(names)},true)'>Alle öffnen</button>
      <button onclick='allGroups("${view}",${JSON.stringify(names)},false)'>Alle schließen</button>
    </div>` +
    names.map(n=>{
      const isOpen=open.includes(n);
      return `<button class="gbtn ${isOpen?'open':''}" id="g-${cssId(n)}"
          onclick='toggleGroup("${view}",${JSON.stringify(n)})' aria-expanded="${isOpen}">
          <b>${esc(n)}</b><span class="cnt">${groups[n].length}</span>${chev()}</button>
        ${isOpen?`<div class="gbody">${groups[n].map(renderItem).join('')}</div>`:''}`;
    }).join('');
}

/* ---------- Hausresistogramm ---------- */
const RG_WORT={gruen:"90–100 % wirksam",gelb:"80–89 % wirksam",rot:"unter 80 % wirksam"};
function rgZeileFuerErreger(eid){return RG_ZEILEN.find(z=>z.erreger.includes(eid));}
function rgSpalteFuerSub(sid){return RG_SPALTEN.find(c=>c.sub===sid);}
function rgWert(eid,sid){
  const z=rgZeileFuerErreger(eid), c=rgSpalteFuerSub(sid);
  if(!z||!c) return null;
  return z.w[c.kurz]||null;
}
function sq(v){return `<span class="sq ${v||'leer'}" title="${v?RG_WORT[v]:'nicht ausgewertet'}"></span>`;}
/* Abgleich: welche vorgeschlagenen Substanzen sind lokal schwach gegen häufige Erreger dieses Fokus? */
function rgAbgleich(f){
  const treffer=[];
  const subs=[...new Set((f.therapie||[]).flatMap(t=>t.subs||[]))];
  subs.forEach(sid=>{
    (f.erreger||[]).filter(e=>e.h!=='selten').forEach(e=>{
      const v=rgWert(e.id,sid);
      if(v==='rot'||v==='gelb'){
        const er=byId(ERREGER,e.id), su=byId(ALLE_SUBS,sid);
        if(er&&su) treffer.push({sid,eid:e.id,v,sub:su.name,err:er.kurz,h:e.h});
      }
    });
  });
  return treffer.sort((a,b)=>(a.v==='rot'?0:1)-(b.v==='rot'?0:1));
}
function rgBanner(f){
  const t=rgAbgleich(f); if(!t.length) return '';
  const rot=t.filter(x=>x.v==='rot'), gelb=t.filter(x=>x.v==='gelb');
  return `<div class="card ${rot.length?'warn':''}"><h3>Abgleich mit dem Hausresistogramm</h3>
    ${rot.length?`<div class="rgcard rot"><b>Lokal unter 80 % wirksam</b>
      <ul style="margin:0;padding-left:18px;font-size:14.5px">${rot.map(x=>
        `<li>${esc(x.sub)} gegen <b>${esc(x.err)}</b> (${HAEUF[x.h]}er Erreger dieses Fokus)</li>`).join('')}</ul></div>`:''}
    ${gelb.length?`<div class="rgcard gelb"><b>Lokal 80–89 % wirksam</b>
      <ul style="margin:0;padding-left:18px;font-size:14.5px">${gelb.map(x=>
        `<li>${esc(x.sub)} gegen <b>${esc(x.err)}</b> (${HAEUF[x.h]})</li>`).join('')}</ul></div>`:''}
    ${(()=>{const ex=(typeof RG_AUSNAHMEN!=='undefined'?RG_AUSNAHMEN[f.id]:null)||{};
      const keys=Object.keys(ex).filter(k=>t.some(x=>x.sid===k));
      return keys.length?keys.map(k=>{const s2=byId(ALLE_SUBS,k);
        return `<div class="rgcard gruen"><b>Einordnung: ${esc(s2?s2.name:k)}</b>
          <p style="margin:0;font-size:14.5px">${esc(ex[k])}</p></div>`}).join(''):''})()}
    <p class="note">Stand ${esc(RG_META.stand)}, Auswertung ${esc(RG_META.auswertung)}, alle klinischen Materialien des Hauses — auf der Intensivstation ist mit ungünstigeren Werten zu rechnen.
      <button class="chip" onclick="go('#/resistogramm')" style="margin-left:6px">Resistogramm</button></p></div>`;
}

/* ---------- Resistenzschicht ---------- */
const resWerte=()=>ls('ifk_res','{}');
function setRes(id,v){const w=resWerte();
  if(v==='' ) delete w[id]; else w[id]=parseFloat(String(v).replace(',','.'));
  save('ifk_res',w);}
function resTreffer(){
  const w=resWerte();
  return RESISTENZ_FELDER.filter(f=>{
    if(f.info) return false;
    const v=w[f.id]; if(v===undefined||isNaN(v)) return false;
    return f.unter ? v < f.schwelle : v >= f.schwelle;
  });
}
function resFuerFokus(fid){return resTreffer().filter(f=>(f.foki||[]).includes(fid));}
function resBanner(fid){
  const t=resFuerFokus(fid); if(!t.length) return '';
  const w=resWerte();
  return t.map(f=>`<div class="rbanner"><b>LOKALE RESISTENZLAGE</b>
    ${esc(f.label)}: <b style="display:inline;color:var(--ink)">${w[f.id]}${esc(f.einheit)}</b> —
    ${esc(f.regel)}
    <div class="chips" style="margin-top:8px">${(f.subs||[]).map(sid=>{const s2=byId(ALLE_SUBS,sid);
      return s2?`<button class="chip ${s2.haus==='erweitert'?'ext':''}" onclick="go('#/sub/${s2.id}')">${esc(s2.name)}</button>`:''}).join('')}</div></div>`).join('');
}

/* ---------- Router ---------- */
function route(){
  const p=(location.hash.replace(/^#/,'')||'/').split('/').filter(Boolean);
  if(!p.length) return viewHome();
  switch(p[0]){
    case 'subs':return viewSubs(); case 'sub':return viewSub(p[1]);
    case 'foki':return viewFoki(); case 'fokus':return viewFokus(p[1]);
    case 'erreger':return viewErreger(); case 'err':return viewErr(p[1]);
    case 'komp':return p[1]?viewKomp(p[1]):viewKompListe();
    case 'kombi':return viewKombi(); case 'hausstandard':return viewHausstandard();
    case 'schwanger':return viewSchwanger(); case 'abk':return viewAbk();
    case 'abs':return viewAbs(); case 'resistenz':return viewResistenz();
    case 'resistogramm':return viewResistogramm(); case 'referenzen':return viewReferenzen();
    case 'ueber':return viewUeber(); default:return viewHome();
  }
}
window.addEventListener('hashchange',route);
window.addEventListener('scroll',()=>{document.getElementById('hdr').classList.toggle('scrolled',window.scrollY>4)},{passive:true});
route();
