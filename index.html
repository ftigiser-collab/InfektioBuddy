ppression","def":"Angioinvasive Schimmelpilzinfektion mit rascher Gewebenekrose — rhinozerebral, pulmonal oder kutan (Verbrennungen, Trauma). Schon der Verdacht ist ein Notfall.","erreger":[{"id":"mucorales","h":"haeufig"}],"therapie":[{"label":"Erste Wahl","subs":["ambisome"],"text":"Liposomales Amphotericin B in Hochdosis, 5–10 mg/kg/d."},{"label":"Bei Niereninsuffizienz oder Unverträglichkeit","subs":["isavuconazol"],"text":"Loading 3 × 200 mg an Tag 1–2, dann 1 × 200 mg."}],"kombi":"Keine belegte Kombination; Débridement ist entscheidend.","sanierung":["Frühes, radikales chirurgisches Débridement (R0 anstreben)"],"diagnostik":["Gewebe für Mikroskopie, Kultur, Mucorales-PCR und Histologie — nicht im Kühlschrank lagern","CT: inverses Halo-Zeichen"],"deeskalation":"Nach Ansprechen Umstellung auf orales Isavuconazol oder Posaconazol.","dauer":"Wochen bis Monate, bis zur Rückbildung und Ende der Immunsuppression.","komp":["weichteil","lunge","eschar"],"pitfalls":["Voriconazol und Echinocandine sind unwirksam — ein Durchbruch unter Voriconazol-Prophylaxe ist verdächtig.","Ketoazidose und Eisenüberladung korrigieren, Immunsuppression reduzieren."],"quelle":"ECMM/MSG-ERC Global Guideline Mucormycosis (Lancet Infect Dis 2019)"}],"KOMBI":[{"partner":["meropenem","linezolid"],"grund":"Lücke","text":"Das Carbapenem deckt weder MRSA noch E. faecium — Linezolid schließt genau diese Flanke.","wo":"Schwere nosokomiale Sepsis mit MRE-Risiko und grampositiver Flanke.","ende":"Grampositiver Nachweis ausgeblieben → Linezolid absetzen."},{"partner":["meropenem","vancomycin"],"grund":"Lücke","text":"Alternative grampositive Abdeckung, wenn MRSA im Vordergrund steht und keine Pneumonie vorliegt.","wo":"Sepsis mit MRSA-Risiko ohne pulmonalen Fokus.","ende":"Erregernachweis, dann fokussieren."},{"partner":["cefepim","metronidazol"],"grund":"Anaerobier","text":"Cefepim hat keine Anaerobierwirkung — bei abdominellem Fokus zwingend zu ergänzen.","wo":"Abdomineller Fokus, wenn Pip/Tazo wegen AmpC ungeeignet ist.","ende":"Fokus geklärt und Erreger bekannt."},{"partner":["piptazo","azithromycin"],"grund":"Atypische","text":"Betalaktame sind gegen intrazelluläre Erreger unwirksam; das Makrolid deckt Legionellen ab.","wo":"Schwere ambulant erworbene Pneumonie.","ende":"Legionellen-Antigen negativ und klinische Stabilisierung."},{"partner":["meropenem","fosfomycin","linezolid"],"grund":"Breite im Schock","text":"Leitliniengerechte Dreierkombination: Meropenem für die gramnegative Breite, Fosfomycin als zweiter gramnegativer Partner, Linezolid für die MRSA-Flanke mit besserer Lungenpenetration. Fosfomycin ist einer der drei in der S3 020-013 genannten gramnegativen Partner (neben Chinolon und Tobramycin).","wo":"HAP/VAP im septischen Schock mit MRE-Risiko.","ende":"Antibiogramm liegt vor oder Schock durchbrochen — harter Prompt nach 48–72 h."},{"partner":["meropenem","fosfomycin"],"grund":"Resistenzprävention und Lücke","text":"Fosfomycin erweitert das Spektrum und verhindert die Resistenzentwicklung unter Monotherapie; im ZNS zusätzlich wegen guter Liquorgängigkeit.","wo":"Schwer behandelbare Gramnegative, Ventrikulitis mit nicht wechselbarer Drainage.","ende":"Antibiogramm."},{"partner":["vancomycin","fosfomycin"],"grund":"Biofilm und Resistenzprävention","text":"Rifampicin ist der etablierte biofilmaktive Partner bei Staphylokokken; Fosfomycin die Alternative bei Rifampicin-Resistenz oder Interaktionen.","wo":"Grampositive Infektion mit Fremdmaterial, Protheseninfektion.","ende":"Nach Fokussanierung beziehungsweise Materialentfernung."},{"partner":["piptazo","linezolid"],"grund":"Toxinsuppression","text":"Bei nekrotisierender Fasciitis und STSS gehört ein Proteinsynthesehemmer dazu. Clindamycin ist die besser belegte Wahl: In einer propensity-gematchten Kohorte mit je 1592 Patienten lag die Sterblichkeit unter adjuvantem Linezolid höher (90 Tage 18,1 % gegen 15,7 %, ein Jahr 23,1 % gegen 17,8 %), bei niedrigerer CDI-Rate. Clindamycin gehört nicht zum Routinebestand.","wo":"Nekrotisierende Weichteilinfektion, STSS, peripartale GAS-Infektion.","ende":"Nach chirurgischer Sanierung und Stabilisierung, Deeskalation nach Kultur."}],"NEG":[{"text":"Piperacillin/Tazobactam + Metronidazol","warum":"Anaerobier bereits abgedeckt, kein Zusatznutzen."},{"text":"Meropenem + Metronidazol","warum":"Anaerobier bereits abgedeckt."},{"text":"Ampicillin/Sulbactam + Metronidazol","warum":"Anaerobier bereits abgedeckt — auch bei Aspiration nicht erforderlich."},{"text":"Meropenem + Piperacillin/Tazobactam","warum":"Doppeltes Betalaktam ohne Nutzen."},{"text":"Vancomycin + Piperacillin/Tazobactam (wenn vermeidbar)","warum":"Additive Nephrotoxizität, messbar erhöhtes AKI-Risiko."},{"text":"Linezolid + SSRI, Fentanyl oder Methylenblau","warum":"Serotoninsyndrom durch MAO-Hemmung."},{"text":"Fosfomycin als Monotherapie","warum":"Rasche Resistenzentwicklung — nur bei Harnwegsinfektion vertretbar."},{"text":"Doppelte gramnegative Abdeckung ohne septischen Schock","warum":"Laut Leitlinienkommission der S3 020-013 Übertherapie."},{"text":"Glykopeptid oder Aminoglykosid routinemäßig bei febriler Neutropenie","warum":"Kein signifikanter Vorteil gegenüber der Monotherapie."}],"SCHWANGER":[{"gruppe":"Penicilline, Cephalosporine, Carbapeneme","bewertung":"geeignet","text":"Gelten in Schwangerschaft und Stillzeit als einsetzbar."},{"gruppe":"Azithromycin","bewertung":"geeignet","text":"In der Geburtshilfe etabliert."},{"gruppe":"Clarithromycin","bewertung":"zurueckhaltend","text":"Azithromycin bevorzugen."},{"gruppe":"Metronidazol","bewertung":"zurueckhaltend","text":"Breit eingesetzt; Zurückhaltung im ersten Trimenon wird diskutiert."},{"gruppe":"Vancomycin","bewertung":"geeignet","text":"Bei Indikation einsetzbar."},{"gruppe":"Linezolid, Fosfomycin i.v., Caspofungin","bewertung":"zurueckhaltend","text":"Begrenzte Datenlage, nur bei klarer Indikation."},{"gruppe":"Aminoglykoside","bewertung":"vermeiden","text":"Fetale Ototoxizität — ohnehin nicht Routinebestand."},{"gruppe":"Chinolone, Tetrazykline","bewertung":"vermeiden","text":"Im Haus ohnehin nicht vorhanden."}],"ABS_TIMEOUT":[{"frage":"Liegt überhaupt eine bakterielle Infektion vor?","text":"Fieber, Leukozytose und CRP-Anstieg sind unspezifisch. Nichtinfektiöse Ursachen prüfen: Atelektase, Überwässerung, ARDS-Progress, Thrombose, Medikamentenfieber, Pankreatitis, Hämatomresorption."},{"frage":"Ist der Fokus gefunden und saniert?","text":"Kein Antibiotikum ersetzt Drainage, Katheterentfernung, Revision oder Entlastung. Bei unsaniertem Fokus greift keine der Kurzdauerregeln."},{"frage":"Liegt ein Erregernachweis vor?","text":"Wenn ja: fokussieren, nicht nur deeskalieren. Wenn nein und der Patient stabil ist: beenden statt verbreitern."},{"frage":"Ist das Regime noch das richtige?","text":"Kombinationspartner absetzen, sobald der Grund entfallen ist. Doppelte gramnegative Abdeckung außerhalb des septischen Schocks ist Übertherapie."},{"frage":"Stimmt die Dosis noch?","text":"Nierenfunktion, Nierenersatzverfahren, augmentierte Clearance, Verteilungsvolumen bei Kapillarleck. TDM veranlasst?"},{"frage":"Steht ein Enddatum im Verordnungssystem?","text":"Eine Therapie ohne festgelegtes Ende läuft im Median deutlich länger als nötig. Stopp-Datum bei jeder Verordnung setzen."}],"ABS_NICHT":[{"was":"Asymptomatische Bakteriurie beim Katheterträger","warum":"Bei jedem Dauerkatheterträger ist der Urin nach kurzer Zeit besiedelt. Auf der ITS ist der Urinbefund bei unklarem Fieber oft der erste positive Befund und wird dann fälschlich zum Fokus erklärt.","fokus":"katheter_hwi"},{"was":"Candida im Trachealsekret","warum":"Keine Erregerwertung, keine antimykotische Therapie. Gleiches gilt für Enterokokken, apathogene Corynebakterien und Neisserien im Trachealsekret.","fokus":"hap_ohne"},{"was":"Einzelnachweis koagulasenegativer Staphylokokken in der Blutkultur","warum":"Häufig Kontamination — zwei getrennt abgenommene Paare entscheiden. Bei S. aureus gilt das ausdrücklich nicht.","fokus":"crbsi"},{"was":"Purulentes Trachealsekret ohne neues Infiltrat","warum":"Beatmungsassoziierte Tracheobronchitis: Trachealbesiedlung des beatmeten Patienten ist die Regel, nicht die Ausnahme.","fokus":"vat"},{"was":"Unkompliziertes Aspirationsereignis","warum":"Die Pneumonitis der ersten 24 bis 48 Stunden ist chemisch, nicht bakteriell. Absaugen und gegebenenfalls bronchoskopisches Bergen sind die Maßnahme.","fokus":"aspiration"},{"was":"Wundabstrich ohne klinische Infektionszeichen","warum":"Jede chronische Wunde ist besiedelt — gilt für diabetisches Fußsyndrom, Verbrennungswunde und Dekubitus gleichermaßen.","fokus":"dfs"},{"was":"Oberflächliche Wundinfektion ohne systemische Zeichen","warum":"Eröffnung, Débridement und Wundpflege genügen.","fokus":"ssi"},{"was":"Candida-Nachweis aus nicht sterilem Material","warum":"Drainageabstrich oder Trachealsekret sind kein Behandlungsgrund.","fokus":"intraabdominelle_candidose"},{"was":"Bakteraszites ohne Zellvermehrung","warum":"Kolonisation, keine spontan bakterielle Peritonitis — die Zellzahl über 250 PMN/mm³ entscheidet.","fokus":"sbp"},{"was":"Prophylaxe bei prognostiziert schwerer Pankreatitis","warum":"Kann nicht generell empfohlen werden. Behandelt wird bei Nachweis oder begründetem Verdacht auf infizierte Nekrose.","fokus":"pankreasnekrose"},{"was":"Systemantibiose bei der Verbrennungswunde allein","warum":"Keine prophylaktische Gabe. Escharektomie steht vor jeder Substanzempfehlung.","fokus":"verbrennung"},{"was":"Eskalation bei persistierendem Fieber unter Neutropenie","warum":"Nach 72 bis 96 Stunden bei klinischer Stabilität wird die primäre empirische Therapie fortgesetzt, nicht verbreitert.","fokus":"febrile_neutropenie"}],"ABS_DEESK":[{"regel":"Kombinationspartner fallen mit ihrem Grund","text":"Jede Kombination in dieser App trägt einen Grund und ein Absetzkriterium. Ist der Grund entfallen — Antibiogramm da, Schock durchbrochen, Erreger ausgeschlossen — fällt der Partner weg."},{"regel":"Fokussieren schlägt Deeskalieren","text":"Bei Erregernachweis auf die schmalste wirksame Substanz wechseln, nicht nur eine Stufe zurück."},{"regel":"Negativer Befund bei stabilem Patienten","text":"Kein Erregernachweis, kein Fokus, klinische Stabilisierung: beenden. Die stille Fortführung ist die häufigste Fehlentscheidung."},{"regel":"Procalcitonin zur Beendigung, nicht zur Indikation","text":"PCT hilft bei der Entscheidung zum Absetzen. Für den Therapiebeginn ist es kein geeigneter Auslöser."},{"regel":"Reserveantibiotika brauchen ein Ablaufdatum","text":"Carbapeneme, neue Betalaktam-Inhibitor-Kombinationen und Cefiderocol nach Antibiogramm konsequent zurücknehmen."},{"regel":"Antimykotika ohne Nachweis","text":"Ohne Erregernachweis und ohne klinischen Anhalt nach etwa fünf Tagen beenden."}],"ABS_RESERVE":[{"sub":"meropenem","grund":"Selektionsdruck auf Carbapenemase-Bildner; nach Antibiogramm konsequent deeskalieren."},{"sub":"ceftazidim_avibactam","grund":"Reserve bei KPC und OXA-48. Einsatz nach Resistenzmechanismus, nicht nach Antibiogramm allein — mit Mikrobiologie abstimmen."},{"sub":"cefiderocol","grund":"Letzte Linie bei MBL-Bildnern und Acinetobacter. Nur nach infektiologischer Abstimmung."},{"sub":"linezolid","grund":"Bei Bakteriämie und Endokarditis bakteriostatisch und damit unterlegen; Reserve für MRSA-Pneumonie und VRE."},{"sub":"daptomycin","grund":"Reserve für MRSA-Bakteriämie und VRE; bei Pneumonie unwirksam."},{"sub":"caspofungin","grund":"Ohne Erregernachweis nach etwa fünf Tagen beenden."},{"sub":"voriconazol","grund":"TDM-Pflicht, erhebliche Interaktionen; Einsatz mit Infektiologie abstimmen."},{"sub":"ciprofloxacin","grund":"Rote-Hand-Brief: restriktiver Einsatz wegen Tendinopathien, Aortenaneurysma und neuropsychiatrischen Nebenwirkungen."},{"sub":"clindamycin","grund":"Höchstes CDI-Risiko aller gängigen Antibiotika — bei Toxinsuppression dennoch indiziert, sonst zurückhaltend."}],"GRUPPEN":[["staph","Staphylokokken"],["strepto","Streptokokken ung"],["ELF","Epitheliale Auskleidungsflüssigkeit der Lunge — maßgeblich für die Pneumonietherapie"],["ESBL","Extended-Spectrum-Betalaktamase — hydrolysiert Penicilline und Cephalosporine"],["EVD","Externe Ventrikeldrainage"],["FRI","Frakturassoziierte Infektion"],["fT>MHK","Anteil des Dosisintervalls, in dem die freie Konzentration über der MHK liegt"],["G-BA","Gemeinsamer Bundesausschuss — Reserveantibiotika mit Sonderregeln"],["GAS / GBS","Streptokokken der Gruppe A (S. pyogenes) bzw. Gruppe B (S. agalactiae)"],["GFR","Glomeruläre Filtrationsrate in ml/min"],["GU / NGU","Gonorrhoische / nicht-gonorrhoische Urethritis"],["HAP / VAP","Nosokomiale Pneumonie / beatmungsassoziierte Pneumonie"],["HRS","Hepatorenales Syndrom"],["HWZ","Halbwertszeit"],["IE","Infektiöse Endokarditis"],["IVIG","Intravenöse Immunglobuline"],["KI","Im BG-Dokument nicht erläutert (vermutlich Kurzinfusion)"],["KNS","Koagulasenegative Staphylokokken"],["KPC / OXA-48 / MBL","Carbapenemasen: Klebsiella-pneumoniae-Carbapenemase, Oxacillinase 48, Metallo-Betalaktamase"],["LRINEC","Score zur Risikoabschätzung einer nekrotisierenden Fasciitis"],["MHK","Minimale Hemmkonzentration"],["MRE","Multiresistente Erreger"],["MRGN (3MRGN / 4MRGN)","Multiresistente gramnegative Stäbchen mit Resistenz gegen 3 bzw. 4 Antibiotikagruppen"],["MRSA / MSSA","Methicillin-resistenter bzw. -sensibler Staphylococcus aureus"],["NAT","Nukleinsäureamplifikationstest (PCR)"],["NF / STSS","Nekrotisierende Fasciitis / Streptokokken-induziertes toxisches Schocksyndrom"],["OA","Oberarzt — Oberarztantibiotikum"],["PAP","Perioperative Antibiotikaprophylaxe"],["PBP","Penicillinbindeprotein — Angriffspunkt der Betalaktame"],["PEDIS","Perfusion, Extent, Depth, Infection, Sensation — Einteilung des diabetischen Fußes"],["PEN-FAST","Score zur Penicillinallergie: Five years, Anaphylaxis/Angioedema, Severe cutaneous reaction, Treatment"],["PJI","Periprothetische Gelenkinfektion"],["PK/PD","Pharmakokinetik und Pharmakodynamik; zeitabhängig versus konzentrationsabhängig"],["PMN","Polymorphkernige neutrophile Granulozyten (Zellzahl im Aszites bei SBP)"],["R %","Anteil resistent getesteter Isolate"],["ROSC","Wiedererlangung eines Spontankreislaufs"],["S / I / R","EUCAST: sensibel bei Standarddosis / sensibel bei erhöhter Dosis / resistent"],["SAB","Staphylococcus-aureus-Bakteriämie"],["SAT","Suppressive Antibiotikatherapie"],["SBP","Spontan bakterielle Peritonitis"],["SCAR","Schwere kutane Arzneimittelreaktion"],["SSI","Postoperative Wundinfektion"],["TDM","Therapeutisches Drug Monitoring — Spiegelbestimmung zur Dosissteuerung"],["TEE","Transösophageale Echokardiografie"],["VAT","Beatmungsassoziierte Tracheobronchitis"],["VRE","Vancomycin-resistente Enterokokken"]],"HAEUSER":{"bg":{"id":"bg","name":"BG Klinik Ludwigshafen","kurz":"BG Ludwigshafen","dok":{"titel":"Antibiotika-Leitlinie","version":"10.1","stand":"09/2026","von":"ABS-Team, Freigabe durch die Arzneimittelkommission","ueberarbeitung":"jährlich","hinweis":"Nur zum internen Dienstgebrauch."},"seiten":{"leitlinie":true,"resistenz":true,"prophylaxe":true,"formular":true,"allergie":true,"dosierhilfen":true},"ll":{"sepsis_unklar":{"kap":"15.1","titel":"Sepsis, unbekannter Fokus","regime":[{"label":"Sepsis, ambulant oder nosokomial erworben","subs":["piptazo"],"opt":["linezolid"],"t":"Piperacillin/Tazobactam 4 × 4,5 g i.v.; bei Risiko für MRSA/VRE plus Linezolid 2 × 600 mg i.v.","dauer":"7–10 Tage"},{"label":"Septischer Schock","subs":["piptazo","linezolid"],"opt":["ciprofloxacin"],"t":"Piperacillin/Tazobactam 4 × 4,5 g plus Linezolid 2 × 600 mg i.v.; bei Risiko für MRGN plus Ciprofloxacin 3 × 400 mg i.v.","dauer":"7–10 Tage"}],"allergie":"Sepsis: Meropenem 3 × 1 g i.v. · septischer Schock: Meropenem 3 × 2 g i.v.","hinweise":["Bei hohem Risiko einer Pilzinfektion zusätzlich empirisch antimykotisch behandeln (Kap. 17).","Nach mikrobiologischem Befund rasch auf ein gezieltes, möglichst enges Regime umstellen."],"ref":"S2k Kalkulierte parenterale Initialtherapie (2018), S3 Sepsis Update 2025","wahl":"Linezolid im Schock immer, sonst nur bei MRSA/VRE-Risiko. Ciprofloxacin bei MRGN-Risiko (Kolonisation, Vortherapie, nosokomial, Hochprävalenzland)."},"crbsi":{"kap":"15.6","titel":"Sepsis bei intravenösem Katheter","regime":[{"label":"Sepsis oder septischer Schock","subs":["piptazo","daptomycin"],"t":"Piperacillin/Tazobactam 4 × 4,5 g plus Daptomycin 1 × 10 mg/kg i.v.","dauer":"7–10 Tage","wahl":"Daptomycin bevorzugt bei eingeschränkter Nierenfunktion. Bei möglichem pulmonalem Fokus Vancomycin — Daptomycin ist in der Lunge inaktiv."},{"label":"Alternative zu Daptomycin","subs":["vancomycin"],"t":"Vancomycin i.v., Spiegelkontrolle, Dosisanpassung über doseeasy.de"}],"allergie":"Sepsis: Meropenem 3 × 1 g i.v. · septischer Schock: Meropenem 3 × 2 g i.v.","hinweise":["Nach mikrobiologischem Befund rasch auf ein gezieltes Regime umstellen.","Bei S. aureus im Blut gelten die SAB-Regeln (Kap. 16)."],"ref":"S2k 2018, S3 Sepsis 2025"},"sab":{"kap":"16.1","titel":"Staphylococcus-aureus-Bakteriämie (MSSA)","regime":[{"label":"Unkompliziert","subs":["cefazolin"],"alt":["flucloxacillin"],"t":"Cefazolin 3 × 2 g i.v. oder Flucloxacillin 6 × 2 g i.v.","dauer":"14 Tage ab der ersten sterilen Blutkultur","wahl":"Cefazolin bevorzugt: gleich wirksam, besser verträglich, nur 3 Gaben. Flucloxacillin bei ZNS-Beteiligung — Cefazolin ist nicht liquorgängig."},{"label":"Kompliziert","subs":["cefazolin"],"alt":["flucloxacillin"],"t":"Cefazolin 3 × 2 g oder Flucloxacillin 6 × 2 g i.v.","dauer":"4–6 Wochen ab der ersten sterilen Blutkultur","wahl":"Cefazolin bevorzugt; Flucloxacillin bei ZNS-Beteiligung (Hirnabszess, Meningitis)."},{"label":"Mit einliegendem Fremdkörper","subs":["cefazolin","rifampicin"],"alt":["flucloxacillin","fosfomycin"],"t":"Cefazolin oder Flucloxacillin wie oben, plus Rifampicin 2 × 450 mg i.v./p.o. oder plus Fosfomycin 3 × 5 g i.v.","dauer":"4–6 Wochen","wahl":"Rifampicin ist der Standardpartner gegen Biofilm — erst nach negativer Blutkultur und Débridement. Fosfomycin bei Rifampicin-Resistenz, relevanten Interaktionen oder Lebererkrankung; Natriumlast beachten."}],"hinweise":["S. aureus in der Blutkultur ist immer eine Bakteriämie: sofort S.-aureus-wirksam behandeln — Carbapeneme, Pip/Tazo und Cephalosporine der Gruppe 3 reichen nicht.","Rifampicin bei über 75-Jährigen 2 × 300 mg.","Vorgehen: Anamnese und Untersuchung (Drogen i.v., kardiale Fremdkörper, Spondylodiszitis, Embolien), Fokussuche, Gefäßkatheter wechseln, Folge-Blutkulturen spätestens nach 48–72 h, TEE bei allen Patienten.","Unkompliziert nur, wenn nach 48–72 h fieberfrei, Folge-Blutkulturen negativ, keine Endokarditis, keine Knochen- oder Gelenkbeteiligung, keine Absiedlungen, kein nicht sanierbarer Fokus.","Kompliziert, sobald eines zutrifft: Fieber nach 48–72 h, Endokarditis, Implantate, Blutkulturen 2–4 Tage nach der ersten noch positiv, tiefer Fokus oder Metastasen, unklarer Fokus.","MRSA siehe Kap. 19.1 (Erregerseite MRSA)."],"ref":"Praxisalgorithmus SAB ABS-Netzwerk Rhein-Neckar, S3 Sepsis 2025","dauerRegel":"14 Tage (unkompliziert) bzw. 4–6 Wochen (kompliziert) — gezählt ab der ersten sterilen Blutkultur, nicht ab Therapiebeginn."},"candidaemie":{"kap":"17.1","titel":"Candidämie","regime":[{"label":"1. Wahl","subs":["caspofungin"],"t":"Caspofungin Tag 1: 70 mg, ab Tag 2: 50 mg i.v. (über 80 kg: 70 mg)","dauer":"14 Tage ab der ersten sterilen Blutkultur"},{"label":"2. Wahl","subs":["ambisome"],"t":"Liposomales Amphotericin B 1 × 3 mg/kg i.v."}],"hinweise":["Candida in der Blutkultur ist nie Kontamination — immer behandeln.","Bei Neutropenie mindestens 14 Tage und bis zum Ende der Neutropenie; bei disseminierter Candidose länger.","Gefäßzugänge und Blasenkatheter innerhalb 48–72 h entfernen oder wechseln.","Augenärztliches Konsil; bei Endophthalmitis Eskalation auf liposomales Amphotericin B 3 mg/kg über 4–6 Wochen.","Blutkulturen alle 48 h bis mehrfach negativ; TEE bei persistierender oder ambulant erworbener Candidämie, kardialen Devices oder Endokarditisverdacht.","Risikofaktoren unter anderem: schwere thermische Verletzungen, lange ITS-Verweildauer, ZVK, parenterale Ernährung, Breitspektrumantibiotika, Anastomoseninsuffizienz, Nierenersatzverfahren."],"ref":"ECMM/ISHAM/ASM Global Guideline Candidiasis 2025","dauerRegel":"14 Tage ab der ersten sterilen Blutkultur. Bei Neutropenie mindestens bis zum Ende der Neutropenie und zur klinischen Besserung; bei Disseminierung länger.","wahl":"Caspofungin für alle; liposomales Amphotericin B bei Augen-, ZNS- oder Harnwegsbeteiligung (Echinocandine erreichen diese Kompartimente nicht) und bei Echinocandin-Resistenz."},"aspergillose":{"kap":"17.2","titel":"Invasive pulmonale und tracheobronchiale Aspergillose","regime":[{"label":"1. Wahl","subs":["voriconazol"],"t":"Voriconazol Tag 1: 2 × 6 mg/kg, ab Tag 2: 2 × 4 mg/kg i.v.","dauer":"12 Wochen bzw. bis zum vollständigen Ansprechen"},{"label":"2. Wahl (Unverträglichkeit, Azolresistenz)","subs":["ambisome"],"t":"Liposomales Amphotericin B 1 × 3 mg/kg i.v."}],"hinweise":["Voriconazol: TDM mit erster Spiegelkontrolle in den ersten 5 Tagen, Zielspiegel 2–6 mg/l; Transaminasen und QT kontrollieren.","Diagnostik bei Risikopatienten mit persistierendem Fieber > 72 h trotz adäquater Therapie, neuem Fieber nach > 48 h, Pleuraschmerz, Hämoptysen oder respiratorischer Verschlechterung: BAL mit Kultur und Galactomannan, Serum-Galactomannan, Dünnschicht-CT.","Risikofaktoren unter anderem ARDS, Influenza, COVID-19, COPD, Leberzirrhose, Steroide, Neutropenie, Transplantation."],"ref":"S1 Invasive pulmonale Aspergillose bei kritisch Kranken (bis 15.12.2029)","dauerRegel":"12 Wochen bzw. bis zum vollständigen Ansprechen.","wahl":"Voriconazol für alle; liposomales Amphotericin B bei Leberversagen, nicht beherrschbaren Interaktionen, Azolresistenz oder Verdacht auf Mucor (Durchbruch unter Azol)."},"mucormykose":{"kap":"17.3","titel":"Invasive Mucormykose","regime":[{"label":"Verdacht auf Mucormykose","subs":["ambisome"],"t":"Liposomales Amphotericin B 1 × 10 mg/kg i.v.","dauer":"Wochen bis Monate"},{"label":"Bei vorbestehender Niereninsuffizienz","subs":["isavuconazol"],"t":"Isavuconazol Tag 1–2: 3 × 200 mg, ab Tag 3: 1 × 200 mg i.v."}],"hinweise":["Bereits der Verdacht ist ein Notfall.","Hinweise: mucortypische Mikroskopie, Hohlorganperforation unter Immunsuppression, inverses Halo-Zeichen im CT.","Material: so viel wie möglich, nicht lagern und nicht kühlen; Mikroskopie, panfungale und Mucorales-PCR, Speziesbestimmung, Resistogramm.","Chirurgie: R0-Resektion anstreben; Gewebe an Pathologie und in NaCl mit genauem Entnahmeort an die Mikrobiologie."],"ref":"ECMM/MSG-ERC Global Guideline Mucormycosis, Lancet 2019","wahl":"Liposomales Amphotericin B für alle; Isavuconazol bei vorbestehender Niereninsuffizienz und als orale Folgetherapie."},"cdi":{"kap":"18","titel":"Clostridioides-difficile-assoziierte Diarrhö","regime":[{"label":"Primärtherapie","subs":["vancomycin"],"t":"Vancomycin Kapseln 4 × 125 mg p.o.; über Sonde: 500 mg aus der Injektionsflasche in 30 ml Wasser lösen, in Teilmengen geben","dauer":"10 Tage"},{"label":"Erhöhtes Rezidivrisiko oder 1. Rezidiv","subs":["fidaxomicin"],"t":"Fidaxomicin 2 × 200 mg p.o.","dauer":"10 Tage"},{"label":"Keine enterale Therapie möglich","subs":["metronidazol"],"t":"Metronidazol 3 × 500 mg i.v.","dauer":"10 Tage"}],"hinweise":["Schwere CDI bei Fieber > 38,5 °C, Leukozyten > 15/nl oder Kreatininanstieg > 50 %.","Komplizierte (fulminante) CDI bei Hypotension, septischem Schock, Laktat ≥ 2,2 mmol/l, Ileus, toxischem Megakolon, Perforation — notfallmäßige chirurgische Vorstellung.","Bei Kolondilatation > 6 cm oder (Sub-)Ileus Therapie über Sonde antegrad oder retrograd.","Auslösendes Antibiotikum absetzen, keine Motilitätshemmer, PPI-Verzicht erwägen.","Bei schwerem Bild und hochgradigem Verdacht Therapie direkt nach Abgabe der Stuhlprobe."],"ref":"S2k Gastrointestinale Infektionen","wahl":"Fidaxomicin statt Vancomycin bei Rezidivrisiko: Alter > 65, Immunsuppression, Niereninsuffizienz, fortgesetzte Antibiose, frühere CDI. Metronidazol i.v. nur, wenn enteral nichts möglich ist."},"hap_ohne":{"kap":"13","titel":"Nosokomiale Pneumonie ohne MRE-Risiko","regime":[{"label":"Mittelschwere Klinik ohne MRE-Risiko","subs":["ampsulb"],"t":"Ampicillin/Sulbactam 3 × 3 g i.v.","dauer":"7 Tage"}],"allergie":"Moxifloxacin 1 × 400 mg i.v.","hinweise":["Sepsis oder septischer Schock: Regime nach Kap. 15.2 (Fokus HAP mit MRE-Risiko).","MRE-Risiko: Antibiotika > 24 h in den letzten 30 Tagen, Hospitalisierung ≥ 5 Tage vor Krankheitsbeginn, MRGN- oder MRSA-Kolonisation, Versorgung in einem Hochprävalenzland in den letzten 12 Monaten, septischer Schock, ARDS, Hämodialyse. Zusätzlich für Pseudomonas: fortgeschrittene COPD, Bronchiektasen, bekannte Kolonisation."],"ref":"S3 Nosokomiale Pneumonie (bis 28.02.2029)"},"hap_mre":{"kap":"13 · 15.2","titel":"Nosokomiale Pneumonie mit MRE-Risiko, pulmonale Sepsis","regime":[{"label":"Mittelschwere Klinik mit Risiko für MRE oder Pseudomonas","subs":["piptazo"],"opt":["linezolid"],"t":"Piperacillin/Tazobactam 4 × 4,5 g i.v.; bei Risiko für MRSA/VRE plus Linezolid 2 × 600 mg i.v.","dauer":"7 Tage"},{"label":"Sepsis, nosokomial, ohne MRE-Risiko","subs":["ampsulb"],"opt":["linezolid"],"t":"Ampicillin/Sulbactam 4 × 3 g i.v.; bei MRSA-Risiko plus Linezolid 2 × 600 mg","dauer":"7–10 Tage"},{"label":"Sepsis, nosokomial, mit MRE-Risiko","subs":["piptazo"],"opt":["linezolid"],"t":"Piperacillin/Tazobactam 4 × 4,5 g i.v.; bei MRSA-Risiko plus Linezolid 2 × 600 mg","dauer":"7–10 Tage"},{"label":"Septischer Schock, nosokomial, ohne MRE-Risiko","subs":["meropenem"],"opt":["linezolid"],"t":"Meropenem 3 × 2 g i.v.; bei MRSA-Risiko plus Linezolid 2 × 600 mg","dauer":"7–10 Tage"},{"label":"Septischer Schock, nosokomial, mit MRE-Risiko","subs":["piptazo","ciprofloxacin"],"opt":["linezolid"],"t":"Piperacillin/Tazobactam 4 × 4,5 g plus Ciprofloxacin 3 × 400 mg i.v.; bei MRSA-Risiko plus Linezolid 2 × 600 mg","dauer":"7–10 Tage"}],"allergie":"Piperacillin/Tazobactam: Meropenem 3 × 1 g i.v. (Schock 3 × 2 g) · Ampicillin/Sulbactam: Moxifloxacin 1 × 400 mg i.v.","hinweise":["MRE-Risiko: Antibiotika > 24 h in den letzten 30 Tagen, Hospitalisierung ≥ 5 Tage vor Krankheitsbeginn, MRGN- oder MRSA-Kolonisation, Versorgung in einem Hochprävalenzland in den letzten 12 Monaten, septischer Schock, ARDS, Hämodialyse. Zusätzlich für Pseudomonas: fortgeschrittene COPD, Bronchiektasen, bekannte Kolonisation.","Die Linezolid-Dosis ist im Dokument bei Sepsis ohne MRE-Risiko nicht angegeben und in Kap. 15.2 teils als „600 g“ gedruckt — gemeint sind 600 mg."],"ref":"S3 Nosokomiale Pneumonie, S3 Sepsis 2025","wahl":"Zwei Fragen entscheiden: Sepsis oder Schock? MRE-Risiko? Linezolid kommt nur bei MRSA- oder VRE-Risiko dazu (Kolonisation, Vorbehandlung)."},"cap":{"kap":"12","titel":"Ambulant erworbene Pneumonie, stationär","regime":[{"label":"Leicht, ohne Komorbidität","subs":["amoxicillin"],"t":"Amoxicillin 3 × 1 g p.o.","dauer":"5 Tage"},{"label":"Leicht mit definierter, stabiler Komorbidität","subs":["amoxclav"],"t":"Amoxicillin/Clavulansäure 3 × 1 g p.o.","dauer":"5 Tage","hinweis":"z. B. chronische Herzinsuffizienz, ZNS-Erkrankung mit Schluckstörung, schwere COPD, PEG, Bronchiektasen, Bettlägerigkeit"},{"label":"Mittelschwer (≤ 2 Minorkriterien und/oder instabile Komorbidität)","subs":["ampsulb"],"t":"Ampicillin/Sulbactam 3 × 3 g i.v.","dauer":"7 Tage, oral, sobald klinisch stabil"}],"allergie":"Moxifloxacin 1 × 400 mg p.o./i.v.","hinweise":["Schwere CAP (1 Majorkriterium oder > 2 Minorkriterien): Kap. 15.2, Fokus schwere CAP.","Diagnostik: Blutkulturen (mindestens 2 Sets), Sputum oder Trachealsekret, respiratorische Viren saisonal, Legionellen-Antigen im Urin.","Influenza (Dez–März): Oseltamivir 2 × 75 mg bei positiver PCR oder empirisch, wenn keine PCR binnen 24 h. RSV-PCR (Nov–April) und SARS-CoV-2-PCR bei Risikopatienten.","Stabilitätskriterien: HF ≤ 100/min, AF ≤ 24/min, RR sys ≥ 90 mmHg, Temperatur ≤ 37,8 °C, gesicherte Nahrungsaufnahme, normales Bewusstsein, pO2 ≥ 60 mmHg bzw. SaO2 ≥ 90 %."],"ref":"S3 CAP Update 2021, Praxisalgorithmus ABS-Netzwerk Rhein-Neckar","wahl":"Schwere und Komorbidität entscheiden: ohne Komorbidität Amoxicillin, mit stabiler Komorbidität Amoxicillin/Clavulansäure, mittelschwer Ampicillin/Sulbactam i.v."},"scap":{"kap":"15.2","titel":"Schwere CAP und pulmonale Sepsis, ambulant erworben","regime":[{"label":"Schwere CAP oder Sepsis","subs":["ampsulb","azithromycin"],"t":"Ampicillin/Sulbactam 4 × 3 g plus Azithromycin 1 × 500 mg i.v.","dauer":"7–10 Tage, Azithromycin 3 Tage"},{"label":"Septischer Schock","subs":["piptazo","azithromycin"],"t":"Piperacillin/Tazobactam 4 × 4,5 g plus Azithromycin 1 × 500 mg i.v.","dauer":"7–10 Tage, Azithromycin 3 Tage"}],"allergie":"Moxifloxacin 1 × 400 mg p.o./i.v.","hinweise":["Schwere CAP: 1 Majorkriterium (Beatmung, Vasopressoren) oder mehr als 2 Minorkriterien.","Minorkriterien: pO2 ≤ 55 mmHg oder AF ≥ 30/min, multilobäre Infiltrate, neue Bewusstseinsstörung, Hypotension mit aggressiver Volumentherapie, akutes Nierenversagen, Leukozyten < 4/nl, Thrombozyten < 100/nl, Hypothermie < 36 °C.","Influenza: Oseltamivir 2 × 75 mg."],"ref":"S3 CAP 2021, S3 Sepsis 2025","wahl":"Schock entscheidet: ohne Ampicillin/Sulbactam, mit Pip/Tazo. Azithromycin immer, für 3 Tage."},"virale_superinfektion":{"kap":"12","titel":"Respiratorische Viren","regime":[{"label":"Influenza (Dez–März)","subs":["oseltamivir"],"t":"Oseltamivir 2 × 75 mg bei positiver PCR; empirisch, wenn die PCR nicht binnen 24 h verfügbar ist"}],"hinweise":["RSV-PCR (Nov–April) bei Frühgeborenen und Risikopatienten.","SARS-CoV-2-PCR bei Risikopatienten."],"ref":"S3 CAP 2021"},"peritonitis_ambulant":{"kap":"11 · 15.3","titel":"Peritonitis, ambulant erworben","regime":[{"label":"Minimal: keine Perforation, kreislaufstabil, kein MRE-Risiko (z. B. phlegmonöse Appendizitis)","subs":["cefuroxim","metronidazol"],"t":"Cefuroxim 3 × 1,5 g plus Metronidazol 3 × 500 mg i.v.","dauer":"1 Tag"},{"label":"Lokalisiert: frische Perforation, kreislaufstabil, kein MRE-Risiko (z. B. perforierte Cholezystitis)","subs":["cefuroxim","metronidazol"],"t":"Cefuroxim 3 × 1,5 g plus Metronidazol 3 × 500 mg i.v.","dauer":"3 Tage"},{"label":"Diffus: ältere Perforation, kreislaufstabil, individuelles MRE-Risiko (z. B. frei perforierte Sigmadivertikulitis)","subs":["piptazo"],"t":"Piperacillin/Tazobactam 3 × 4,5 g i.v.","dauer":"5 Tage"},{"label":"Sepsis mit gastrointestinalem Fokus (Kap. 15.3)","subs":["piptazo"],"opt":["linezolid"],"t":"Piperacillin/Tazobactam 4 × 4,5 g i.v.; bei Risiko für MRSA/VRE plus Linezolid 2 × 600 mg i.v.","dauer":"7–10 Tage"},{"label":"Septischer Schock mit gastrointestinalem Fokus (Kap. 15.3)","subs":["piptazo","linezolid"],"t":"Piperacillin/Tazobactam 4 × 4,5 g plus Linezolid 2 × 600 mg i.v.","dauer":"7–10 Tage"}],"allergie":"Diffuse Peritonitis: Meropenem 3 × 1 g i.v. · Sepsis: Meropenem 3 × 1 g, Schock 3 × 2 g","hinweise":["Immer plus chirurgische Fokuskontrolle oder interventionelle Therapie — die kurzen Dauern gelten nur nach erfolgreicher Sanierung."],"ref":"S2k Kalkulierte parenterale Initialtherapie 2018, S3 Sepsis 2025","dauerRegel":"1, 3 oder 5 Tage je nach Schwere — nur nach erfolgreicher Fokuskontrolle.","wahl":"Schwere entscheidet: keine Perforation → 1 Tag, frische lokale Perforation → 3 Tage, ältere diffuse Perforation → Pip/Tazo 5 Tage. Sepsis oder Schock → Kap. 15.3."},"peritonitis_post":{"kap":"11 · 15.3","titel":"Peritonitis, nosokomial","regime":[{"label":"Diffus, nosokomial (postoperativ/tertiär), kreislaufinstabil, hohes MRE-Risiko (z. B. Nahtinsuffizienz nach Rektumresektion)","subs":["meropenem","linezolid"],"t":"Meropenem 3 × 1 g plus Linezolid 2 × 600 mg i.v.","dauer":"7–10 Tage"},{"label":"Sepsis mit gastrointestinalem Fokus (Kap. 15.3)","subs":["piptazo"],"opt":["linezolid"],"t":"Piperacillin/Tazobactam 4 × 4,5 g i.v.; bei Risiko für MRSA/VRE plus Linezolid 2 × 600 mg i.v.","dauer":"7–10 Tage"},{"label":"Septischer Schock mit gastrointestinalem Fokus (Kap. 15.3)","subs":["piptazo","linezolid"],"t":"Piperacillin/Tazobactam 4 × 4,5 g plus Linezolid 2 × 600 mg i.v.","dauer":"7–10 Tage"}],"allergie":"Sepsis: Meropenem 3 × 1 g i.v. · septischer Schock: Meropenem 3 × 2 g i.v.","hinweise":["Immer plus chirurgische Fokuskontrolle oder interventionelle Therapie."],"ref":"S2k 2018, S3 Sepsis 2025","wahl":"Meropenem plus Linezolid bei Instabilität und hohem MRE-Risiko; bei Sepsis ohne Schock reicht Pip/Tazo (Kap. 15.3)."},"peritonitis_tertiaer":{"alias":"peritonitis_post"},"divertikulitis":{"alias":"peritonitis_ambulant","notiz":"Die Hausleitlinie führt die frei perforierte Sigmadivertikulitis unter der diffusen Peritonitis (Kap. 11)."},"cholangitis":{"kap":"15.3","titel":"Sepsis mit gastrointestinalem Fokus","regime":[{"label":"Sepsis mit gastrointestinalem Fokus (Kap. 15.3)","subs":["piptazo"],"opt":["linezolid"],"t":"Piperacillin/Tazobactam 4 × 4,5 g i.v.; bei Risiko für MRSA/VRE plus Linezolid 2 × 600 mg i.v.","dauer":"7–10 Tage"},{"label":"Septischer Schock mit gastrointestinalem Fokus (Kap. 15.3)","subs":["piptazo","linezolid"],"t":"Piperacillin/Tazobactam 4 × 4,5 g plus Linezolid 2 × 600 mg i.v.","dauer":"7–10 Tage"}],"allergie":"Sepsis: Meropenem 3 × 1 g i.v. · septischer Schock: Meropenem 3 × 2 g i.v.","hinweise":["Ein eigenes Kapitel zu Cholangitis und Leberabszess enthält die Hausleitlinie nicht — bei Sepsis gilt Kap. 15.3."],"ref":"S3 Sepsis 2025"},"leberabszess":{"alias":"cholangitis"},"pankreasnekrose":{"kap":"11","titel":"Nekrotisierende Pankreatitis mit infizierten Nekrosen","regime":[{"label":"Infizierte Nekrosen","subs":["meropenem"],"t":"Meropenem 3 × 1 g i.v.","dauer":"7–10 Tage"}],"ref":"S2k 2018"},"urosepsis":{"kap":"15.4","titel":"Urosepsis","regime":[{"label":"Sepsis, ambulant oder nosokomial (obstruktive Uropathie ausschließen)","subs":["piptazo"],"t":"Piperacillin/Tazobactam 4 × 4,5 g i.v.","dauer":"7–10 Tage"},{"label":"Septischer Schock, ambulant erworben","subs":["piptazo"],"t":"Piperacillin/Tazobactam 4 × 4,5 g i.v.","dauer":"7–10 Tage"},{"label":"Septischer Schock, nosokomial erworben","subs":["piptazo"],"opt":["ciprofloxacin"],"t":"Piperacillin/Tazobactam 4 × 4,5 g i.v.; bei Risiko für MRGN plus Ciprofloxacin 3 × 400 mg i.v.","dauer":"7–10 Tage"}],"allergie":"Sepsis: Meropenem 3 × 1 g i.v. · septischer Schock: Meropenem 3 × 2 g i.v.","hinweise":["Harnstau immer sonographisch ausschließen — Ableitung ist Fokuskontrolle."],"ref":"S3 Sepsis 2025, S2k 2018","wahl":"Ciprofloxacin nur im nosokomialen septischen Schock mit MRGN-Risiko. Harnstau ausschließen — die Ableitung geht vor."},"pyelonephritis_obstruktiv":{"alias":"urosepsis","notiz":"Ohne Sepsis: komplizierte Pyelonephritis, Kap. 10.2 (Fokus Harnwegsinfektion ohne Sepsis)."},"katheter_hwi":{"kap":"10.3","titel":"Dauerkatheter-assoziierte Infektion","regime":[{"label":"Vor Therapiebeginn","subs":[],"t":"Indikation für den Dauerkatheter prüfen: besteht sie, Katheter wechseln; fehlt sie, Katheter entfernen — jeweils vor Beginn der Antibiose."},{"label":"Therapie wie komplizierte Harnwegsinfektion","subs":["ceftriaxon"],"t":"Ceftriaxon 1 × 2 g i.v.","dauer":"10 Tage"}],"hinweise":["Mit Sepsis: Kap. 15.4."],"ref":"S3 Harnwegsinfektionen"},"hwi":{"kap":"10.1 · 10.2","titel":"Unkomplizierte und komplizierte Harnwegsinfektion","regime":[{"label":"♀ Akute unkomplizierte Zystitis","subs":["pivmecillinam"],"alt":["nitrofurantoin"],"t":"Pivmecillinam 3 × 400 mg p.o. (3 Tage) oder Nitrofurantoin retard 2 × 100 mg p.o. (5 Tage; kontraindiziert bei GFR < 50 ml/min)","dauer":"3 bzw. 5 Tage","wahl":"Pivmecillinam in der Schwangerschaft und bei GFR < 50 ml/min (Nitrofurantoin dort kontraindiziert); sonst gleichwertig."},{"label":"♀ Unkomplizierte Pyelonephritis, leicht bis moderat","subs":["cefpodoxim"],"t":"Cefpodoxim 2 × 200 mg p.o.","dauer":"10 Tage"},{"label":"♀ Unkomplizierte Pyelonephritis, schwer (Fieber, reduzierter AZ)","subs":["ceftriaxon"],"t":"Ceftriaxon 1 × 2 g i.v., nach Besserung resistenzgerechte orale Sequenztherapie","dauer":"7–10 Tage, gesamt 1–2 Wochen"},{"label":"♀ Akute komplizierte Pyelonephritis","subs":["ceftriaxon"],"t":"Ceftriaxon 1 × 2 g i.v.","dauer":"10 Tage"}],"hinweise":["Unkompliziert nur ohne anatomische oder funktionelle Veränderungen, ohne Katheter, ohne relevante Nierenfunktionsstörung und ohne relevante Begleiterkrankung.","Komplizierend: BPH, Tumoren, Vor-OP, Ureterschienen, Blasenentleerungsstörung, Dauerkatheter, Para-/Tetraparese, antibiotische Vortherapie, nosokomialer Erwerb, männliches Geschlecht.","Pivmecillinam ist auch in der Schwangerschaft zugelassen."],"ref":"S3 Harnwegsinfektionen (bis 08.04.2029), Embryotox"},"urethritis":{"kap":"10.2","titel":"Urethritis beim Mann","regime":[{"label":"♂ Verdacht auf nicht-gonorrhoische Urethritis (NGU)","subs":["doxycyclin"],"t":"Doxycyclin 2 × 100 mg p.o.","dauer":"7 Tage"},{"label":"♂ Verdacht auf gonorrhoische Urethritis (GU)","subs":["ceftriaxon","doxycyclin"],"t":"Ceftriaxon 1 × 2 g i.v. plus Doxycyclin 2 × 100 mg p.o.","dauer":"7 Tage"}],"hinweise":["GU-Verdacht bei eitrigem Ausfluss oder intraleukozytären Diplokokken; NGU bei mukoidem Ausfluss, Granulozyten ohne Diplokokken oder Symptomen ohne Ausfluss.","Bei Ausfluss Abstrich zur Kultur und Resistenztestung von N. gonorrhoeae; immer NAT auf N. gonorrhoeae und C. trachomatis aus Abstrich oder Erststrahlurin."],"ref":"S3 Urethritis (bis 30.09.2029)"},"erysipel":{"kap":"7.1","titel":"Erysipel, schwere Fälle","regime":[{"label":"Standardtherapie","subs":["penicillin"],"t":"Penicillin G 3 × 10 Mio IE i.v.","dauer":"7–10 Tage"}],"allergie":"Clindamycin 3 × 600 mg i.v.","ref":"S2k 2018"},"abszess_haut":{"kap":"7.2","titel":"Haut- und Weichgewebeabszess","regime":[{"label":"Erste Wahl","subs":[],"t":"Inzision, Drainage, chirurgische Versorgung — in der Regel keine Antibiotika."},{"label":"Ausnahmen: Gesicht, Hände, Anogenitalregion, gekammerte oder rezidivierende Abszesse, systemische Zeichen; Furunkel/Karbunkel zentrofazial oder mit deutlicher Weichteilbeteiligung","subs":["amoxclav"],"alt":["ampsulb"],"t":"Amoxicillin/Clavulansäure 3 × 1 g p.o. oder Ampicillin/Sulbactam 3 × 3 g i.v.","dauer":"5 Tage","wahl":"Oral, wenn schluckfähig und ohne systemische Zeichen; i.v. bei Sepsiszeichen oder großem Befund."}],"allergie":"Clindamycin 3 × 600 mg i.v.","ref":"S2k 2018"},"phlegmone":{"kap":"7.3","titel":"Mittelschwere Haut- und Weichteilinfektionen","regime":[{"label":"Leichte Phlegmone, begrenzt, unbehandelt, unkompliziert","subs":["cefuroxim"],"t":"Cefuroxim 3 × 1,5 g i.v.","dauer":"5–7 Tage"},{"label":"Schwere Phlegmone, invasiv, meist eitrig, dringliche OP-Indikation oder systemische Reaktion","subs":["ampsulb"],"t":"Ampicillin/Sulbactam 3 × 3 g i.v. plus chirurgisches Débridement","dauer":"5–7 Tage nach erfolgreicher Sanierung"},{"label":"Schwere Phlegmone, kompliziert, chronisch, möglicherweise polymikrobiell","subs":["ampsulb"],"t":"Ampicillin/Sulbactam 3 × 3 g i.v. plus chirurgisches Débridement","dauer":"7 Tage nach erfolgreicher Sanierung"}],"allergie":"Clindamycin 4 × 600 mg i.v.","ref":"S2k 2018","dauerRegel":"5–7 Tage, gezählt ab erfolgreicher chirurgischer Sanierung.","wahl":"Begrenzt und unbehandelt → Cefuroxim; invasiv, eitrig, OP-pflichtig oder chronisch → Ampicillin/Sulbactam plus Débridement."},"nekrot_fasziitis":{"kap":"7.4 · 15.5","titel":"Schwere und nekrotisierende Haut- und Weichteilinfektionen","regime":[{"label":"Kompliziert, nosokomial, mit Sepsiszeichen, Komorbidität oder Organdysfunktion","subs":["piptazo"],"opt":["linezolid"],"t":"Piperacillin/Tazobactam 3–4 × 4,5 g i.v.; bei MRSA-Risiko plus Linezolid 2 × 600 mg i.v.","dauer":"7–10 Tage"},{"label":"Nekrotisierend, toxinbedingt, lebensbedrohlich","subs":["piptazo","clindamycin"],"t":"Piperacillin/Tazobactam 4 × 4,5 g plus Clindamycin 3 × 600 mg i.v. (Toxinhemmung) plus Débridement","dauer":"7–10 Tage"},{"label":"Nekrotisierend bei MRSA-Risiko","subs":["piptazo","linezolid"],"t":"Piperacillin/Tazobactam 3–4 × 4,5 g plus Linezolid 2 × 600 mg i.v. (hemmt ebenfalls die Toxinsynthese) plus Débridement","dauer":"7–10 Tage"},{"label":"Sepsis oder Schock mit Haut-/Weichteilfokus (Kap. 15.5)","subs":["piptazo","clindamycin"],"t":"Piperacillin/Tazobactam 4 × 4,5 g plus Clindamycin 4 × 600 mg i.v.; bei VRE-Risiko Pip/Tazo plus Linezolid 2 × 600 mg","dauer":"7–10 Tage"}],"allergie":"Meropenem 3 × 1 g i.v. (septischer Schock 3 × 2 g)","hinweise":["Débridement entscheidet — die Antibiose begleitet."],"ref":"S2k 2018, S3 Sepsis 2025","wahl":"Clindamycin als Toxinhemmer, solange kein MRSA-Risiko besteht; bei MRSA-Risiko Linezolid statt Clindamycin — deckt MRSA und hemmt das Toxin ebenfalls."},"dfs":{"kap":"7.5","titel":"Diabetischer Fuß","regime":[{"label":"PEDIS-Grad 1","subs":[],"t":"Keine antibiotische Therapie."},{"label":"PEDIS-Grad 2–4","subs":["ampsulb"],"t":"Ampicillin/Sulbactam 3 × 3 g i.v., orale Anschlusstherapie Amoxicillin/Clavulansäure 3 × 1 g p.o.","dauer":"7–14 Tage, maximal 2 Wochen gesamt"}],"allergie":"Moxifloxacin 1 × 400 mg i.v./p.o.","hinweise":["Individuelles Gesamtkonzept mit Unfallchirurgie, Plastischer Chirurgie, Gefäßchirurgie und Innerer Medizin.","PEDIS 2: > 2 Entzündungszeichen, ≤ 2 cm um das Ulkus, auf Haut und Subkutis begrenzt. PEDIS 3: > 2 cm, Lymphangitis, unter die Faszie, tiefer Abszess, Gangrän, Muskel-, Sehnen-, Gelenk- oder Knochenbeteiligung. PEDIS 4: systemische Zeichen oder instabiler Kreislauf."],"ref":"S2k 2018","dauerRegel":"Maximal 2 Wochen gesamt — inklusive oraler Anschlusstherapie.","wahl":"PEDIS-Grad entscheidet; Grad 1 ohne Antibiose."},"biss":{"kap":"7.6","titel":"Bissverletzungen (Tier/Mensch)","regime":[{"label":"Prophylaxe","subs":["amoxclav"],"t":"Amoxicillin/Clavulansäure 3 × 1 g p.o.","dauer":"3–5 Tage"},{"label":"Infektion","subs":["amoxclav"],"t":"Amoxicillin/Clavulansäure 3 × 1 g p.o.","dauer":"5–10 Tage"},{"label":"Schwere Infektion","subs":["piptazo"],"t":"Piperacillin/Tazobactam 3–4 × 4,5 g i.v.","dauer":"10 Tage"}],"allergie":"Moxifloxacin 1 × 400 mg p.o./i.v.","hinweise":["Tetanusimpfung und Tollwutrisiko klären."],"ref":"S2k 2018","wahl":"Prophylaxe bei Hand, Gelenknähe, Katzenbiss, tiefer Wunde oder Immunsuppression; i.v. nur bei schwerer Infektion."},"verbrennung":{"kap":"5.2","titel":"Verbrennungschirurgie (perioperative Prophylaxe)","regime":[{"label":"Elektiv, Notfall, Escharotomie: saubere Wunden ohne Keimnachweis","subs":["cefazolin"],"t":"Cefazolin 1 × 2 g i.v.","dauer":"Single Shot, Wiederholung nach Tab. 5.6"},{"label":"Elektiv: mit Keimnachweis, ohne Hinweis auf Wundinfekt","subs":[],"t":"Resistenzgerechte Antibiose i.v.","dauer":"Single Shot, Wiederholung nach Tab. 5.6"},{"label":"Elektiv: Wundinfekt mit Keimnachweis","subs":[],"t":"Start oder Fortführung einer resistenzgerechten Antibiose i.v.","dauer":"7–10 Tage"},{"label":"Notfall, Escharotomie: große, verschmutzte Weichteildefekte oder Verbrennungen","subs":["piptazo"],"t":"Piperacillin/Tazobactam 3 × 4,5 g i.v.","dauer":"72 h"}],"allergie":"Gentamicin 1 × 5 mg/kg plus Vancomycin 2 × 15 mg/kg oder Gentamicin 1 × 5 mg/kg plus Clindamycin 2 × 600 mg (Single Shot bzw. 72 h)","hinweise":["Für die Sepsis beim Verbrennungspatienten gibt es kein eigenes Kapitel — fokusorientiert nach Kap. 15 behandeln, Resistenzlage beachten (Pseudomonas, Acinetobacter).","Alle Regeln der perioperativen Prophylaxe: Seite OP-Prophylaxe."],"ref":"S3 Perioperative Antibiotikaprophylaxe (bis 19.12.2029)","wahl":"Keimnachweis und Wundinfekt entscheiden: sauber → Cefazolin Single Shot; Keim ohne Infekt → resistenzgerecht Single Shot; Infekt → 7–10 Tage; große verschmutzte Defekte → Pip/Tazo 72 h."},"arthritis":{"kap":"8.1","titel":"Arthritis und Gelenkinfektionen","regime":[{"label":"Natives Gelenk ohne Primärfokus","subs":["ampsulb"],"t":"Ampicillin/Sulbactam 3 × 3 g i.v."},{"label":"Natives Gelenk, Primärfokus urogenital oder gastrointestinal","subs":["piptazo"],"t":"Piperacillin/Tazobactam 3 × 4,5 g i.v."},{"label":"Natives Gelenk, orale Anschlusstherapie ohne Keimnachweis","subs":["cotrimoxazol","amoxicillin"],"alt":["levofloxacin","clindamycin"],"t":"Cotrimoxazol 3 × 960 mg plus Amoxicillin 3 × 1000 mg p.o. oder Levofloxacin 2 × 500 mg plus Clindamycin 3 × 600 mg p.o.","wahl":"Levofloxacin plus Clindamycin bei Penicillinallergie oder Cotrimoxazol-Unverträglichkeit, sonst Cotrimoxazol plus Amoxicillin."},{"label":"Nach Bandplastik, 1. Spülung","subs":["ampsulb","vancomycin"],"alt":["cefuroxim"],"t":"Ampicillin/Sulbactam 3 × 3 g plus Vancomycin 2 × 1 g i.v. oder Cefuroxim 3 × 1,5 g plus Vancomycin 2 × 1 g i.v.","wahl":"Cefuroxim statt Ampicillin/Sulbactam bei Penicillinallergie mit moderatem PEN-FAST-Risiko."},{"label":"Nach Bandplastik, nach vorherigen Spülungen","subs":["piptazo","vancomycin"],"t":"Piperacillin/Tazobactam plus Vancomycin 2 × 1 g i.v. (Pip/Tazo-Dosis im Dokument „3 × 3 g“ — vermutlich 3 × 4,5 g, mit ABS klären)"},{"label":"Nach Bandplastik, orale Anschlusstherapie ohne Keimnachweis","subs":["rifampicin","levofloxacin"],"t":"Rifampicin 2 × 450 mg plus Levofloxacin 2 × 500 mg p.o."}],"allergie":"Statt Ampicillin/Sulbactam: Vancomycin 2 × 1 g i.v., ggf. plus Fosfomycin 3 × 5 g i.v. · statt Pip/Tazo: Meropenem 3 × 1 g i.v.","hinweise":["Gesamtdauer 4 Wochen (etwa 2 Wochen i.v., dann oral). Ausnahmen: Gonokokken 1–2 Wochen i.v.; Streptokokken 1–2 Wochen (3–4 bei Komorbidität); Pilze ≥ 6 Wochen; begleitende Osteomyelitis oder Fremdmaterial 6 Wochen; Endokarditis 4–6 Wochen i.v.","Vancomycin mit Spiegelkontrolle (doseeasy.de).","Rifampicin erst bei trockener Wunde bzw. nach Drainagenzug ergänzen; über 75 Jahre 2 × 300 mg."],"ref":"Pro-Implant Pocket Guide septische Arthritis, S2k 2018","dauerRegel":"4 Wochen gesamt (etwa 2 Wochen i.v., dann oral). Gonokokken und Streptokokken 1–2 Wochen; Pilze ≥ 6 Wochen; Osteomyelitis oder Fremdmaterial 6 Wochen; Endokarditis 4–6 Wochen i.v."},"sternumosteomyelitis":{"kap":"8.2","titel":"Sternumosteomyelitis","regime":[{"label":"Kalkuliert","subs":["cefuroxim","clindamycin"],"t":"Cefuroxim 3 × 1,5 g plus Clindamycin 4 × 600 mg i.v."},{"label":"Orale Anschlusstherapie ohne Keimnachweis","subs":["amoxclav","clindamycin"],"t":"Amoxicillin/Clavulansäure 3 × 1 g plus Clindamycin 4 × 600 mg p.o."}],"hinweise":["Gesamtdauer 6 Wochen (etwa 2 Wochen i.v., dann oral).","Nach mikrobiologischem Befund rasch auf ein gezieltes, möglichst enges Regime umstellen."],"ref":"S2k 2018","dauerRegel":"6 Wochen gesamt — etwa 2 Wochen i.v., die orale Phase zählt mit."},"osteomyelitis":{"kap":"8.3","titel":"Osteomyelitis / Osteitis","regime":[{"label":"Kalkuliert","subs":["ampsulb"],"alt":["cefuroxim"],"t":"Ampicillin/Sulbactam 3 × 3 g i.v. oder Cefuroxim 3 × 1,5 g i.v.","wahl":"Ampicillin/Sulbactam bei Weichteildefekt, Ulkus oder Verdacht auf Mischinfektion; Cefuroxim bei hämatogener oder postoperativer Infektion ohne Anaerobierrisiko."},{"label":"Orale Anschlusstherapie ohne Keimnachweis","subs":["amoxclav","clindamycin"],"t":"Amoxicillin/Clavulansäure 3 × 1 g plus Clindamycin 4 × 600 mg p.o."}],"hinweise":["Gesamtdauer 6 Wochen (etwa 2 Wochen i.v., dann oral)."],"ref":"S2k 2018","dauerRegel":"6 Wochen gesamt — etwa 2 Wochen i.v., die orale Phase zählt mit."},"spondylodiszitis":{"kap":"8.4","titel":"Spondylodiszitis","regime":[{"label":"Kalkuliert","subs":["ampsulb"],"t":"Ampicillin/Sulbactam 3 × 3 g i.v."},{"label":"Orale Anschlusstherapie ohne Keimnachweis","subs":["amoxclav","clindamycin"],"t":"Amoxicillin/Clavulansäure 3 × 1 g plus Clindamycin 4 × 600 mg p.o."}],"hinweise":["Probengewinnung vor Antibiose; Blutkulturen mindestens 2, besser 3 Paare.","Ex domo anbehandelt: Blutkulturen, Umsetzen auf Ampicillin/Sulbactam.","Unbehandelt, klinisch stabil, keine Paresen: Blutkulturen, keine empirische Antibiose, ggf. CT-gesteuerte Punktion.","Unbehandelt, septisch, instabil oder schwer krank: Blutkulturen, dann sofort Ampicillin/Sulbactam.","Gesamtdauer 6 Wochen (etwa 2 Wochen i.v., dann oral)."],"ref":"Pro-Implant Pocket Guide Wirbelsäuleninfektionen","dauerRegel":"6 Wochen gesamt — etwa 2 Wochen i.v., die orale Phase zählt mit.","wahl":"Stabil ohne Paresen und unbehandelt: erst Erreger sichern (Blutkulturen, CT-Punktion), keine empirische Antibiose. Septisch oder vorbehandelt: sofort Ampicillin/Sulbactam."},"protheseninfektion":{"kap":"8.5","titel":"Periprothetische Infektionen","regime":[{"label":"Kalkuliert","subs":["ampsulb"],"opt":["vancomycin"],"t":"Ampicillin/Sulbactam 3 × 3 g i.v.; plus Vancomycin 2 × 1 g bei septischen Patienten, bekannten MRSA-Trägern, mehreren Voroperationen und Verdacht auf Low-grade-Infektion","wahl":"Vancomycin dazu bei Sepsis, MRSA-Trägerschaft, mehreren Voroperationen oder Verdacht auf Low-grade-Infektion (KNS, C. acnes)."},{"label":"Orale Anschlusstherapie ohne Keimnachweis","subs":["levofloxacin"],"opt":["rifampicin"],"t":"Levofloxacin 2 × 500 mg p.o., ggf. plus Rifampicin 2 × 450 mg p.o.","wahl":"Rifampicin dazu, wenn Staphylokokken wahrscheinlich sind und das Implantat bleibt — erst bei trockener Wunde."}],"allergie":"Vancomycin 2 × 1 g i.v. (Spiegel) oder Daptomycin 1 × 8 mg/kg i.v.","hinweise":["Gesamtdauer 12 Wochen (etwa 2 Wochen i.v., dann oral); nach Re-Implantation Biofilmprophylaxe nach Keimspektrum.","Rifampicin über 75 Jahre 2 × 300 mg; Vancomycin mit Spiegelkontrolle (doseeasy.de)."],"ref":"Pro-Implant Pocket Guide periprothetische Infektionen","dauerRegel":"12 Wochen gesamt — etwa 2 Wochen i.v., dann oral."},"fri":{"kap":"8.6","titel":"Frakturassoziierte Infektionen nach Osteosynthese","regime":[{"label":"Kalkuliert","subs":["ampsulb"],"t":"Ampicillin/Sulbactam 3 × 3 g i.v."},{"label":"Orale Anschlusstherapie ohne Keimnachweis","subs":["levofloxacin"],"opt":["rifampicin"],"t":"Levofloxacin 2 × 500 mg p.o., ggf. plus Rifampicin 2 × 450 mg p.o.","wahl":"Rifampicin nur bei Staphylokokken, belassenem stabilem Implantat, gedeckter trockener Wunde und Rifampicin-Empfindlichkeit."}],"allergie":"Cefuroxim 3 × 1,5 g i.v. oder Vancomycin 2 × 1 g i.v. (Spiegel) oder Daptomycin 1 × 8 mg/kg i.v.","hinweise":["Konsolidierte Fraktur: 6 Wochen nach Implantatentfernung.","Implantat noch nicht entfernbar: suppressive Therapie bis zur Frakturheilung, nach Entfernung noch 2 Wochen.","Endgültige Entfernung unmöglich, aber ein- oder mehrzeitiger Wechsel: insgesamt 12 Wochen.","Rifampicin nur bei Staphylokokken mit belassenem stabilem Implantat nach DAIR, wenn rifampicinsensibel, Weichteile gedeckt und keine relevante Sekretion — nicht als Standard. Über 75 Jahre 2 × 300 mg."],"ref":"S2k Frakturassoziierte Infektion (bis 01.02.2031), Pro-Implant Pocket Guide","dauerRegel":"Implantat belassen oder gewechselt: 12 Wochen. Nach Implantatentfernung: 6 Wochen ab der Entfernung. Implantat noch nicht entfernbar: suppressiv bis zur Frakturheilung, nach der Entfernung noch 2 Wochen."},"endokarditis_nativ":{"kap":"9","titel":"Infektiöse Endokarditis, Nativklappe","regime":[{"label":"Ambulant erworbene Nativklappenendokarditis","subs":["ampicillin","gentamicin","ceftriaxon"],"t":"Ampicillin 6 × 2 g plus Gentamicin 1 × 3 mg/kg plus Ceftriaxon 2 × 2 g i.v.","dauer":"4–6 Wochen"},{"label":"Nosokomiale Nativklappenendokarditis (assoziiert mit i.v.-Zugang)","subs":["vancomycin","gentamicin","rifampicin"],"t":"Vancomycin 2 × 15 mg/kg plus Gentamicin 1 × 3 mg/kg plus Rifampicin 2 × 450 mg i.v.","dauer":"4–6 Wochen"}],"allergie":"Vancomycin 2 × 15 mg/kg (Spiegel) plus Gentamicin 1 × 3 mg/kg","hinweise":["Erst nach Blutkulturen in ausreichender Menge empirisch behandeln, dann erregerspezifisch anpassen; Therapie parenteral über Wochen; Endokarditis-Team einbeziehen.","Gentamicin-Talspiegel < 2,0 mg/l; Vancomycin mit Spiegelkontrolle; Alternative zu Vancomycin: Daptomycin 1 × 10 mg/kg. Rifampicin über 75 Jahre 2 × 300 mg.","Definitive IE: 2 Hauptkriterien, 1 Haupt- und ≥ 3 Nebenkriterien, 5 Nebenkriterien oder pathologischer Nachweis. Mögliche IE: 1 Haupt- und 1–2 Nebenkriterien oder 5 Nebenkriterien.","Hauptkriterien: typische Erreger in ≥ 2 Blutkulturen (orale Streptokokken, S. gallolyticus, HACEK, S. aureus, E. faecalis) bzw. Coxiella-Phase-I-IgG > 1:800; Bildgebung positiv (Echo, Kardio-CT, FDG-PET/CT, Leukozytenszintigraphie).","Nebenkriterien: Prädisposition, Fieber ≥ 38 °C, vaskuläre Phänomene (Embolie, septische Lungeninfarkte, mykotische Aneurysmen, intrakranielle Blutung, Janeway), immunologische Phänomene (Glomerulonephritis, Osler, Roth, Rheumafaktor), mikrobiologischer Nachweis außerhalb der Hauptkriterien."],"ref":"ESC 2023 Endocarditis, S2k Infektiöse Endokarditis","dauerRegel":"4–6 Wochen parenteral.","wahl":"Erwerb entscheidet: ambulant → Ampicillin, Gentamicin, Ceftriaxon; nosokomial oder über i.v.-Zugang → Vancomycin, Gentamicin, Rifampicin. Daptomycin statt Vancomycin bei Niereninsuffizienz."},"endokarditis_prothese":{"kap":"9","titel":"Infektiöse Endokarditis, Klappenprothese","regime":[{"label":"Prothesenklappe > 12 Monate postoperativ","subs":["ampicillin","gentamicin","ceftriaxon"],"t":"Ampicillin 6 × 2 g plus Gentamicin 1 × 3 mg/kg plus Ceftriaxon 2 × 2 g i.v.","dauer":"mindestens 6 Wochen"},{"label":"Prothesenklappe < 12 Monate postoperativ","subs":["vancomycin","gentamicin","rifampicin"],"t":"Vancomycin 2 × 15 mg/kg plus Gentamicin 1 × 3 mg/kg plus Rifampicin 2 × 450 mg i.v.","dauer":"mindestens 6 Wochen"}],"allergie":"Vancomycin 2 × 15 mg/kg (Spiegel) plus Gentamicin 1 × 3 mg/kg","hinweise":["Prothesenendokarditis mindestens 6 Wochen i.v., bevorzugt mit Rifampicin wegen der Biofilmwirkung.","Endokarditis-Team kontaktieren.","Daptomycin 1 × 10 mg/kg als Alternative zu Vancomycin."],"ref":"ESC 2023, S2k Infektiöse Endokarditis","dauerRegel":"Mindestens 6 Wochen i.v.","wahl":"Zeit seit der OP entscheidet: > 12 Monate wie ambulante Nativklappe, < 12 Monate Vancomycin, Gentamicin, Rifampicin."},"meningitis":{"kap":"14","titel":"Bakterielle Meningitis, ambulant erworben","regime":[{"label":"Negative Reiseanamnese","subs":["ceftriaxon","ampicillin"],"t":"Ceftriaxon 2 × 2 g plus Ampicillin 6 × 2 g i.v. plus Dexamethason 4 × 10 mg i.v. (erste Gabe unmittelbar vor der Antibiose)","dauer":"erregerabhängig; Dexamethason 4 Tage"},{"label":"Positive Reiseanamnese","subs":["ceftriaxon","ampicillin","vancomycin"],"t":"Ceftriaxon 2 × 2 g plus Ampicillin 6 × 2 g plus Vancomycin 2 × 1 g i.v. plus Dexamethason 4 × 10 mg","dauer":"erregerabhängig; Dexamethason 4 Tage"}],"hinweise":["Dauer: H. influenzae 7–10 Tage, Pneumokokken 10–14, Meningokokken 7–10, Listerien oder gramnegative Enterobakterien ≥ 3 Wochen.","Ohne Bewusstseinsstörung, Fokalneurologie oder Anfall: 2 Blutkultursets, LP, dann sofort Dexamethason 10 mg und Antibiose. Sonst vor der LP ein CCT.","Dexamethason vor oder mit der ersten Antibiose; bei bereits begonnener Antibiose bis wenige Stunden danach. Fortführen über 4 Tage bei Pneumokokken oder klinisch wahrscheinlicher Pneumokokkenmeningitis; nicht bei Meningitis durch Endokarditis.","Procalcitonin hilft bei der Unterscheidung bakteriell vs. viral.","Solange eine HSV-Enzephalitis infrage kommt, zusätzlich Aciclovir i.v.","Parameningealer Herd (Otitis, Sinusitis, Mastoiditis): operative Sanierung möglichst in 24 h.","Meningokokken: Isolation bis 24 h nach Therapiebeginn, Meldung schon bei Verdacht, Postexpositionsprophylaxe.","Vancomycin mit Spiegelkontrolle, Zieltalspiegel (15–)20 mg/l (im Dokument als mg/dl gedruckt)."],"ref":"S2k Ambulant erworbene bakterielle Meningoenzephalitis (bis 27.04.2028)","dauerRegel":"Erregerabhängig: H. influenzae und Meningokokken 7–10 Tage, Pneumokokken 10–14 Tage, Listerien und gramnegative Erreger ≥ 3 Wochen. Dexamethason 4 Tage.","wahl":"Die Reiseanamnese entscheidet über Vancomycin (penicillinresistente Pneumokokken)."},"ventrikulitis":{"kap":"14","titel":"Meningitis nosokomial (SHT, postoperativ, Shunt, EVD, Ventrikulitis)","regime":[{"label":"Kalkuliert","subs":["meropenem","vancomycin"],"opt":["metronidazol"],"t":"Meropenem 3 × 2 g plus Vancomycin 2 × 1 g i.v.; ggf. plus Metronidazol 3 × 500 mg bei Zugang durch Schleimhäute oder Frontobasisdefekt","dauer":"mindestens 4 Wochen, ggf. Oralisierung im Verlauf"},{"label":"Fulminante Ventrikulitis","subs":["vancomycin"],"t":"Ggf. zusätzlich intrathekales Vancomycin — Dosierung in Rücksprache mit der Neurochirurgie"}],"hinweise":["Vancomycin mit Spiegelkontrolle, Zieltalspiegel (15–)20 mg/l (im Dokument als mg/dl gedruckt)."],"ref":"S2k Meningoenzephalitis","dauerRegel":"Mindestens 4 Wochen (postoperativ, Shunt), ggf. Oralisierung im Verlauf.","wahl":"Metronidazol dazu bei Zugang durch Schleimhaut oder Frontobasisdefekt."},"hirnabszess":{"kap":"14","titel":"Hirnabszess","regime":[{"label":"Ambulant erworben","subs":["ceftriaxon","metronidazol"],"opt":["vancomycin"],"t":"Ceftriaxon 2 × 2 g plus Metronidazol 3 × 500 mg i.v.; bei MRSA-Verdacht plus Vancomycin 2 × 1 g","dauer":"4–8 Wochen"},{"label":"Postoperativ, nosokomial oder posttraumatisch","subs":["meropenem","vancomycin"],"t":"Meropenem 3 × 2 g plus Vancomycin 2 × 1 g i.v.","dauer":"4–8 Wochen"},{"label":"Immunsupprimiert nach Organtransplantation oder Chemotherapie (auch Meningitis)","subs":["meropenem","vancomycin","cotrimoxazol","voriconazol"],"t":"Meropenem 3 × 2 g plus Vancomycin 2 × 1 g plus Cotrimoxazol 2 × 960 mg plus Voriconazol 2 × 200 mg i.v.","dauer":"4–8 Wochen"},{"label":"Ödem, Masseneffekt, drohende Herniation","subs":[],"t":"Dexamethason initial 40 mg i.v., ab dem Folgetag 3 × 8 mg","dauer":"3–8 Tage"}],"hinweise":["Blutkulturen und rasche Gewinnung von Abszessinhalt (stereotaktisch, ultraschallgesteuert, Drainage oder Exzision) entscheiden über den Erregernachweis.","Lumbalpunktion wenig sensitiv und bei raumforderndem Abszess kontraindiziert.","HIV-positiv: um Toxoplasmose-Therapie erweitern (Pyrimethamin plus Sulfadiazin oder Clindamycin, oder Cotrimoxazol).","Dauer 4–8 Wochen, je nach Erreger und Befund länger."],"ref":"S1 Hirnabszess (gültig bis 31.12.2025)","dauerRegel":"4–8 Wochen, je nach Erreger und Befund auch länger.","wahl":"Erwerb entscheidet: ambulant → Ceftriaxon plus Metronidazol; postoperativ oder posttraumatisch → Meropenem plus Vancomycin; immunsupprimiert → zusätzlich Cotrimoxazol und Voriconazol."},"hsv_enzephalitis":{"kap":"14","titel":"Virale Meningitis, HSV-Enzephalitis, Zostermeningitis","regime":[{"label":"Verdacht auf HSV-Enzephalitis oder Zostermeningitis","subs":["aciclovir"],"t":"Aciclovir 3 × 10 mg/kg i.v. — sofort beginnen, bei Hirndruckzeichen ohne vorherige Liquordiagnostik","dauer":"10–14 Tage, bei HSV mindestens 14 Tage"}],"hinweise":["Bei negativer HSV-PCR, aber fortbestehendem Verdacht ohne andere Ursache mindestens 10 Tage.","Ausreichend hydrieren, Dosisreduktion bei Niereninsuffizienz.","Kortikoide als Begleittherapie ohne belegte Wirksamkeit."],"ref":"S1 Virale Meningoenzephalitis","dauerRegel":"Mindestens 14 Tage; bei negativer PCR, aber fortbestehendem Verdacht mindestens 10 Tage."}},"llErreger":{"mssa":{"aliasFokus":"sab"},"cdiff":{"aliasFokus":"cdi"},"aspergillus":{"aliasFokus":"aspergillose"},"mucorales":{"aliasFokus":"mucormykose"},"hsv":{"aliasFokus":"hsv_enzephalitis"},"calbicans":{"aliasFokus":"candidaemie"},"mrsa":{"kap":"19.1","titel":"MRSA","regime":[{"label":"Blutstrominfektion, unkompliziert","subs":["daptomycin"],"alt":["vancomycin"],"t":"Daptomycin 1 × 10 mg/kg i.v. oder Vancomycin 2 × 1 g i.v.","dauer":"14 Tage ab der ersten sterilen Blutkultur","wahl":"Daptomycin bei Niereninsuffizienz, nephrotoxischer Komedikation oder hoher Vancomycin-MHK; Vancomycin bei möglicher pulmonaler Beteiligung."},{"label":"Blutstrominfektion, kompliziert","subs":["daptomycin"],"alt":["vancomycin"],"t":"Daptomycin 1 × 10 mg/kg oder Vancomycin 2 × 1 g i.v.","dauer":"4–6 Wochen","wahl":"Daptomycin bei Niereninsuffizienz oder hoher Vancomycin-MHK; Vancomycin bei pulmonaler Beteiligung."},{"label":"Blutstrominfektion, Kontraindikation gegen Daptomycin und Vancomycin","subs":["linezolid"],"t":"Linezolid 2 × 600 mg i.v.","dauer":"unkompliziert 14 Tage, kompliziert 4–6 Wochen"},{"label":"Endokarditis","subs":["daptomycin"],"alt":["vancomycin"],"t":"Daptomycin 1 × 10 mg/kg oder Vancomycin 2 × 1 g i.v.","dauer":"4–6 Wochen","wahl":"Daptomycin bei Niereninsuffizienz oder hoher Vancomycin-MHK; Vancomycin bei pulmonaler Beteiligung."},{"label":"Kunstklappe oder intrakardiales Fremdmaterial","subs":["daptomycin"],"alt":["vancomycin"],"opt":["fosfomycin","rifampicin"],"t":"Daptomycin 1 × 8–10 mg/kg oder Vancomycin 2 × 1 g, ggf. plus Fosfomycin 3 × 5 g oder Rifampicin 2 × 450 mg","wahl":"Rifampicin als Biofilmpartner nach Débridement; Fosfomycin bei Rifampicin-Resistenz oder Interaktionen."},{"label":"Pneumonie","subs":["linezolid"],"alt":["vancomycin"],"t":"Linezolid 2 × 600 mg oder Vancomycin 2 × 1 g i.v.","dauer":"7–10 Tage","wahl":"Linezolid bevorzugt (bessere Lungenpenetration, oral fortführbar); Vancomycin bei Thrombozytopenie, SSRI oder MAO-Hemmern (Serotoninsyndrom) oder absehbarer Therapie > 2 Wochen."},{"label":"Knochen und Gelenk ohne Fremdmaterial","subs":["daptomycin"],"alt":["linezolid","vancomycin"],"t":"Daptomycin 1 × 8–10 mg/kg oder Linezolid 2 × 600 mg oder Vancomycin 2 × 1 g","dauer":"mindestens 6 Wochen","wahl":"Daptomycin bei Niereninsuffizienz; Linezolid oral möglich, aber myelotoxisch ab etwa 2 Wochen — Blutbild wöchentlich."},{"label":"Fremdkörperinfektion an Knochen und Gelenken","subs":["daptomycin"],"alt":["linezolid","vancomycin"],"opt":["fosfomycin","rifampicin"],"t":"Wie oben, ggf. plus Fosfomycin 3 × 5 g oder Rifampicin 2 × 450 mg","dauer":"mindestens 6 Wochen","wahl":"Rifampicin als Biofilmpartner nach Débridement; Fosfomycin bei Rifampicin-Resistenz oder Interaktionen."},{"label":"Komplizierte Haut- und Weichgewebeinfektion","subs":["linezolid"],"alt":["daptomycin"],"t":"Linezolid 2 × 600 mg oder Daptomycin 1 × 8–10 mg/kg","dauer":"7–10 Tage","wahl":"Linezolid, wenn oral fortgeführt werden soll; Daptomycin bei begleitender Bakteriämie."}],"hinweise":["Vancomycin mit Spiegelkontrolle (doseeasy.de); Rifampicin über 75 Jahre 2 × 300 mg.","Therapie nur bei Infektion, nicht bei Kolonisation."],"ref":"S3 Multiresistente Bakterien","dauerRegel":"Blutstrom 14 Tage (unkompliziert) bzw. 4–6 Wochen (kompliziert, Endokarditis) — gezählt ab der ersten sterilen Blutkultur. Knochen und Gelenk mindestens 6 Wochen."},"vre":{"kap":"19.2","titel":"VRE","regime":[{"label":"Blutstrominfektion","subs":["linezolid"],"alt":["daptomycin"],"t":"Linezolid 2 × 600 mg i.v. oder Daptomycin 1 × 10–12 mg/kg i.v. (Daptomycin-Resistogramm nachfordern, keine Standardtestung)","dauer":"14 Tage ab der ersten sterilen Blutkultur","wahl":"Daptomycin hochdosiert wirkt bakterizid — Resistogramm nachfordern; Linezolid sofort einsetzbar und oral fortführbar, aber bakteriostatisch."},{"label":"Intraabdominelle Infektion","subs":["tigecyclin"],"alt":["eravacyclin"],"t":"Tigecyclin initial 100 mg, dann 2 × 50 mg i.v. oder Eravacyclin 2 × 1 mg/kg i.v. (mit starkem CYP3A4-Induktor 2 × 1,5 mg/kg)","dauer":"7–10 Tage","wahl":"Tigecyclin zuerst (Oberarztantibiotikum); Eravacyclin ist Reserve nach G-BA."}],"hinweise":["Therapie nur bei Infektion, nicht bei Kolonisation."],"ref":"S3 Multiresistente Bakterien","dauerRegel":"Blutstrom 14 Tage — gezählt ab der ersten sterilen Blutkultur."},"carbapenemase":{"kap":"19.3","titel":"Carbapenem-resistente Enterobacterales (CRE)","regime":[{"label":"Schwere Infektion ohne Metallo-Betalaktamase (nach Antibiogramm)","subs":["ceftazidim_avibactam"],"t":"Ceftazidim/Avibactam 3 × 2,5 g i.v.","dauer":"7–10 Tage"},{"label":"Resistenz gegen die erste Wahl oder Metallo-Betalaktamase","subs":["cefiderocol"],"t":"Cefiderocol 3 × 2 g i.v.","dauer":"7–10 Tage"},{"label":"Schwere intraabdominelle Infektion","subs":["eravacyclin"],"t":"Eravacyclin 2 × 1 mg/kg i.v. (mit CYP3A4-Induktor 2 × 1,5 mg/kg)","dauer":"7–10 Tage"}],"hinweise":["Resistenzmechanismus bestimmen lassen, mindestens Nachweis oder Ausschluss einer MBL.","Gezielte Therapie immer nach Antibiogramm und Resistenzmechanismus.","Reserveantibiotika: Sonderanforderung, Oberarzt, ABS-Team und Mikrobiologie, Zusatzdokumentation."],"ref":"S3 Multiresistente Bakterien","wahl":"Mechanismus entscheidet: KPC oder OXA-48 → Ceftazidim/Avibactam; Metallo-Betalaktamase → Cefiderocol; Eravacyclin nur intraabdominell."},"dtr_pa":{"kap":"19.4","titel":"Pseudomonas aeruginosa mit Difficult-to-Treat Resistance","regime":[{"label":"Schwere Infektion bei nachgewiesener Empfindlichkeit","subs":["ceftolozan_tazobactam"],"alt":["ceftazidim_avibactam","cefiderocol"],"t":"Ceftolozan/Tazobactam 3 × 1,5 g oder Ceftazidim/Avibactam 3 × 2,5 g oder Cefiderocol 3 × 2 g i.v.","dauer":"7–10 Tage","wahl":"Mechanismus entscheidet: ohne Carbapenemase Ceftolozan/Tazobactam; KPC oder OXA-48 Ceftazidim/Avibactam; Metallo-Betalaktamase Cefiderocol."}],"hinweise":["DTR-PA: gleichzeitig nicht empfindlich gegen alle antipseudomonalen Erstlinien — Carbapeneme, Pip/Tazo, Ceftazidim, Cefepim, Aztreonam, Ciprofloxacin, Levofloxacin."],"ref":"S3 Multiresistente Bakterien"},"crab":{"kap":"19.5","titel":"Carbapenem-resistente Acinetobacter baumannii","regime":[{"label":"Schwere Infektion bei nachgewiesener Empfindlichkeit","subs":["cefiderocol"],"t":"Cefiderocol 3 × 2 g i.v.","dauer":"7–10 Tage"},{"label":"Alternative","subs":["sulbactam_durlobactam","meropenem"],"t":"Sulbactam/Durlobactam 4 × 2 g plus Meropenem 3 × 1 g i.v. (keine EU-Zulassung, Import — Verfügbarkeit früh mit der Apotheke klären, Bestellung bis 3 Wochen)","dauer":"7–10 Tage"}],"hinweise":["Nur bei Infektion, nicht bei Kolonisation behandeln."],"ref":"S3 Multiresistente Bakterien","wahl":"Cefiderocol ist sofort verfügbar. Sulbactam/Durlobactam plus Carbapenem hat die bessere Studienlage, muss aber importiert werden — früh bestellen, bis dahin Cefiderocol möglichst in Kombination."}},"rahmen":[{"titel":"Geltungsbereich","text":"Akzeptierter Standard für die kalkulierte Initialtherapie häufiger Infektionen. Nach mikrobiologischem Befund unverzüglich gezielt umstellen. Kein Lehrbuch, ersetzt nicht die Anpassung an Kinder, Schwangere, Ältere sowie Leber- und Niereninsuffizienz."},{"titel":"Verfügbarkeit","text":"Alle in der Leitlinie genannten Wirkstoffe sind im Haus vorrätig."},{"titel":"Oberarztantibiotika","text":"Erste Anforderung patientenbezogen mit Sonderanforderung, Oberarzt-Unterschrift und Antibiogramm; Folgeanforderungen mit Stationsarzt-Unterschrift."},{"titel":"Reserveantibiotika nach G-BA","text":"Erstabgabe nur mit Sonderanforderung, Oberarzt-Unterschrift, Empfehlung von ABS-Team und Mikrobiologie sowie Antibiogramm; Zusatzdokumentation in die Akte einscannen. Resistenztestung nur außerhalb der Routine — Rücksprache Mikrobiologie. Folgeanforderungen mit Stationsarzt-Unterschrift."},{"titel":"Übrige Wirkstoffe","text":"Über den e-Shop der Apotheke, Freigabe durch den Stationsarzt."},{"titel":"Medico Portal","text":"Karteikastensystem je Diagnose mit Antibiotikum, Dosis, Dauer, teils oraler Anschlusstherapie und Alternativen bei Penicillinallergie — vor deren Verordnung PEN-FAST prüfen. Entbindet nicht von der Anpassung an Befunde."}],"strategien":["Bei Rezidiv Vortherapien erfragen und ggf. Präparat wechseln.","Kein Antibiotikum bei unklarem Fieber als alleinigem Symptom.","Mikrobiologische Diagnostik vor Therapiebeginn (Ausnahme z. B. Endokarditisprophylaxe), danach bei Infektion sofort kalkuliert beginnen.","Kolonisation ist keine Indikation.","Indikation täglich überdenken, Reevaluation nach 2 Tagen; unnötige Antibiotika sofort absetzen.","Bei schweren Infektionen und langsamem Ansprechen nicht zu schnell wechseln; bei Nichtansprechen nach 3–4 Tagen reevaluieren (falsche Diagnose, falsche Substanz, Viren oder Pilze, Dosis, Konzentration am Wirkort).","Bei klinischer Besserung und gesicherter Resorption oralisieren.","Kombinationen nur, wenn erforderlich; Wechselwirkungen beachten.","Bei schweren, lebensbedrohlichen Infektionen Auswahl mit der Mikrobiologie abstimmen."],"prinzipien":["Parenteral nur, wenn oral wegen Schwere oder fehlender Einnahmefähigkeit nicht möglich. Immer i.v.: perioperative Prophylaxe und Erstgabe in der ZNA bei frischen Wunden.","Fluorchinolone und Linezolid möglichst sofort oral — gleiche Spiegel wie i.v.","Betalaktame immer mindestens 3 Tage parenteral beginnen, dann Sequenztherapie.","Gabe über Ernährungssonde: präparatespezifische Informationen (AMeLI, Apotheke) beachten.","Orale Präparate bevorzugen, wenn ein adäquates Arzneimittel verfügbar ist."],"fehler":["Breitspektrum, wo ein Schmalspektrum reicht.","Zu lange Therapiedauer.","Parenteral, wo oral möglich wäre — und umgekehrt.","Kombination, wo eine Substanz reicht.","Keine Anpassung nach Antibiogramm.","Keine Dosisanpassung bei Leber- oder Niereninsuffizienz."],"eucast":[["S","sensibel bei Standarddosierung","Einsatz in Standarddosis möglich"],["I","sensibel bei erhöhter Dosierung","Einsatz in Hochdosis möglich"],["R","resistent","kein Einsatz"]],"konflikte":[{"fokus":"cdi","titel":"CDI: Vancomycin zuerst","haus":"Vancomycin 4 × 125 mg p.o. als Primärtherapie; Fidaxomicin bei erhöhtem Rezidivrisiko oder erstem Rezidiv.","app":"Fidaxomicin als bevorzugte Erstlinie bei initialer Infektion und erstem Rezidiv.","einordnung":"Kein grober Widerspruch: das Haus setzt Fidaxomicin risikoadaptiert ein. Wer Rezidivrisiko hat (Alter > 65, Immunsuppression, Niereninsuffizienz, PPI, Vortherapie), bekommt auch nach Hausregel Fidaxomicin."},{"fokus":"endokarditis_nativ","titel":"Endokarditis kalkuliert: Dreierkombination","haus":"Ampicillin plus Gentamicin plus Ceftriaxon.","app":"Ampicillin plus Ceftriaxon oder (Flu)cloxacillin plus Gentamicin; Aminoglykoside zurückhaltend (ungeprüft gegen den genauen ESC-Wortlaut).","einordnung":"Das Hausregime vereint beide Optionen. Gentamicin ist nephrotoxisch — nach Erregernachweis früh fokussieren und Gentamicin absetzen, wo es nicht gebraucht wird."},{"fokus":"nekrot_fasziitis","titel":"Nekrotisierende Fasciitis: Linezolid als Alternative","haus":"Pip/Tazo plus Clindamycin; bei MRSA-Risiko Pip/Tazo plus Linezolid.","app":"Clindamycin ist zur Toxinsuppression besser belegt: in einer propensity-gematchten Kohorte lag die Sterblichkeit unter adjuvantem Linezolid höher.","einordnung":"Bei MRSA-Risiko deckt Linezolid Erreger und Toxin zugleich — vertretbar. Ohne MRSA-Risiko bleibt Clindamycin die bessere Wahl. Lokal ist S. aureus zu 24 % clindamycinresistent; die Toxinsuppression bei GAS betrifft das nicht."},{"fokus":"sepsis_unklar","titel":"Septischer Schock: Pip/Tazo statt Carbapenem","haus":"Pip/Tazo plus Linezolid, bei MRGN-Risiko plus Ciprofloxacin.","app":"Im septischen Schock mit MRE-Risiko ein Carbapenem.","einordnung":"Die lokale Resistenzlage 2025 zeigt Pip/Tazo-Resistenz bei Pseudomonas 33 %, E. cloacae 32 %, K. pneumoniae 24 %. Das Haus kompensiert über Ciprofloxacin (Pseudomonas 14 % R). Bei bekannter Pseudomonas- oder MRGN-Kolonisation lohnt die frühe Rücksprache mit dem ABS-Team."},{"fokus":"verbrennung","titel":"Verbrennung: Prophylaxe oder nicht?","haus":"Single-Shot-Cefazolin bei Verbrennungschirurgie mit sauberer Wunde; 72 h Pip/Tazo bei großen, verschmutzten Defekten.","app":"Keine prophylaktische Dauer-Antibiose wegen der Verbrennungswunde allein.","einordnung":"Kein Widerspruch: die Hausregel ist eine perioperative Prophylaxe für den Eingriff (Exzision, Transplantation), keine Dauerprophylaxe der Wunde."},{"sub":"vancomycin","titel":"Vancomycin: Talspiegel 15–20 mg/l","haus":"Zieltalspiegel 15–20 mg/l bei komplizierten Infektionen und AUC24/MHK 400–600 über VancoEasy.","app":"AUC-gesteuert 400–600; Talspiegelsteuerung allein gilt als überholt.","einordnung":"Gut vereinbar, weil das Haus die AUC mitberechnet. Ein Talspiegel von 15–20 mg/l allein überschreitet häufig AUC 600 — dann zählt die AUC."}],"auffaellig":[{"kap":"5.1–5.3","text":"„Wiederholung gemäß Tabelle 0“ bzw. „Tabelle 5.4“ — gemeint ist offenbar Tabelle 5.6 (Dosiswiederholung nach Nierenfunktion)."},{"kap":"5.5","text":"Vancomycin-PAP: „2 g < 90 kg KG“ — gemeint vermutlich > 90 kg."},{"kap":"8.1","text":"Nach Bandplastik, vorherige Spülungen: Pip/Tazo „3 × 3 g“ — sonst überall 4,5 g je Gabe; vermutlich 3 × 4,5 g."},{"kap":"8.1","text":"Fußnote: Vancomycin als Penicillinallergie-Alternative trägt den Rifampicin-Hinweis (³) statt der Spiegelkontrolle (²)."},{"kap":"10.2","text":"„Verdacht auf gonorrhoische Urethritis (NGU)“ — gemeint GU."},{"kap":"10.4","text":"„Urosepsis siehe Kapitel 0“ — gemeint Kap. 15.4."},{"kap":"14","text":"Vancomycin-Zieltalspiegel „(15–)20 mg/dl“ — gemeint mg/l."},{"kap":"15.2","text":"Linezolid „2 × 600 g“ — gemeint mg; bei nosokomialer Sepsis ohne MRE-Risiko fehlt die Linezolid-Dosis."},{"kap":"17.2","text":"Voriconazol: „Cave … QT-Zeitverkürzung“ — Voriconazol verlängert die QT-Zeit; eine Verkürzung ist typisch für Isavuconazol."},{"kap":"23.1","text":"„Als Kind (> 16 Jahre)“ — gemeint < 16 Jahre."},{"kap":"23.2","text":"„konkret siehe 18.3“ — gemeint Kap. 23.3."},{"kap":"12 / 21.1","text":"Amoxicillin p.o. ist Erstlinie der leichten CAP, steht in der Hausliste aber als Oberarztantibiotikum „nur gezielt bei E. faecalis“."},{"kap":"6 / 9 / 14 / 21.1","text":"Ampicillin i.v. ist kalkulierte Erstlinie bei Meningitis, Endokarditis und Endokarditisprophylaxe, in der Hausliste aber Oberarztantibiotikum „nur gezielt bei E. faecalis“."},{"kap":"10.1 / 20.10","text":"Nitrofurantoin retard: 2 × 100 mg (Kap. 10.1) gegenüber 3 × 100 mg (Hausliste)."},{"kap":"20.1","text":"Pip/Tazo Standarddosis „3 × 4,5 g KI“ — die Abkürzung KI ist nicht erläutert."},{"kap":"19 / 14","text":"Referenzen: S3 Multiresistente Bakterien „gültig bis 30.10.2023“ (aktualisierte Fassung 02/2026 liegt vor), S1 Hirnabszess „gültig bis 31.12.2025“."},{"kap":"2.1","text":"S. agalactiae mit Erythromycin- und Clindamycinresistenz von je 93 % (n = 48) — auffallend hoch, Plausibilität mit der Mikrobiologie klären."}],"resistenz":{"titel":"Resistenzlage BG Klinik 2025","meta":[["Aerobe Erreger" usleitlinie vor."]},"sepsis_unklar":{"kap":"Blutstrominfektionen","titel":"Sepsis bei unbekanntem Fokus","stand":"14.07.2026","regime":[{"label":"","t":"Ambulant erworben: Piperacillin/Tazobactam 4 × 4/0,5 g i.v.","dauer":"7–10 Tage","evidenz":"—","quelle":"DSG 2025, modifiziert","subs":["piptazo"]},{"label":"","t":"Nosokomial: Piperacillin/Tazobactam 4 × 4/0,5 g i.v.","dauer":"7–10 Tage","evidenz":"—","quelle":"DSG 2025","subs":["piptazo"]},{"label":"","t":"Nosokomial, vor allem bei vorbestehender Antibiose: Meropenem 3 × 2 g i.v.","dauer":"7–10 Tage","evidenz":"—","quelle":"PEG 2018, modifiziert","subs":["meropenem"]}],"hinweise":["Zusatzrisiken A bis D abschätzen (siehe Stewardship-Seite).","Erreger laut Hausleitlinie: S. aureus, Streptokokken, E. coli, Enterokokken, Klebsiella, Pseudomonas, MRSA."]},"urosepsis":{"kap":"Blutstrominfektionen / Harnwegsinfektionen","titel":"Sepsis mit Fokus Harnwege, komplizierte Pyelonephritis","stand":"14.07.2026 / 11.04.2022","regime":[{"label":"","t":"Sepsis, ambulant erworben: Ceftriaxon 2 × 2 g am ersten Tag, dann 1 × 2 g","dauer":"5–7 Tage","evidenz":"—","quelle":"PEG 2018, modifiziert","subs":["ceftriaxon"]},{"label":"","t":"Sepsis, nosokomial erworben: Cefepim 3 × 1–2 g i.v.","dauer":"7–10 Tage","evidenz":"—","quelle":"DSG 2025","subs":["cefepim"]},{"label":"","t":"Komplizierte Pyelonephritis, nosokomial oder Versagen der Initialtherapie: Piperacillin/Tazobactam 3 × 4/0,5 g","dauer":"bis 3–5 Tage nach klinischer Besserung","evidenz":"II, B","quelle":"modifiziert","subs":["piptazo"]},{"label":"","t":"Komplizierte Pyelonephritis: Meropenem 3 × 1–2 g","dauer":"bis 3–5 Tage nach klinischer Besserung","evidenz":"Ib, B","quelle":"PEG 2018","subs":["meropenem"]},{"label":"","t":"Komplizierte Pyelonephritis: Ceftazidim 3 × 2 g","dauer":"bis 3–5 Tage nach klinischer Besserung","evidenz":"Ib, A","quelle":"PEG 2018","subs":["ceftazidim"]}],"hinweise":["Urinkultur vor Therapiebeginn, Urin sofort ins Labor oder gekühlt.","Unkomplizierte schwere Pyelonephritis: Ceftriaxon, primär kein Aminoglykosid als Kombination.","Gesamttherapiedauer 1 bis 2 Wochen, Umstellung auf orale Therapie nach Antibiogramm."]},"pyelonephritis_obstruktiv":{"kap":"Harnwegsinfektionen","titel":"Pyelonephritis, kompliziert","stand":"11.04.2022","regime":[{"label":"","t":"Unkompliziert, schwere Verlaufsform: Ceftriaxon 2 × 2 g am ersten Tag, dann 1 × 2 g","dauer":"bis 3–5 Tage nach Besserung, gesamt 1–2 Wochen","evidenz":"Ib, A","quelle":"DGU 2017, PEG 2018","subs":["ceftriaxon"]},{"label":"","t":"Kompliziert, nosokomial: Piperacillin/Tazobactam 3 × 4/0,5 g","dauer":"bis 3–5 Tage nach Besserung","evidenz":"II, B","quelle":"modifiziert","subs":["piptazo"]},{"label":"","t":"Kompliziert, nosokomial: Meropenem 3 × 1–2 g oder Ceftazidim 3 × 2 g","dauer":"bis 3–5 Tage nach Besserung","evidenz":"Ib","quelle":"PEG 2018","subs":["ceftazidim","meropenem"]}],"hinweise":["Primär kein Aminoglykosid als Kombinationspartner."]},"katheter_hwi":{"kap":"Harnwegsinfektionen","titel":"Bakteriurie und katheterassoziierte Infektion","stand":"11.04.2022","regime":[{"label":"","t":"Asymptomatische Bakteriurie: keine Therapie","dauer":"—","evidenz":"Ia, A","quelle":"DGU 2017, EAU 2021","subs":[]},{"label":"","t":"Vor blasenschleimhautverletzenden Eingriffen, ggf. bei Immunsuppression: gezielte Therapie gemäß Antibiogramm","dauer":"5–7 Tage","evidenz":"V, B","quelle":"modifiziert","subs":[]}],"hinweise":["Katheterentfernung oder -wechsel vor Gewinnung von Dauerkatheterurin dringlich empfohlen.","Eine Bakteriurie ist in bis zu 90 % Kolonisation und keine Infektion.","Bei stabilen Patienten mit Katheter: Mikrobiologie abwarten, dann gezielt behandeln.","Bei instabilen Patienten, Urinaufstau, Flankenklopfschmerz, Sepsis, Neutropenie oder neuer Bewusstseinsstörung kalkuliert behandeln."]},"peritonitis_ambulant":{"kap":"Abdominelle Infektionen","titel":"Sekundäre ambulant erworbene Peritonitis","stand":"10.09.2024","regime":[{"label":"","t":"Lokalisiert, f
