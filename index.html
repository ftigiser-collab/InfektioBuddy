<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Infektio</title>
<meta name="theme-color" content="#123a5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Infektio">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/icon-192.png">
<link rel="manifest" href="./manifest.webmanifest">
<style>
:root{
  --teal:#17a2a1; --teal-d:#0e7f80; --navy:#123a5c; --navy-l:#2b5a80;
  --bg:#eef3f5; --card:#ffffff; --ink:#16232e; --muted:#5c7183; --line:#dae4ea;
  --gut:#1a7f52; --maessig:#b3801d; --schlecht:#a8483a; --untauglich:#7b2d46;
  --haeufig:#123a5c; --moeglich:#5c7183; --selten:#9aabb8;
  --warn:#a8483a; --warnbg:#fbf0ee; --star:#c9962a;
  --radius:14px; --shadow:0 1px 2px rgba(18,58,92,.08), 0 4px 16px rgba(18,58,92,.06);
}
[data-theme="dark"]{
  --bg:#0e1a22; --card:#152530; --ink:#e6eef3; --muted:#93a8b6; --line:#243a48;
  --navy:#8fc4e8; --navy-l:#a9d3f0; --teal:#3fc4bd; --teal-d:#61d6cf;
  --gut:#4cb98a; --maessig:#d6a445; --schlecht:#e0796a; --untauglich:#c96b8c;
  --haeufig:#cfe3f0; --moeglich:#93a8b6; --selten:#63798a;
  --warn:#e0796a; --warnbg:#2a1c1c; --star:#e0b552; --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 64px}
header{position:sticky;top:0;z-index:30;background:var(--bg);padding-top:env(safe-area-inset-top);
  border-bottom:1px solid transparent;transition:border-color .2s}
header.scrolled{border-bottom-color:var(--line)}
.bar{max-width:820px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.back{border:none;background:none;padding:6px 8px 6px 0;cursor:pointer;display:flex;
  align-items:center;gap:6px;color:var(--navy);font-weight:600;font-size:15px}
.back svg{width:16px;height:16px}
.crumb{font-size:13px;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{border:none;background:none;cursor:pointer;padding:6px;color:var(--muted);font-size:17px;line-height:1}
.iconbtn.on{color:var(--star)}
.logo{display:block;margin:6px auto 2px;max-width:230px;width:62%}
.tagline{text-align:center;color:var(--muted);font-size:14px;margin:0 0 20px}
.tiles{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:620px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;box-shadow:var(--shadow)}
@media(min-width:620px){.tile{flex-direction:column;text-align:center;gap:10px;padding:22px 14px}}
.tile img{width:56px;height:56px;object-fit:contain;flex:none}
@media(min-width:620px){.tile img{width:76px;height:76px}}
.tile b{display:block;font-size:17px;color:var(--navy);letter-spacing:-.01em}
.tile span{font-size:13px;color:var(--muted);display:block;margin-top:2px}
[data-theme="dark"] .tile img{filter:brightness(.94) saturate(1.05)}
.search{position:relative;margin:18px 0 6px}
.search input{width:100%;padding:13px 15px;font-size:16px;border:1px solid var(--line);
  border-radius:var(--radius);background:var(--card);color:var(--ink)}
.search input:focus{outline:2px solid var(--teal);outline-offset:-1px;border-color:transparent}
.minor{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.minor button{border:1px solid var(--line);background:var(--card);border-radius:999px;
  padding:7px 14px;font-size:13.5px;cursor:pointer;color:var(--navy)}
.recent{margin-top:22px}
.recent h3{font-size:13px;color:var(--muted);font-weight:600;margin:0 0 8px}
h1{font-size:23px;line-height:1.25;margin:2px 0 4px;letter-spacing:-.02em}
h2.group{font-size:12.5px;font-weight:700;color:var(--muted);margin:22px 0 8px;letter-spacing:.04em}
.gbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:11px;padding:13px 14px;cursor:pointer;margin-top:8px}
.gbtn:hover{border-color:var(--teal)}
.gbtn b{flex:1;font-size:15.5px;font-weight:650;letter-spacing:-.01em}
.gbtn .cnt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.gbtn .chev{color:var(--muted);transition:transform .18s}
.gbtn.open{border-color:var(--teal);border-bottom-left-radius:0;border-bottom-right-radius:0}
.gbtn.open .chev{transform:rotate(90deg);color:var(--teal)}
.gbody{border:1px solid var(--teal);border-top:none;border-radius:0 0 11px 11px;
  padding:8px;display:flex;flex-direction:column;gap:7px;background:var(--bg)}
.gbody .item{border-color:var(--line)}
.gtools{display:flex;gap:8px;margin:14px 0 2px}
.rfield{display:grid;grid-template-columns:1fr 92px;gap:10px;align-items:center;
  padding:11px 0;border-bottom:1px solid var(--line)}
.rfield:last-of-type{border-bottom:none}
.rfield label{font-size:14.5px}
.rfield .sub{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.rfield input{width:100%;padding:9px 10px;font-size:15px;border:1px solid var(--line);
  border-radius:9px;background:var(--bg);color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.rfield input:focus{outline:2px solid var(--teal);outline-offset:-1px}
.rhit{border-left:3px solid var(--warn);padding:2px 0 2px 13px;margin-bottom:14px}
.rhit b{display:block;font-size:13px;color:var(--warn);margin-bottom:4px}
.rbanner{background:var(--warnbg);border:1px solid var(--warn);border-radius:11px;
  padding:12px 14px;margin-top:12px;font-size:14.5px}
.rbanner b{color:var(--warn);display:block;font-size:12.5px;margin-bottom:4px;letter-spacing:.03em}
table.dur{width:100%;border-collapse:collapse;font-size:14px}
table.dur td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.dur td:first-child{padding-right:12px}
table.dur tr:last-child td{border-bottom:none}
table.dur a{color:var(--teal-d);cursor:pointer;text-decoration:none}
.card.haus{border-color:var(--navy);border-width:1.5px}
[data-theme="dark"] .card.haus{border-color:var(--navy)}
.card.haus > h3{color:var(--navy)}
.llreg{border-left:3px solid var(--navy);padding:2px 0 2px 13px;margin-bottom:13px}
.llreg:last-child{margin-bottom:0}
.llreg b{display:block;font-size:14.5px;font-weight:600;margin-bottom:4px;line-height:1.35}
.llmeta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:12px;margin-top:4px}
.llmeta span{white-space:nowrap}
.konflikt{border-left:3px solid var(--maessig);padding:2px 0 2px 13px;margin-bottom:14px}
.konflikt b{display:block;font-size:13.5px;color:var(--maessig);margin-bottom:5px}
.stand{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.rgwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px}
table.rg{border-collapse:separate;border-spacing:0;font-size:12px;min-width:640px}
table.rg th{font-weight:700;color:var(--muted);font-size:11px;padding:6px 4px;text-align:center;white-space:nowrap}
table.rg th.er{text-align:left;position:sticky;left:0;background:var(--card);z-index:2;min-width:170px;padding-left:0}
table.rg td{padding:5px 4px;text-align:center;border-top:1px solid var(--line)}
table.rg td.er{text-align:left;position:sticky;left:0;background:var(--card);z-index:2;
  font-size:12.5px;padding-left:0;line-height:1.3}
table.rg td.er a{color:var(--ink);cursor:pointer}
.sq{display:inline-block;width:15px;height:15px;border-radius:3px}
.sq.gruen{background:var(--gut)} .sq.gelb{background:var(--maessig)}
.sq.rot{background:var(--schlecht)} .sq.leer{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.rglegend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted);margin-top:12px}
.rglegend span{display:inline-flex;align-items:center;gap:6px}
.lokal{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.rgcard{border-left:3px solid var(--maessig);padding:2px 0 2px 13px;margin-bottom:14px}
.rgcard.rot{border-left-color:var(--schlecht)}
.rgcard.gruen{border-left-color:var(--gut)}
.rgcard b{display:block;font-size:13.5px;margin-bottom:5px}
.rgcard.rot b{color:var(--schlecht)} .rgcard.gelb b{color:var(--maessig)} .rgcard.gruen b{color:var(--gut)}
.gtools button{border:1px solid var(--line);background:var(--card);border-radius:999px;
  padding:6px 13px;font-size:13px;cursor:pointer;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:7px}
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:11px;padding:12px 14px;cursor:pointer}
.row:hover{border-color:var(--teal)}
.row .rt{flex:1;min-width:0}
.row b{display:block;font-weight:600;font-size:15.5px;line-height:1.3}
.row small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.row .chev{color:var(--line);flex:none;transition:transform .18s}
.item{background:var(--card);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.item.open{border-color:var(--teal)}
.item .row{border:none;border-radius:0;background:none}
.item.open .chev{transform:rotate(90deg);color:var(--teal)}
.peek{padding:0 14px 14px;border-top:1px solid var(--line);margin-top:-2px}
.peek dl{margin:12px 0 0}
.peek .full{margin-top:12px}
.kicker{font-size:12.5px;color:var(--teal-d);font-weight:700;margin:0 0 3px}
[data-theme="dark"] .kicker{color:var(--teal)}
.lede{color:var(--muted);font-size:14.5px;margin:8px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:12px}
.card > h3{font-size:12.5px;font-weight:700;color:var(--muted);margin:0 0 10px;letter-spacing:.03em}
.card p{margin:0 0 10px;font-size:15px}
.card p:last-child{margin-bottom:0}
.card ul{margin:0;padding-left:18px;font-size:15px}
.card li{margin-bottom:7px}
.card li:last-child{margin-bottom:0}
.card.warn{background:var(--warnbg);border-color:var(--warn)}
.card.warn > h3{color:var(--warn)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px;align-items:baseline}
.dl dt{color:var(--muted);font-size:13px}
.dl dd{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;
  font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;color:var(--ink)}
.chip:hover{border-color:var(--teal)}
.chip.plain{cursor:default}
.chip.plain:hover{border-color:var(--line)}
.chip.ext{border-style:dashed}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.dot.haeufig{background:var(--haeufig)}
.dot.moeglich{background:var(--moeglich)}
.dot.selten{background:transparent;box-shadow:inset 0 0 0 1.5px var(--selten)}
.amp{font-weight:700;font-size:18px;line-height:1}
.amp.gut{color:var(--gut)} .amp.maessig{color:var(--maessig)}
.amp.schlecht{color:var(--schlecht)} .amp.untauglich{color:var(--untauglich)}
.amp.eingeschraenkt{color:var(--maessig)} .amp.unwirksam{color:var(--muted)}
.ampw{font-size:12.5px;color:var(--muted);margin-left:6px}
.penrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 0;
  border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:none;
  border-right:none;border-top:none;text-align:left;font-size:14.5px}
.penrow:last-of-type{border-bottom:none}
.penrow:hover span:first-child{color:var(--teal-d);text-decoration:underline}
.penval{display:inline-flex;align-items:baseline;white-space:nowrap}
.ther{border-left:3px solid var(--teal);padding:2px 0 2px 13px;margin-bottom:16px}
.ther:last-child{margin-bottom:0}
.ther b{display:block;font-size:13px;color:var(--teal-d);margin-bottom:5px}
[data-theme="dark"] .ther b{color:var(--teal)}
.ther p{font-size:14.5px;margin:7px 0 0}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;vertical-align:middle}
.badge.ueberholt{background:var(--warnbg);color:var(--warn);border:1px solid var(--warn)}
.badge.ext{background:transparent;color:var(--muted);border:1px dashed var(--muted);font-weight:600}
.badge.std{background:rgba(23,162,161,.14);color:var(--teal-d);font-weight:600}
[data-theme="dark"] .badge.std{color:var(--teal)}
.badge.ev-belastbar{background:rgba(26,127,82,.12);color:var(--gut)}
.badge.ev-solide{background:rgba(23,162,161,.14);color:var(--teal-d)}
.badge.ev-begrenzt{background:rgba(179,128,29,.14);color:var(--maessig)}
.badge.ev-umstritten{background:rgba(92,113,131,.14);color:var(--muted)}
[data-theme="dark"] .badge.ev-solide{color:var(--teal)}
.abk{border-bottom:1px dotted var(--muted);cursor:help}
.note{font-size:13px;color:var(--muted);margin-top:6px}
.ungeprueft{color:var(--maessig);font-weight:600}
.empty{color:var(--muted);font-size:14.5px;padding:24px 0;text-align:center}
.foot{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.legend{margin-top:12px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.legend div{display:flex;gap:8px;align-items:baseline}
.legend .amp{flex:none;width:18px;text-align:center}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== v4 Ergänzungen ===== */
:root{--rc-g:#1a7f52;--rc-gb:rgba(26,127,82,.12);--rc-y:#9a6a10;--rc-yb:rgba(179,128,29,.16);--rc-r:#b03a2e;--rc-rb:rgba(168,72,58,.14);--rc-x:#fff;--rc-xb:#5e1f2e;--oa:#8a5a00;--oab:rgba(201,150,42,.18);--res:#fff;--resb:#7b2d46;--hausbg:#f4f8fb}
[data-theme="dark"]{--rc-g:#5fd09c;--rc-gb:rgba(76,185,138,.16);--rc-y:#e6b85c;--rc-yb:rgba(214,164,69,.18);--rc-r:#f08b7d;--rc-rb:rgba(224,121,106,.18);--rc-xb:#a3405a;--oa:#e8c46a;--oab:rgba(224,181,82,.18);--resb:#a3405a;--hausbg:#13222c}
.hausname{color:var(--navy);font-weight:650;cursor:pointer}
.tile span{font-variant-numeric:tabular-nums}
.hausblock{margin-top:18px;border:1.5px solid var(--navy);border-radius:var(--radius);background:var(--hausbg);padding:14px}
.hb-kopf{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.hb-name{display:block;font-weight:700;color:var(--navy);font-size:16px;letter-spacing:-.01em}
.hb-dok{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.hb-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hb-btn{display:flex;align-items:center;gap:10px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 10px;cursor:pointer;min-height:58px}
.hb-btn:hover{border-color:var(--navy)}
.hb-btn svg{width:22px;height:22px;flex:none;color:var(--navy)}
.hb-btn b{display:block;font-size:14px;font-weight:650;line-height:1.25}
.hb-btn small{display:block;font-size:11.5px;color:var(--muted);line-height:1.3;margin-top:1px}
.nachschlagen{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.nachschlagen button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:13.5px;cursor:pointer;color:var(--navy)}
.star{color:var(--star);font-size:15px}
.lk{border:none;background:none;color:var(--teal-d);font-weight:600;font-size:13.5px;cursor:pointer;padding:4px 0;text-align:left}
[data-theme="dark"] .lk{color:var(--teal)}
/* Abschnitte */
details.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-top:12px}
details.sec>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer}
details.sec>summary::-webkit-details-marker{display:none}
.st-t{font-size:14.5px;font-weight:650;flex:1}
.st-s{font-size:12.5px;color:var(--muted);text-align:right;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.sec>summary .chev{color:var(--muted);transition:transform .18s;flex:none}
details.sec[open]>summary .chev{transform:rotate(90deg);color:var(--teal)}
details.sec[open]>summary{border-bottom:1px solid var(--line)}
.sec-b{padding:12px 16px 16px;font-size:15px}
.sec-b p{margin:0 0 10px} .sec-b ul{margin:0;padding-left:18px} .sec-b li{margin-bottom:7px}
details.sec.warn{border-color:var(--warn)} details.sec.warn .st-t{color:var(--warn)}
.sub-h{font-size:12.5px;font-weight:700;color:var(--muted);margin:14px 0 6px!important}
.sub-h:first-child{margin-top:0!important}
/* Freigabe-Badges */
.st{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px;margin-left:6px;vertical-align:1px;letter-spacing:.01em;white-space:nowrap}
.st-oa{background:var(--oab);color:var(--oa)} .st-res{background:var(--resb);color:var(--res)}
.st-ext{border:1px dashed var(--muted);color:var(--muted)} .st-frei{background:var(--rc-gb);color:var(--rc-g)}
.st-gen,.st-none{background:var(--line);color:var(--muted)}
h1 + p .st,.kicker + h1 + p .st{font-size:12px;padding:3px 9px;margin-left:0}
.mk-h,.mk-l{display:inline-block;font-size:10.5px;font-weight:800;width:17px;height:17px;line-height:17px;text-align:center;border-radius:4px;margin-left:6px;vertical-align:1px}
.mk-h{background:var(--navy);color:var(--card)} .mk-l{background:var(--rc-gb);color:var(--rc-g)}
/* Hauskarte */
.card.haus{border:1.5px solid var(--navy);background:var(--hausbg)}
.hk-kopf{margin-bottom:6px}
.hk-tag{display:inline-block;font-size:11.5px;font-weight:700;color:var(--card);background:var(--navy);padding:3px 9px;border-radius:999px}
.card.haus h2{font-size:17px;margin:8px 0 2px;letter-spacing:-.01em;line-height:1.3}
.reg{border-left:3px solid var(--navy);padding:2px 0 2px 12px;margin:14px 0 0}
.reg-l{font-size:12.5px;color:var(--muted);font-weight:600;line-height:1.35;margin-bottom:3px}
.reg-t{font-size:15.5px;font-weight:600;line-height:1.4}
.reg-m{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted);margin-top:4px}
.reg-m span:first-child{color:var(--navy);font-weight:600}
.chips.sm{gap:6px;margin-top:8px} .chips.sm .chip{padding:4px 10px;font-size:12.5px}
.allerg{margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.allerg b{font-size:12.5px;color:var(--warn)} .allerg p{margin:3px 0 0;font-size:14.5px}
details.hk-more{margin-top:12px}
details.hk-more>summary{list-style:none;cursor:pointer;font-size:13.5px;font-weight:650;color:var(--navy);display:flex;align-items:center;gap:6px}
details.hk-more>summary::-webkit-details-marker{display:none}
details.hk-more>summary .chev{width:15px;height:15px;transition:transform .18s}
details.hk-more[open]>summary .chev{transform:rotate(90deg)}
details.hk-more ul{margin:8px 0 0;padding-left:18px;font-size:14px} details.hk-more li{margin-bottom:6px}
.hk-ref{font-size:12px;color:var(--muted);margin:12px 0 0!important}
.card.leer{background:transparent;border-style:dashed} .card.leer p{color:var(--muted);font-size:14px}
.card.konfl{border-left:4px solid var(--maessig)} .card.konfl>h3{color:var(--maessig)}
.card.konfl p{font-size:14.5px;margin-top:8px}
/* lokale Resistenz */
.rc{display:inline-block;min-width:44px;text-align:center;font-size:12.5px;font-weight:700;padding:2px 6px;border-radius:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rc.sm{min-width:30px;padding:1px 4px;font-size:11.5px}
.rc-g{background:var(--rc-gb);color:var(--rc-g)} .rc-y{background:var(--rc-yb);color:var(--rc-y)}
.rc-r{background:var(--rc-rb);color:var(--rc-r)} .rc-x{background:var(--rc-xb);color:var(--rc-x)} .rc-n{color:var(--muted)}
.chip .rc.sm{margin-left:2px}
.sq{display:inline-block;width:15px;height:15px;border-radius:3px;vertical-align:-2px}
.sq-g{background:var(--gut)} .sq-y{background:var(--maessig)} .sq-r{background:var(--schlecht)}
.card.rgk{border-left:4px solid var(--rc-r)}
.rgl{padding:6px 0 10px;border-bottom:1px solid var(--line)} .rgl:last-of-type{border-bottom:none}
.rgl>b{font-size:14.5px}
.rgl-v,.lt-v{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.rgi{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:3px 8px 3px 3px;font-size:13px;cursor:pointer;color:var(--ink)}
.rgi i{font-style:normal;font-size:10.5px;color:var(--muted)}
.ok{color:var(--rc-g);font-size:14.5px;margin:0}
.nklein{font-size:11.5px;color:var(--maessig);font-style:italic} .nn{font-size:11.5px;color:var(--muted)}
.lt{margin-bottom:12px} .lt-k{margin:0 0 4px!important;font-size:14.5px}
.lt-g{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:start;margin-top:6px}
.lt-l{font-size:12px;color:var(--muted);padding-top:5px}
.lt-g .lt-v{margin-top:0}
.spk{display:grid;grid-template-columns:76px 1fr;gap:8px;align-items:start;margin-bottom:10px} .spk:last-child{margin-bottom:0}
.spk-l{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;padding-top:7px}
.chip.gap{border-style:dashed;color:var(--muted)}
table.pt{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}
table.pt th{font-size:11.5px;color:var(--muted);font-weight:600;padding:4px;text-align:center}
table.pt td{padding:6px 4px;border-top:1px solid var(--line);text-align:center}
table.pt td:first-child,table.pt th:first-child{text-align:left}
/* Tabellen */
.rgwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:10px -16px 0;padding:0 16px}
table.rgt{border-collapse:separate;border-spacing:0;font-size:12px}
table.rgt th{font-size:10.5px;color:var(--muted);font-weight:700;padding:4px 2px;height:46px;vertical-align:bottom;white-space:nowrap}
table.rgt th span{display:inline-block;writing-mode:vertical-rl;transform:rotate(180deg)}
table.rgt td{padding:3px 2px;text-align:center;border-top:1px solid var(--line)}
table.rgt tbody tr{cursor:pointer} table.rgt tbody tr:hover td{background:var(--bg)}
table.rgt .er{text-align:left;position:sticky;left:0;background:var(--bg);z-index:2;min-width:132px;max-width:150px;font-size:12px;line-height:1.25;padding-right:6px}
table.rgt th.er{vertical-align:bottom}
table.rgt .n{font-size:11px;color:var(--muted);padding-right:6px;font-variant-numeric:tabular-nums}
table.rgt .n.klein{font-style:italic;color:var(--maessig)}
.codes{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--muted);margin-top:10px}
.codes b{color:var(--ink)}
.rglegend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12.5px;color:var(--muted);margin-top:12px}
.rglegend>span{display:inline-flex;align-items:center;gap:6px}
table.tb{width:100%;border-collapse:collapse;font-size:13px;min-width:420px}
table.tb th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:700;padding:6px 6px 6px 0;border-bottom:1px solid var(--line)}
table.tb td{padding:7px 6px 7px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.tb td.er{font-weight:600}
.seg{display:flex;background:var(--line);border-radius:10px;padding:3px;margin-top:14px;gap:3px}
.seg button{flex:1;border:none;background:none;border-radius:8px;padding:8px 6px;font-size:13.5px;cursor:pointer;color:var(--muted);font-weight:600}
.seg button.on{background:var(--card);color:var(--navy);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg.sm{flex-wrap:wrap} .seg.sm button{font-size:12.5px;padding:6px 8px;flex:1 1 auto}
.sel{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px;color:var(--muted)}
.sel select,.inp select,.inp input{font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink)}
.sel select{flex:1}
/* Hausliste */
.frow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);padding:10px 0;cursor:pointer;color:var(--ink)}
.frow:last-child{border-bottom:none}
.fr-n b{display:block;font-size:14.5px;font-weight:600} .fr-n small{display:block;font-size:12px;color:var(--muted);line-height:1.35}
.fr-d{grid-column:1;display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12.5px;color:var(--navy)}
.fr-i{grid-column:2;grid-row:1/3;display:flex;align-items:center;gap:6px}
.bv{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.bv-hoch{background:var(--gut)} .bv-mittel{background:var(--maessig)}
.preis{font-size:11.5px;font-weight:700;padding:1px 5px;border-radius:5px;letter-spacing:-.02em}
.p1{background:var(--rc-gb);color:var(--rc-g)} .p2{background:var(--rc-yb);color:var(--rc-y)} .p3{background:var(--rc-rb);color:var(--rc-r)} .p4{background:var(--rc-xb);color:#fff}
/* Schalter, PEN-FAST */
.tg{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:none;border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-top:8px;cursor:pointer;color:var(--ink);font-size:14.5px;line-height:1.4}
.tg.on{border-color:var(--teal);background:rgba(23,162,161,.07)}
.tg-b{flex:none;width:22px;height:22px;border-radius:6px;border:1.5px solid var(--muted);display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;font-weight:800}
.tg.on .tg-b{background:var(--teal);border-color:var(--teal)}
.tg-b.rund{border-radius:50%;font-size:10px}
.tg-t{flex:1} .tg-t small{color:var(--muted)}
.tg-p{flex:none;font-weight:800;color:var(--navy);font-size:13px;padding-top:2px}
.pf{display:flex;gap:14px;align-items:center;margin-top:14px;padding:12px 14px;border-radius:12px}
.pf b{font-size:15px} .pf p{margin:3px 0 0;font-size:14px}
.pf-s{font-size:30px;font-weight:800;line-height:1;text-align:center;min-width:52px}
.pf-s small{display:block;font-size:10.5px;font-weight:600}
.pf.gruen{background:var(--rc-gb);color:var(--rc-g)} .pf.gelb{background:var(--rc-yb);color:var(--rc-y)} .pf.rot{background:var(--rc-rb);color:var(--rc-r)}
.pf p{color:var(--ink)}
/* Rechner */
.inp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inp label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600}
.inp input,.inp select{width:100%}
.big{font-size:28px;font-weight:800;color:var(--navy);margin:8px 0 2px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.big small{display:block;font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:0}
.kap{flex:none;min-width:44px;font-size:12px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.abk-k{font-weight:650;color:var(--ink)!important;font-size:13.5px!important}
.ungeprueft{color:var(--maessig);font-weight:600}
@media(min-width:620px){.hb-grid{grid-template-columns:repeat(3,1fr)}}

.hb-kopf .lk{white-space:nowrap;flex:none}

/* ===== v4.1 ===== */
.tiles{grid-template-columns:1fr 1fr;gap:10px}
.tile{flex-direction:column;text-align:center;gap:8px;padding:16px 8px}
.tile img,.tile-ico{width:56px;height:56px}
.tile-ico{display:flex;align-items:center;justify-content:center;border-radius:13px;background:#fff;box-shadow:0 2px 6px rgba(18,58,92,.18);flex:none}
.tile-ico svg{width:38px;height:38px}
.tile b{font-size:16px} .tile span{font-size:12.5px}
@media(min-width:620px){.tiles{grid-template-columns:repeat(4,1fr)}}
.lsearch{margin:14px 0 4px}
.regs{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}
.regb{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 12px;cursor:pointer;min-height:66px;color:var(--ink)}
.regb:hover{border-color:var(--teal)}
.regb b{display:block;font-size:15.5px;font-weight:650;color:var(--navy);line-height:1.25}
.regb small{display:block;font-size:12px;color:var(--muted);margin-top:3px;line-height:1.3}
.mk-d{display:inline-block;font-size:11px;margin-left:5px;vertical-align:1px}
.clk{width:15px;height:15px;flex:none}
.dauer{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:var(--navy)}
.dauer.spez{background:var(--oab);color:var(--oa);padding:2px 8px 2px 6px;border-radius:7px;font-weight:700}
.reg-m span:first-child{color:inherit;font-weight:inherit}
.reg-m .dauer:first-child{color:var(--navy);font-weight:600}
.reg-m .dauer.spez:first-child{color:var(--oa);font-weight:700}
.dauerk{display:flex;gap:12px;align-items:flex-start;margin-top:14px;padding:13px 14px;border-radius:var(--radius);background:var(--oab);border:1.5px solid var(--star);color:var(--oa)}
.dauerk>.clk{width:26px;height:26px;margin-top:1px}
.dk-b b{display:block;font-size:13px;letter-spacing:.01em}
.dk-b p{margin:4px 0 0;font-size:15.5px;font-weight:650;color:var(--ink);line-height:1.4}
.dk-b p.dk-2{font-size:14px;font-weight:500;margin-top:8px}
.dk-q{display:inline-block;font-size:11px;font-weight:700;color:var(--oa);margin-top:2px}
.wahl{display:flex;gap:8px;align-items:baseline;margin-top:7px;padding:7px 10px;border-radius:9px;background:rgba(23,162,161,.10);font-size:13.5px;line-height:1.4}
.wahl b{flex:none;font-size:11px;font-weight:800;color:var(--teal-d);letter-spacing:.02em}
[data-theme="dark"] .wahl b{color:var(--teal)}
.wahl.kopf{margin:10px 0 2px;padding:10px 12px;font-size:14px;background:var(--card);border:1px solid var(--teal)}
.wahl.kopf span{display:block}
.sec-b .wahl.kopf{margin-top:0;margin-bottom:12px}
</style>

const DATA = {"KOMP":[{"id":"liquor_ne","name":"Liquor, nicht entzündet","kurz":"Liquor (n. entz.)","barriere":"Intakte Blut-Hirn- und Blut-Liquor-Schranke, Effluxpumpen. Betalaktame erreichen meist unter 5 % der Plasmakonzentration.","regeln":["Relevant für Prophylaxe und Frühphase nach neurochirurgischem Eingriff.","Wichtig für den Verlauf: mit nachlassender Entzündung schließt sich die Schranke wieder — eine anfangs wirksame Substanz kann unter die Zielkonzentration fallen."]},{"id":"liquor_e","name":"Liquor bei Entzündung","kurz":"Liquor (entz.)","barriere":"Bei Ventrikulitis lag das Verhältnis der Liquor- zur Plasma-AUC für Vancomycin zwischen 0,85 und 15,6 %, für Meropenem zwischen 0,09 und 13,2 %. Auf dieser Streuung lässt sich keine feste Dosis begründen.","regeln":["Dosis erhöhen, nicht Intervall verlängern: Meropenem 2 g alle 8 h statt 1 g.","TDM ist hier am wenigsten verzichtbar.","Fosfomycin, Rifampicin und Aminoglykoside niemals als Monotherapie.","Bei Staphylokokken-Ventrikulitis ist intraventrikuläres Vancomycin eine Option, genannt werden etwa 10 mg/d beim Erwachsenen.","Unter Dexamethason empfiehlt die DGN vorsichtshalber Ceftriaxon plus Rifampicin statt Ceftriaxon plus Vancomycin."]},{"id":"lunge","name":"Lunge / epitheliale Auskleidungsflüssigkeit","kurz":"Lunge (ELF)","barriere":"Blut-Luft-Schranke. Entscheidend ist die ELF-Konzentration, nicht der Plasmaspiegel.","regeln":["Vancomycin penetriert schlecht — bei MRSA-Pneumonie ist Linezolid vorzuziehen.","Daptomycin wird durch Surfactant inaktiviert: bei Pneumonie unbrauchbar trotz In-vitro-Wirksamkeit.","Tigecyclin erreicht zu niedrige Spiegel für Pneumonie und Bakteriämie."]},{"id":"pleura","name":"Pleuraempyem","kurz":"Pleura","barriere":"Keine echte Membran, aber saures Milieu, hohes Inokulum und Fibrinsepten. Antibiotika kommen an, wirken aber schlecht.","regeln":["Kein Antibiotikum saniert ein Empyem — Drainage, ggf. Fibrinolyse oder Dekortikation entscheiden.","Therapiedauer 2–4 Wochen, deutlich länger als bei Pneumonie."]},{"id":"peritoneum","name":"Peritoneum","kurz":"Peritoneum","barriere":"Gut erreichbar für alle Betalaktame, Metronidazol und Linezolid.","regeln":["Bei offenem Abdomen, Lavagen und hohem Drainagevolumen gehen relevante Wirkstoffmengen verloren — Unterdosierung ist wahrscheinlicher als Überdosierung.","Kapillarleck und Volumentherapie vergrößern das Verteilungsvolumen hydrophiler Substanzen: Aufsättigungsdosis nicht reduzieren."]},{"id":"galle","name":"Galle","kurz":"Galle","barriere":"Hohe biliäre Ausscheidung bei Acylaminopenicillinen, Carbapenemen und Makroliden.","regeln":["Bei vollständiger Obstruktion ist die biliäre Ausscheidung aufgehoben — gute Gallengängigkeit nützt nichts, solange der Gang zu ist.","Literaturdaten stammen von Patienten mit offenem Gallengang und sind nicht übertragbar.","Bei Cholangitis entscheidet die Entlastung (ERCP, PTCD)."]},{"id":"pankreas","name":"Pankreas und Pankreasnekrose","kurz":"Pankreas","barriere":"Bewährt haben sich Carbapeneme sowie Chinolone plus Metronidazol; Aminoglykoside erreichen keine ausreichenden Gewebekonzentrationen.","regeln":["Die Indikationsfrage steht vor der Penetrationsfrage: keine generelle Prophylaxe bei prognostiziert schwerer Pankreatitis.","Behandelt wird bei Nachweis oder begründetem Verdacht auf infizierte Nekrose.","Breites Regime begünstigt grampositive Selektion und Pilzbesiedlung der Nekrose mit schlechter Prognose."]},{"id":"nierenparenchym","name":"Nierenparenchym","kurz":"Nierenparenchym","barriere":"Bei Pyelonephritis und Urosepsis zählt die Gewebekonzentration, nicht die Harnkonzentration.","regeln":["Substanzen mit hoher Harn-, aber niedriger Gewebekonzentration (Nitrofurantoin, orales Fosfomycin-Trometamol) sind bei Zystitis brauchbar und bei Pyelonephritis falsch."]},{"id":"urin","name":"Urin","kurz":"Urin","barriere":"Renale Elimination bestimmt die Konzentration im Harn.","regeln":["Caspofungin erreicht den Urin nicht — bei Candidurie ist Fluconazol die richtige Substanz.","Bei Anurie unter Nierenersatzverfahren entfällt der Urinweg vollständig; dann entscheidet die Katheterentfernung."]},{"id":"prostata","name":"Prostata","kurz":"Prostata","barriere":"Lipidmembran und pH-Gradient — nur lipophile, basische Substanzen kommen an.","regeln":["Betalaktame und Vancomycin erreichen die Prostata nicht, obwohl das Antibiogramm sensibel meldet.","Geeignet sind Cotrimoxazol und Chinolone."]},{"id":"knochen","name":"Knochen","kurz":"Knochen","barriere":"Mineralisierte Matrix mit geringer Perfusion; Sequester sind gar nicht perfundiert.","regeln":["Vancomycin ist schlecht knochengängig — bei MRSA-Osteomyelitis ein relevanter Nachteil.","Ohne Débridement nekrotischen Knochens kein Therapieerfolg.","Therapiedauer Wochen bis Monate."]},{"id":"gelenk","name":"Gelenk","kurz":"Gelenk","barriere":"Synoviale Penetration meist gut; begrenzend sind Inokulum und Fremdmaterial.","regeln":["Spülung oder Arthroskopie gehören zur Therapie.","Bei Prothese zusätzlich Biofilmproblematik."]},{"id":"vegetation","name":"Vegetation bei Endokarditis","kurz":"Vegetation","barriere":"Avaskuläre Fibrin-Thrombozyten-Schicht, sehr hohes Inokulum, Bakterien in metabolischer Ruhe.","regeln":["Entscheidend ist Bakterizidie und Dauer, nicht Penetration.","Linezolid ist bakteriostatisch und deshalb nicht Mittel der Wahl, obwohl es das Spektrum abdeckt.","Bei MSSA sind Flucloxacillin oder Cefazolin klar überlegen; Vancomycin ist unterlegen."]},{"id":"abszess","name":"Abszess","kurz":"Abszess","barriere":"Saurer pH, anaerobes Milieu, sehr hohes Inokulum mit Betalaktamase-Last, Bakterien in Stationärphase — vier Versagensgründe gleichzeitig.","regeln":["Aminoglykoside sind im sauren, anaeroben Milieu inaktiv — untauglich, nicht nur schlecht.","Metronidazol wirkt hier besonders gut.","Ab relevanter Größe ist der Abszess ein Drainageproblem."]},{"id":"weichteil","name":"Weichteil","kurz":"Weichteil","barriere":"Für die meisten Substanzen unproblematisch — solange perfundiert.","regeln":["Bei Schock mit hoher Vasopressordosis bricht die Mikrozirkulation ein, Gewebespiegel fallen deutlich unter die Plasmaspiegel.","Bei nekrotisierender Infektion entscheidet die chirurgische Sanierung, nicht die Substanzwahl."]},{"id":"eschar","name":"Eschar und avitale Nekrose","kurz":"Eschar","barriere":"Keine Perfusion, kein Antibiotikum. Systemische Substanzen erreichen verbranntes oder nekrotisches Gewebe praktisch nicht.","regeln":["Escharektomie steht vor jeder Substanzempfehlung.","Frühphase: verändertes Verteilungsvolumen; später augmentierte renale Clearance mit systematischer Unterdosierung.","TDM ist beim Verbrennungspatienten Standard, nicht Kür — Dosis nach oben korrigieren."]},{"id":"biofilm","name":"Biofilm und Fremdmaterial","kurz":"Biofilm","barriere":"Extrazelluläre Polymermatrix, Persisterzellen mit stark reduziertem Stoffwechsel. MHK-Werte aus dem Antibiogramm sind an planktonischen Bakterien bestimmt und hier bedeutungslos.","regeln":["Vancomycin und Betalaktame sind praktisch unwirksam.","Vergleichsweise aktiv: Rifampicin (nie Monotherapie), Fosfomycin, Daptomycin, eingeschränkt Linezolid und Echinocandine.","Ohne Entfernung oder Wechsel des Materials ist die Therapie Suppression, keine Heilung — gilt für ZVK, EVD, Schrittmacher, Gefäß- und Gelenkprothese."]},{"id":"auge","name":"Auge und Glaskörper","kurz":"Auge","barriere":"Blut-Retina-Schranke, dichter als die Blut-Hirn-Schranke.","regeln":["Systemisch erreichen nur wenige Substanzen im Glaskörper verlässlich therapeutische Spiegel (Fluconazol, Voriconazol, Moxifloxacin, Linezolid) — bei Endophthalmitis ist die intravitreale Gabe der Weg.","Bei Candidämie gehört die Funduskopie zum Standard; Caspofungin erreicht das Auge nicht."]}],"SUBS":[{"id":"ampsulb","name":"Ampicillin/Sulbactam","klasse":"Aminopenicillin + BLI","deckt":["Streptokokken","Enterococcus faecalis","MSSA","Haemophilus influenzae","Moraxella catarrhalis","Anaerobier inkl. B. fragilis","Teile der Enterobacterales","Acinetobacter (über Sulbactam)"],"decktNicht":["MRSA","E. faecium","Pseudomonas aeruginosa","ESBL-Bildner","AmpC-Bildner (Enterobacter, Citrobacter, Serratia)","atypische Erreger"],"pkpd":"Zeitabhängig, Ziel 50–70 % fT>MHK. Prolongierte Infusion sinnvoll.","dosis":[["Standard","3 g (2 g/1 g) alle 6–8 h"],["Obergrenze","4 × 3 g/d"],["Acinetobacter","Sulbactam-Hochdosis, off label — ungeprüft, gegen S3 067/011 abgleichen"],["GFR 30–50","alle 8–12 h"],["GFR < 30","alle 12–24 h"],["CRRT","3 g alle 8–12 h (ungeprüft)"]],"tdm":"Nicht etabliert.","pen":{"liquor_ne":"schlecht","liquor_e":"maessig","lunge":"maessig","pleura":"maessig","peritoneum":"gut","galle":"gut","pankreas":"schlecht","nierenparenchym":"gut","urin":"gut","prostata":"schlecht","knochen":"maessig","gelenk":"gut","vegetation":"gut","abszess":"maessig","weichteil":"gut","eschar":"schlecht","biofilm":"schlecht","auge":"schlecht"},"fallstricke":["Die deutsche E.-coli-Resistenzlage macht die kalkulierte Monotherapie bei Sepsis unsicher — für die schwere Peritonitis auf der ITS nicht geeignet.","Sulbactam senkt bei Enterobacterales nicht die AmpC-vermittelte Resistenz.","Anaerobier sind abgedeckt: zusätzliches Metronidazol ist überflüssig.","Hohe Natriumlast bei Maximaldosis."],"evidenz":"solide","appl":"i.v.","kat":"Penicilline","alias":"amp sulb unacid"},{"id":"piptazo","name":"Piperacillin/Tazobactam","klasse":"Acylaminopenicillin + BLI","deckt":["Streptokokken","MSSA","E. faecalis","Enterobacterales","Pseudomonas aeruginosa","Anaerobier inkl. B. fragilis"],"decktNicht":["MRSA","E. faecium / VRE","atypische Erreger","Carbapenemase-Bildner","bei ESBL unzuverlässig","bei AmpC riskant"],"pkpd":"Zeitabhängig. Prolongierte Infusion über 4 h oder kontinuierlich nach Bolus.","dosis":[["Standard","4,5 g alle 8 h"],["Schwer / Pseudomonas","4,5 g alle 6 h oder 4,5 g über 4 h alle 8 h"],["Kontinuierlich","Bolus 4,5 g, dann etwa 14–18 g/24 h (BLING III: 14 g/24 h)"],["GFR 20–40","4,5 g alle 8 h"],["GFR < 20","4,5 g alle 12 h"],["CRRT","4,5 g alle 6–8 h — Clearance unter CVVHDF hoch, Unterdosierung ist hier der häufigere Fehler"]],"tdm":"Sinnvoll bei augmentierter renaler Clearance, CRRT, ECMO und MHK nahe Breakpoint. Zielwerte hausseitig mit dem Labor abstimmen.","pen":{"liquor_ne":"schlecht","liquor_e":"schlecht","lunge":"maessig","pleura":"maessig","peritoneum":"gut","galle":"gut","pankreas":"maessig","nierenparenchym":"gut","urin":"gut","prostata":"maessig","knochen":"maessig","gelenk":"gut","vegetation":"gut","abszess":"maessig","weichteil":"gut","eschar":"schlecht","biofilm":"schlecht","auge":"schlecht"},"fallstricke":["MERINO zeigte bei Bakteriämie durch Ceftriaxon-resistente E. coli und Klebsiella eine höhere Mortalität als unter Meropenem — bei nachgewiesenem ESBL Carbapenem, auch wenn Pip/Tazo sensibel getestet wird.","Kombination mit Vancomycin erhöht das AKI-Risiko messbar.","Bei MSSA-Bakteriämie nicht zu empfehlen (siehe Erreger S. aureus).","Verlängert die Blutungszeit über Thrombozytenfunktionsstörung bei Hochdosis und Niereninsuffizienz."],"evidenz":"belastbar","appl":"i.v.","kat":"Penicilline","alias":"pip tazo piperacillin tazobac"},{"id":"meropenem","name":"Meropenem","klasse":"Carbapenem","deckt":["Enterobacterales inkl. ESBL und AmpC","Pseudomonas aeruginosa","Anaerobier","Streptokokken","MSSA","E. faecalis (mäßig)","Listeria monocytogenes"],"decktNicht":["MRSA","E. faecium / VRE","Stenotrophomonas maltophilia (intrinsisch resistent)","atypische Erreger","Carbapenemase-Bildner"],"pkpd":"Zeitabhängig, Ziel 40–100 % fT>MHK je nach Schwere. Prolongierte Infusion über 3 h etabliert; begrenzte Stabilität limitiert die kontinuierliche Gabe (Spritzenwechsel alle 6–8 h).","dosis":[["Standard","1 g alle 8 h"],["Schwer / Pseudomonas / hohe MHK","2 g alle 8 h, Infusion über 3 h"],["ZNS (Meningitis, Ventrikulitis)","2 g alle 8 h"],["Kontinuierlich","Bolus 1–2 g, dann 3 g/24 h (BLING III); bei ZNS höher"],["GFR 26–50","1 g alle 12 h"],["GFR 10–25","0,5 g alle 12 h"],["CRRT","1 g alle 8 h, bei ZNS oder Pseudomonas bis 2 g alle 8 h"]],"tdm":"Bei ZNS-Infektion, CRRT, augmentierter Clearance und hoher MHK. Für die Ventrikulitis unter kontinuierlicher Gabe ist ein Serumziel um 20–25 mg/l beschrieben; im Liquor gelten 2 mg/l als ausreichend für sensible Enterobacterales.","pen":{"liquor_ne":"schlecht","liquor_e":"maessig","lunge":"gut","pleura":"maessig","peritoneum":"gut","galle":"gut","pankreas":"gut","nierenparenchym":"gut","urin":"gut","prostata":"maessig","knochen":"maessig","gelenk":"gut","vegetation":"gut","abszess":"maessig","weichteil":"gut","eschar":"schlecht","biofilm":"schlecht","auge":"maessig"},"fallstricke":["Senkt den Valproat-Spiegel drastisch und schnell — bei Epilepsiepatienten ein folgenreicher Interaktionsfehler.","Krampfschwelle niedriger als bei anderen Betalaktamen, aber deutlich günstiger als Imipenem.","Bei 4MRGN oder Carbapenemase reicht Meropenem nicht: Ceftazidim/Avibactam, Ceftolozan/Tazobactam oder Cefiderocol nach Resistenzmechanismus — Reserveantibiotika, Rücksprache Mikrobiologie und ABS."],"evidenz":"belastbar","appl":"i.v.","kat":"Carbapeneme","alias":"mero meronem carbapenem"},{"id":"cefepim","name":"Cefepim","klasse":"Cephalosporin Gruppe 4","deckt":["Enterobacterales inkl. AmpC-Bildner","Pseudomonas aeruginosa","Streptokokken","MSSA"],"decktNicht":["Anaerobier (klinisch wichtigste Lücke)","MRSA","Enterokokken generell","ESBL zuverlässig","atypische Erreger"],"pkpd":"Zeitabhängig. Prolongierte Infusion möglich.","dosis":[["Standard","2 g alle 12 h"],["Schwer / Pseudomonas / febrile Neutropenie","2 g alle 8 h"],["GFR 30–50","2 g alle 12–24 h"],["GFR 11–29","2 g alle 24 h"],["GFR < 11","1 g alle 24 h"],["CRRT","2 g alle 12 h"]],"tdm":"Hier besonders wertvoll, weil therapeutisches Fenster und Neurotoxizitätsschwelle nah beieinanderliegen. Bei einem Talspiegel um 8 mg/l wurde die Wahrscheinlichkeit einer Neurotoxizität mit höchstens 5 % berechnet; Neurotoxizität wurde ab Talspiegeln um 35–36 mg/l beobachtet.","pen":{"liquor_ne":"schlecht","liquor_e":"maessig","lunge":"gut","pleura":"maessig","peritoneum":"gut","galle":"maessig","pankreas":"maessig","nierenparenchym":"gut","urin":"gut","prostata":"schlecht","knochen":"maessig","gelenk":"gut","vegetation":"maessig","abszess":"maessig","weichteil":"gut","eschar":"schlecht","biofilm":"schlecht","auge":"maessig"},"fallstricke":["Cefepim-Neurotoxizität wird regelmäßig als septische Enzephalopathie oder Delir fehlgedeutet: Bewusstseinstrübung, Myoklonien, im EEG generalisierte periodische Entladungen bis zum nonkonvulsiven Status. Risiko bei eingeschränkter Nierenfunktion ohne Dosisanpassung; dazu erging ein Rote-Hand-Brief.","Bei unklarer Vigilanzminderung unter Cefepim gehört ein EEG zur Differenzialdiagnostik — nicht mehr Sedierung.","Bei abdominellem Fokus zwingend mit Metronidazol kombinieren."],"evidenz":"solide","appl":"i.v.","kat":"Cephalosporine","alias":"maxipime"},{"id":"cefuroxim","name":"Cefuroxim","klasse":"Cephalosporin Gruppe 2","deckt":["MSSA","Streptokokken","Haemophilus influenzae","E. coli und Klebsiella ohne Resistenzmechanismus","Proteus mirabilis"],"decktNicht":["Pseudomonas","Enterokokken","ESBL","AmpC-Bildner","Kolonanaerobier zuverlässig","MRSA","atypische Erreger"],"pkpd":"Zeitabhängig.","dosis":[["Standard","1,5 g alle 8 h"],["Perioperative Prophylaxe","1,5 g innerhalb von 60 min vor Schnitt, Wiederholung nach 3–4 h oder bei Blutverlust über 1,5 l"],["GFR 10–20","750 mg alle 8–12 h"],["GFR < 10","750 mg alle 24 h"],["CRRT","750 mg–1,5 g alle 12 h (ungeprüft)"]],"tdm":"Nicht etabliert.","pen":{"liquor_ne":"schlecht","liquor_e":"schlecht","lunge":"maessig","pleura":"maessig","peritoneum":"maessig","galle":"maessig","pankreas":"schlecht","nierenparenchym":"gut","urin":"gut","prostata":"schlecht","knochen":"maessig","gelenk":"maessig","vegetation":"maessig","abszess":"schlecht","weichteil":"gut","eschar":"schlecht","biofilm":"schlecht","auge":"schlecht"},"fallstricke":["Auf der ITS als kalkulierte Therapie einer Sepsis praktisch nie ausreichend — die Substanz ist aus dem OP-Alltag vertraut und rutscht dadurch leicht in ungeeignete Indikationen.","Nicht zur Meningitistherapie verwenden: historisch schlechtere Ergebnisse als Cephalosporine der Gruppe 3.","Bei AmpC-Bildnern Therapieversagen durch Derepression unter Therapie."],"evidenz":"solide","appl":"i.v.","kat":"Cephalosporine","alias":"zinacef"},{"id":"metronidazol","name":"Metronidazol","klasse":"Nitroimidazol","deckt":["obligate Anaerobier inkl. B. fragilis","Clostridioides difficile","Protozoen"],"decktNicht":["alles Aerobe — immer Partnersubstanz"],"pkpd":"Konzentrationsabhängig, exzellente Bioverfügbarkeit, hohe Gewebespiegel.","dosis":[["Standard","500 mg alle 8 h"],["Obergrenze","4 g/d"],["Niere","keine Anpassung nötig"],["Leber (Child-Pugh C)","Dosis reduzieren"],["CRRT","keine Anpassung"]],"tdm":"Nicht etabliert.","pen":{"liquor_ne":"gut","liquor_e":"gut","lunge":"gut","pleura":"gut","peritoneum":"gut","galle":"gut","pankreas":"gut","nierenparenchym":"gut","urin":"gut","prostata":"gut","knochen":"gut","gelenk":"gut","vegetation":"maessig","abszess":"gut","weichteil":"gut","eschar":"schlecht","biofilm":"schlecht","auge":"maessig"},"fallstricke":["Zusätzlich zu Pip/Tazo, Ampicillin/Sulbactam oder Meropenem überflüssig — diese decken Anaerobier bereits ab.","Periphere Neuropathie bei langer Therapie wird auf der ITS regelhaft übersehen und dem Critical-Illness-Syndrom zugeschrieben.","Metaboliten kumulieren bei Niereninsuffizienz.","Bei CDI nicht mehr Mittel der ersten Wahl."],"evidenz":"solide","appl":"i.v. / p.o.","kat":"Weitere antibakterielle","alias":"clont flagyl metro"},{"id":"azithromycin","name":"Azithromycin","klasse":"Makrolid","deckt":["Legionella","Mycoplasma","Chlamydophila","Bordetella","teils Haemophilus influenzae","Streptokokken (mit Resistenzlücken)"],"decktNicht":["als Monotherapie nichts, was auf der ITS trägt — reine Ergänzungssubstanz"],"pkpd":"Sehr hohe intrazelluläre und ELF-Spiegel, lange Halbwertszeit.","dosis":[["Standard","500 mg alle 24 h i.v."],["Niere","keine Anpassung"],["CRRT","keine Anpassung"],["Leber","Vorsicht bei schwerer Insuffizienz"]],"tdm":"Nicht etabliert.","pen":{"liquor_ne":"schlecht","liquor_e":"schlecht","lunge":"gut","pleura":"maessig","peritoneum":"maessig","galle":"gut","pankreas":"schlecht","nierenparenchym":"schlecht","urin":"schlecht","prostata":"gut","knochen":"maessig","gelenk":"maessig","vegetation":"schlecht","abszess":"maessig","weichteil":"gut","eschar":"schlecht","biofilm":"schlecht","auge":"schlecht"},"fallstricke":["QT-Verlängerung, auf der ITS oft neben weiteren QT-verlängernden Substanzen.","Gegenüber Clarithromycin deutlich geringeres Interaktionspotenzial — bei Polypharmazie der ausschlaggebende Vorteil."],"evidenz":"solide","appl":"i.v. / p.o.","kat":"Makrolide und Tetracycline","alias":"zithromax azithro makrolid"},{"id":"clarithromycin","name":"Clarithromycin","klasse":"Makrolid","deckt":["Legionella","Mycoplasma","Chlamydophila","einige grampositive Erreger","Helicobacter pylori"],"decktNicht":["als Monotherapie nichts ITS-Tragendes","Enterobacterales","Pseudomonas"],"pkpd":"Hohe Gewebe- und intrazelluläre Spiegel.","dosis":[["Standard","500 mg alle 12 h i.v."],["GFR < 30","Dosis halbieren"]],"tdm":"Nicht etabliert.","pen":{"liquor_ne":"schlecht","liquor_e":"schlecht","lunge":"gut","pleura":"maessig","peritoneum":"maessig","galle":"gut","pankreas":"schlecht","nierenparenchym":"maessig","urin":"maessig","prostata":"gut","knochen":"maessig","gelenk":"maessig","vegetation":"schlecht","abszess":"maessig","weichteil":"gut","eschar":"schlecht","biofilm":"schlecht","auge":"schlecht"},"fallstricke":["Starker CYP3A4-Hemmer: trifft auf der ITS Midazolam (verlängerte Sedierung), Statine (Rhabdomyolyse), Tacrolimus und Ciclosporin (Spiegelanstieg), Amiodaron und viele Antikoagulanzien.","Bei Transplantierten praktisch kontraindiziert — Azithromycin ist die Alternative.","QT-Verlängerung zusätzlich."],"evidenz":"belastbar","appl":"i.v. / p.o.","kat":"Makrolide und Tetracycline","alias":"klacid makrolid"},{"id":"fosfomycin","name":"Fosfomycin i.v.","klasse":"Epoxid-Antibiotikum","deckt":["ungewöhnlich breit über grampositiv und gramnegativ","MRSA","VRE","ESBL-E. coli","Teile der multiresistenten Gramnegativen"],"decktNicht":["als Monotherapie nicht einsetzbar außer bei Harnwegsinfektion — rasche Resistenzentwicklung"],"pkpd":"Sehr kleines Molekül mit bemerkenswerter Gewebe- und ZNS-Gängigkeit.","dosis":[["Minimaldosis i.v.","12 g/d, verteilt auf 2–3 Einzelgaben (EMA-Harmonisierung 2020)"],["Meningitis / ZNS","16–24 g/d; bei Ventrikulitis werden 3 × 8 g/d diskutiert (ungeprüft)"],["Niere","Anpassung erforderlich — Staffelung gegen Fachinformation ergänzen (ungeprüft)"],["CRRT","ungeprüft"]],"tdm":"Nicht etabliert, bei ZNS-Infektion wünschenswert.","pen":{"liquor_ne":"maessig","liquor_e":"gut","lunge":"gut","pleura":"maessig","peritoneum":"gut","galle":"maessig","pankreas":"maessig","nierenparenchym":"gut","urin":"gut","prostata":"gut","knochen":"gut","gelenk":"gut","vegetation":"maessig","abszess":"gut","weichteil":"gut","eschar":"schlecht","biofilm":"maessig","auge":"maessig"},"fallstricke":["Niemals Monotherapie außer bei Harnwegsinfektion.","Natriumlast: 2 g Fosfomycin enthalten 0,64 g Natrium, also rund 14 mmol Natrium pro Gramm Wirkstoff. Bei 16 g/d sind das über 200 mmol allein aus dem Antibiotikum — bei Hirnödem, Herzinsuffizienz und Leberzirrhose therapieentscheidend.","Hypokaliämie regelhaft: Kalium täglich kontrollieren.","Venenreizung, selten Neutropenie bis Agranulozytose.","Neu in der S3 020-013 als gramnegativer Kombinationspartner bei HAP/VAP neben Chinolon und Tobramycin."],"evidenz":"solide","appl":"i.v.","kat":"Weitere antibakterielle","alias":"infectofos"},{"id":"vancomycin","name":"Vancomycin","klasse":"Glykopeptid","deckt":["MRSA","MSSA (schwächer als Flucloxacillin oder Cefazolin)","koagulasenegative Staphylokokken","E. faecalis","Stre ndes Antibiotikum wenn möglich absetzen oder wechseln","Bei fulminantem Verlauf mit Ileus oder toxischem Megakolon chirurgische Vorstellung"],"diagnostik":["Stufendiagnostik auf Toxin und Erreger"],"deeskalation":"—","dauer":"Dosierungen und Rezidivschemata aus der DGVS-Leitlinie übernehmen (in dieser App bewusst nicht aus dem Gedächtnis eingetragen).","komp":[],"ueberholt":true,"pitfalls":["Lehrbuch überholt: Metronidazol spielt nicht mehr die Hauptrolle. Rezidive treten nach Metronidazol oder Vancomycin in 20–30 % auf; Fidaxomicin wirkt gezielter und schont die Mikrobiotadiversität.","Keine Peristaltikhemmer.","Bei mehrfachem Rezidiv fäkalen Mikrobiotatransfer erwägen.","Prävention ist der eigentliche Hebel: jede verkürzte Antibiotikatherapie senkt das Risiko."],"quelle":"DGVS S2k Gastrointestinale Infektionen"},{"id":"intraabdominelle_candidose","name":"Intraabdominelle Candidose","block":"Abdominell","def":"Candida-Infektion des Abdomens — nicht jeder Nachweis ist behandlungsbedürftig.","erreger":[{"id":"calbicans","h":"haeufig"},{"id":"cglabrata","h":"haeufig"},{"id":"cparapsilosis","h":"moeglich"}],"therapie":[{"label":"Erste Wahl","subs":["caspofungin"],"text":"70 mg Tag 1, dann 50 mg täglich. Echinocandine vor Fluconazol beim kritisch Kranken."},{"label":"Deeskalation","subs":["fluconazol"],"text":"Bei empfindlicher Spezies und Stabilisierung."}],"kombi":"—","sanierung":["Bei Candidämie zusätzlich Katheterentfernung und Funduskopie"],"diagnostik":["Nachweis aus primär sterilem Material","Blutkulturen"],"deeskalation":"Ohne Erregernachweis und ohne klinischen Anhalt nach etwa 5 Tagen beenden. Häufigste Fehlentscheidung ist die stille Fortführung über Wochen.","dauer":"Nach Verlauf.","komp":["peritoneum"],"pitfalls":["Ein positiver Abstrich aus Drainage oder Trachealsekret ist kein Behandlungsgrund.","Behandelt wird bei Nachweis aus sterilem Material, rezidivierender Perforation im oberen GI-Trakt, Anastomoseninsuffizienz mit Vortherapie, tertiärer Peritonitis und infizierter Pankreasnekrose unter breiter Vortherapie.","Caspofungin erreicht Urin und Auge nicht."],"quelle":"AWMF 082-005 / ESCMID (Indikationsschwelle ungeprüft)","wahl":"Caspofungin initial; Fluconazol nach Speziesbestimmung bei C. albicans und klinischer Stabilität."},{"id":"crbsi","name":"Katheterassoziierte Blutstrominfektion","block":"Blutstrom und Sepsis","def":"Blutstrominfektion ausgehend von einem intravasalen Katheter.","erreger":[{"id":"kns","h":"haeufig"},{"id":"mssa","h":"haeufig"},{"id":"mrsa","h":"moeglich"},{"id":"efaecalis","h":"haeufig"},{"id":"efaecium","h":"moeglich"},{"id":"ecoli","h":"moeglich"},{"id":"pseudomonas","h":"moeglich"},{"id":"cparapsilosis","h":"moeglich"},{"id":"calbicans","h":"moeglich"},{"id":"sepidermidis","h":"haeufig"},{"id":"corynebacterium","h":"selten"},{"id":"cauris","h":"selten"}],"therapie":[{"label":"Grampositiv, MRSA-Risiko","subs":["vancomycin"],"text":"AUC-gesteuert."},{"label":"Schwer krank mit gramnegativer Möglichkeit","subs":["piptazo"],"text":"Oder Meropenem je nach MRE-Risiko."}],"kombi":"Nach Risikoprofil.","sanierung":["Katheterentfernung obligat bei S. aureus, Candida, P. aeruginosa, Sepsis oder septischem Schock, Tunnelinfektion und persistierender Bakteriämie unter wirksamer Therapie","Bei koagulasenegativen Staphylokokken ohne Fremdmaterial und stabilem Patienten kann ein Erhaltungsversuch erwogen werden"],"diagnostik":["Blutkulturen zeitgleich peripher und aus dem Katheter","Katheterspitze zur Kultur"],"deeskalation":"Nach Antibiogramm.","dauer":"Bei unkomplizierter CRBSI nach Katheterentfernung 7 Tage (BALANCE), sofern kein Ausschlusskriterium; bei koagulasenegativen Staphylokokken oft kürzer (ungeprüft).","komp":["biofilm","vegetation"],"pitfalls":["Ein einzelner Nachweis koagulasenegativer Staphylokokken ist häufig Kontamination — zwei getrennt abgenommene Paare entscheiden. Bei S. aureus gilt das nicht.","Bei Verdacht auf E. faecium ist Linezolid bakteriostatisch und bei Bakteriämie nicht ideal; Daptomycin 10–12 mg/kg ist die Alternative."],"quelle":"BALANCE (NEJM 2025)","dauerRegel":{"t":"Nach Erreger: S. aureus wie SAB, Candida 14 Tage ab negativer Blutkultur, KNS nach Katheterentfernung 5–7 Tage, gramnegativ 7 Tage (BALANCE)."}},{"id":"sepsis_unklar","name":"Sepsis bei unbekanntem Fokus","block":"Blutstrom und Sepsis","def":"Sepsis ohne identifizierten Infektionsherd — der Fokus, in dem der Reflex zur maximalen Breite am stärksten ist.","erreger":[{"id":"ecoli","h":"haeufig"},{"id":"klebsiella","h":"haeufig"},{"id":"mssa","h":"haeufig"},{"id":"pneumokokken","h":"moeglich"},{"id":"esbl","h":"moeglich"},{"id":"ampc","h":"moeglich"},{"id":"mrsa","h":"moeglich"},{"id":"listeria","h":"selten"},{"id":"calbicans","h":"selten"},{"id":"carbapenemase","h":"selten"},{"id":"nmeningitidis","h":"selten"},{"id":"capnocytophaga","h":"selten"}],"therapie":[{"label":"Ohne MRE-Risiko","subs":["piptazo"],"text":"4,5 g alle 6–8 h."},{"label":"MRE-Risiko oder septischer Schock","subs":["meropenem"],"text":"1–2 g alle 8 h."},{"label":"MRSA-Risiko","subs":["linezolid","vancomycin"],"text":"Bei bekannter Kolonisation, Katheter, Fremdmaterial oder Vortherapie ergänzen."},{"label":"Candida-Risiko","subs":["caspofungin"],"text":"Nur bei klarer Risikokonstellation."}],"kombi":"Nur im septischen Schock mit MRE-Risiko — die doppelte gramnegative Abdeckung außerhalb dieser Situation ist Übertherapie.","sanierung":["Systematische Fokussuche: Lunge, Abdomen, Harnwege, Haut und Weichteile, Katheter, ZNS, Endokard","Bildgebung früh, nicht erst nach Therapieversagen"],"diagnostik":["Zwei Blutkulturpaare vor der ersten Dosis, ohne die Gabe zu verzögern","Urin-, respiratorisches und Wundmaterial je nach Verdacht"],"deeskalation":"Der eigentliche Hebel ist die Reevaluation nach 48–72 h: Fokus gefunden? Erreger nachgewiesen? Dann fokussieren. Bei negativem Befund und Stabilisierung deeskalieren statt still fortführen.","dauer":"7 Tage nach BALANCE, sofern Fokus kontrolliert und Patient stabil; bei nachgewiesenem Fokus richtet sich die Dauer nach diesem.","komp":[],"pitfalls":["Bakteriämie ist keine eigenständige Entität, sondern Ausdruck eines Syndroms — die Dauer richtet sich nach dem Fokus, nicht nach der positiven Blutkultur."],"quelle":"BALANCE"},{"id":"candidaemie","name":"Candidämie","block":"Blutstrom und Sepsis","def":"Candida-Nachweis in der Blutkultur. Von der Sieben-Tage-Regel ausdrücklich ausgenommen.","erreger":[{"id":"calbicans","h":"haeufig"},{"id":"cglabrata","h":"haeufig"},{"id":"cparapsilosis","h":"moeglich"},{"id":"ctropicalis","h":"moeglich"},{"id":"ckrusei","h":"selten"},{"id":"cauris","h":"selten"}],"therapie":[{"label":"Erste Wahl","subs":["caspofungin"],"text":"70 mg Tag 1, dann 50 mg täglich (70 mg über 80 kg). Echinocandine sind beim kritisch Kranken Mittel der Wahl."},{"label":"Bei okulärer Beteiligung oder ZNS","subs":["fluconazol","ambisome"],"text":"Echinocandine erreichen Auge und Liquor nicht — Wechsel auf Fluconazol oder liposomales Amphotericin B."},{"label":"Deeskalation","subs":["fluconazol"],"text":"Bei empfindlicher Spezies und stabilem Patienten auf Fluconazol 400 mg/d umstellen."}],"kombi":"—","sanierung":["Katheterentfernung","Funduskopie zum Ausschluss okulärer Beteiligung","Folgeblutkulturen bis zur Negativierung"],"diagnostik":["Blutkulturen, Speziesdifferenzierung","Funduskopie","Echokardiografie bei persistierender Fungämie"],"deeskalation":"Nach Spezies und Empfindlichkeit.","dauer":"14 Tage ab der ersten negativen Blutkultur bei unkomplizierter Candidämie ohne Organbeteiligung (ungeprüft).","komp":["auge","biofilm"],"pitfalls":["Bei C. parapsilosis sind die Echinocandin-MHK höher — hier gerät Caspofungin ins Wanken.","Bei okulärer Beteiligung erreicht Caspofungin das Auge nicht: Wechsel auf Azol oder liposomales Amphotericin B.","Bei Candidurie wäre Fluconazol die richtige Substanz."],"quelle":"AWMF 082-005 / ESCMID (Dauer ungeprüft)","dauerRegel":{"t":"14 Tage ab der ersten negativen Blutkultur und Rückbildung der Symptome."}},{"id":"sab","name":"Staphylococcus-aureus-Bakteriämie","block":"Blutstrom und Sepsis","def":"Eigenständige klinische Entität mit eigenem Regelwerk. Anders als bei koagulasenegativen Staphylokokken gilt bereits der einmalige Nachweis in der Blutkultur als behandlungsbedürftige Infektion.","erreger":[{"id":"mssa","h":"haeufig"},{"id":"mrsa","h":"moeglich"}],"therapie":[{"label":"MSSA — erste Wahl","subs":["flucloxacillin"],"text":"4 × 2 g/d i.v., bei Endokarditis 12 g/d. Wirksamste Substanz bei MSSA."},{"label":"MSSA — Alternative bei Penicillinunverträglichkeit","subs":["cefazolin"],"text":"3 × 2 g/d i.v. Kreuzreaktivität zwischen Penicillinen und Cephalosporinen etwa 2,5 %."},{"label":"MRSA","subs":["vancomycin","daptomycin"],"text":"Vancomycin AUC-gesteuert oder Daptomycin 8–10 mg/kg/d. Daptomycin nicht bei pulmonalem Fokus."},{"label":"Bei verbleibendem Fremdmaterial","subs":["rifampicin"],"text":"In Kombination erwägen, nie als Monotherapie, erst nach Débridement."}],"kombi":"Kombinationstherapie wird bei SAB generell nicht empfohlen. Bei verbleibendem Fremdmaterial Rifampicin in Kombination erwägen — nie als Monotherapie, erst nach Débridement und negativer Blutkultur.","sanierung":["Intensive Fokussuche und rasche Sanierung","Katheterentfernung obligat"],"diagnostik":["Folgeblutkulturen zur Bestimmung der Bakteriämiedauer","Transösophageale Echokardiografie — in den allermeisten Fällen indiziert","PET-CT zur Fokussuche erwägen (klinisch stumme septische Absiedlungen)","Infektiologisches Konsil — belegt mit besserem Outcome"],"deeskalation":"Fokussierung nach Empfindlichkeit; keine Verbreiterung.","dauer":"Unkompliziert (vollständige Fokussanierung, keine Endokarditis, keine Knochen- oder Gelenkbeteiligung, Bakteriämiedauer bis 5 Tage): 14 Tage i.v. Kompliziert: 4–6 Wochen i.v. Tag 1 der Therapiedauer ist die erste negative Blutkultur, nicht der Therapiebeginn.","komp":["vegetation","knochen","biofilm"],"pitfalls":["Andere Cephalosporine oder Kombinationen aus Betalaktam und Betalaktamaseinhibitor sind nach aktueller Studienlage nicht zu empfehlen: Pip/Tazo und Cefepim sind bei MSSA-Bakteriämie ungeeignet trotz sensiblem Antibiogramm.","Vancomycin ist bei MSSA der Standardtherapie unterlegen.","Häufiger Zählfehler mit klinischer Folge: Dauer ab erster negativer Blutkultur.","Die Substanzwahl ist outcomerelevant (Mortalität 20–40 %): breite Substanzen wie Pip/Tazo, Cefepim oder Carbapeneme sind bei MSSA-Bakteriämie unterlegen."],"quelle":"Bad Honnef-Symposium, DGI-Empfehlungen","dauerRegel":{"t":"14 Tage (unkompliziert) bzw. 4–6 Wochen (kompliziert) — gezählt ab der ersten negativen Blutkultur, nicht ab Therapiebeginn."}},{"id":"enterokokken_bakteriaemie","name":"Enterokokken-Bakteriämie","block":"Blutstrom und Sepsis","def":"Enterokokkennachweis in der Blutkultur — nicht immer behandlungsbedürftig.","erreger":[{"id":"efaecalis","h":"haeufig"},{"id":"efaecium","h":"haeufig"},{"id":"vre","h":"moeglich"}],"therapie":[{"label":"E. faecalis","subs":["ampicillin"],"text":"Ampicillin ist Mittel der Wahl; Ampicillin/Sulbactam und Pip/Tazo decken ebenfalls ab."},{"label":"E. faecium oder VRE","subs":["daptomycin","linezolid"],"text":"Daptomycin 8–10 mg/kg/d ist bakterizid und bei Bakteriämie dem bakteriostatischen Linezolid vorzuziehen."},{"label":"Bei Endokarditis (E. faecalis)","subs":["ampicillin","ceftriaxon"],"text":"Synergistische Standardkombination."}],"kombi":"Bei Endokarditis synergistische Kombination erforderlich.","sanierung":["Katheter- und Fokussuche"],"diagnostik":["Echokardiografie großzügig indizieren — Enterokokken sind eine relevante Endokarditisursache"],"deeskalation":"Nach Antibiogramm.","dauer":"Bei unkomplizierter Bakteriämie mit kontrolliertem Fokus 7 Tage (BALANCE schloss grampositive Erreger ein, nur S. aureus war ausgenommen); bei Endokarditis Wochen.","komp":["vegetation"],"pitfalls":["Enterokokken in der Blutkultur sind bei ITS-Patienten nicht selten Ausdruck einer Translokation oder eines Katheterproblems — Klinik, Fokus und wiederholter Nachweis entscheiden.","Bei E.-faecalis-Endokarditis ist Ampicillin plus Ceftriaxon die Standardkombination."],"quelle":"BALANCE","wahl":"Art entscheidet: E. faecalis → Ampicillin (bei Endokarditis plus Ceftriaxon); E. faecium oder VRE → Daptomycin hochdosiert oder Linezolid."},{"id":"gefaessprothese","name":"Gefäßprotheseninfektion","block":"Blutstrom und Sepsis","def":"Infektion eines Gefäßimplantats. Von der Sieben-Tage-Regel ausgenommen — endovaskuläre Grafts waren BALANCE-Ausschlusskriterium.","erreger":[{"id":"mssa","h":"haeufig"},{"id":"mrsa","h":"moeglich"},{"id":"kns","h":"haeufig"},{"id":"ecoli","h":"moeglich"},{"id":"pseudomonas","h":"moeglich"},{"id":"efaecalis","h":"moeglich"},{"id":"calbicans","h":"selten"}],"therapie":[{"label":"Kalkuliert","subs":["meropenem","vancomycin"],"text":"Gramnegative Breite plus grampositive Flanke bis zum Antibiogramm."},{"label":"Staphylokokken mit verbleibendem Material","subs":["rifampicin"],"text":"Als biofilmaktiver Partner ergänzen — nie allein."},{"label":"Bei MRSA oder Vancomycin-Versagen","subs":["daptomycin"],"text":"8–10 mg/kg/d, bakterizid und biofilmaktiver als Vancomycin."}],"kombi":"Zweifacher Grund: Lücke und Biofilm.","sanierung":["Gefäßchirurgische Entscheidung steht am Anfang: Explantation oder Débridement","Ohne Materialentfernung ist die Therapie in der Regel Suppression, keine Heilung"],"diagnostik":["Blutkulturen","CT-Angiografie, ggf. PET-CT","Intraoperatives Material"],"deeskalation":"Nach Antibiogramm, unter Beachtung der Biofilmproblematik.","dauer":"Wochen bis Monate, bei nicht explantiertem Graft ggf. Dauersuppression (Schema ungeprüft).","komp":["biofilm","vegetation"],"pitfalls":["MHK-Werte aus dem Antibiogramm sind an planktonischen Bakterien bestimmt und sagen wenig über die Wirkung am Graft.","Bei aortoenteraler Fistel Mischflora und Candida bedenken."],"quelle":"BALANCE (Ausschlusskriterium)","wahl":"Meropenem plus Vancomycin kalkuliert; Daptomycin bei MRSA mit Vancomycin-Versagen oder Niereninsuffizienz; Rifampicin bei Staphylokokken und belassenem Material."},{"id":"urosepsis","name":"Komplizierte Harnwegsinfektion und Urosepsis","block":"Urogenital","def":"Sepsis mit Organdysfunktion ausgehend vom Harntrakt. Ursache ist in der Regel eine obstruktive Abflussstörung, ein Abszess in Niere oder Prostata oder eine urologische Instrumentierung.","erreger":[{"id":"ecoli","h":"haeufig"},{"id":"klebsiella","h":"haeufig"},{"id":"proteus","h":"haeufig"},{"id":"efaecalis","h":"haeufig"},{"id":"esbl","h":"moeglich"},{"id":"pseudomonas","h":"moeglich"},{"id":"ampc","h":"moeglich"},{"id":"calbicans","h":"selten"},{"id":"ecloacae","h":"moeglich"},{"id":"cfreundii","h":"selten"},{"id":"providencia","h":"selten"}],"therapie":[{"label":"Erste Wahl","subs":["piptazo"],"text":"4,5 g alle 6–8 h. Breitspektrum-Betalaktame werden als Monotherapie gegeben."},{"label":"ESBL, Vortherapie oder septischer Schock","subs":["meropenem"],"text":"1–2 g alle 8 h."},{"label":"Cephalosporin nur kombiniert","subs":["ceftriaxon","gentamicin"],"text":"Cephalosporine sollten mit einem Aminoglykosid (bevorzugt) oder einem Fluorchinolon kombiniert werden."},{"label":"Bei Prostatabeteiligung","subs":["ciprofloxacin","cotrimoxazol"],"text":"Betalaktame erreichen die Prostata nicht — hier sind Chinolone oder Cotrimoxazol nötig."}],"kombi":"Cephalosporine sollten mit einem Aminoglykosid (bevorzugt) oder einem Fluorchinolon kombiniert werden. Cefepim allein ist hier die schwächere Wahl, weil zusätzlich die Enterokokken fehlen.","sanierung":["Interventionelle Fokuskontrolle innerhalb von 6 Stunden bei Harnwegsobstruktion oder Abszess"],"diagnostik":["Urin- und Blutkulturen vor Therapiebeginn — auch bei Dauerkatheter, Harnleiterschiene oder Nephrostomie","Bildgebung zur Fokussuche"],"deeskalation":"Nach Antibiogramm, so schmal wie möglich.","dauer":"Komplizierte HWI 7–14 Tage; bei Bakteriämie mit kontrolliertem Fokus 7 Tage (BALANCE).","komp":["nierenparenchym","urin","prostata"],"pitfalls":["Empirische Antibiotikatherapie innerhalb der ersten Stunde nach Diagnose.","Relevante Zielgröße ist das Nierenparenchym, nicht der Urin — Substanzen mit hoher Harn-, aber niedriger Gewebekonzentration sind hier falsch.","Bei Prostatabeteiligung sind Betalaktame die falsche Substanzklasse; Cotrimoxazol oder Chinolone nach Antibiogramm.","ESBL-Bildner als Erreger der Urosepsis nehmen zu, Carbapenemase-Bildner sind bislang selten."],"quelle":"PEG 082-006 Kap. 8, S3 043-044"},{"id":"katheter_hwi","name":"Katheterassoziierte Harnwegsinfektion","block":"Urogenital","def":"Infektion bei liegendem oder kürzlich entferntem Harnwegskatheter.","erreger":[{"id":"ecoli","h":"haeufig"},{"id":"proteus","h":"haeufig"},{"id":"klebsiella","h":"haeufig"},{"id":"efaecalis","h":"haeufig"},{"id":"pseudomonas","h":"moeglich"},{"id":"calbicans","h":"moeglich"},{"id":"providencia","h":"moeglich"},{"id":"morganella","h":"moeglich"},{"id":"pvulgaris","h":"selten"}],"therapie":[{"label":"Nur bei klinischer Infektion","subs":["piptazo"],"text":"Kalkuliert wie Urosepsis, danach nach Antibiogramm so schmal wie möglich."},{"label":"Nach Antibiogramm","subs":["ceftriaxon","ciprofloxacin"],"text":"Deeskalation auf die schmalste wirksame Substanz."}],"kombi":"Keine.","sanierung":["Katheterwechsel oder -entfernung gehört zur Therapie","Bei Anurie unter Nierenersatzverfahren trägt die Substanzwahl nicht — dann entscheidet die Katheterentfernung"],"diagnostik":["Urinkultur nach Katheterwechsel","Frage vor der Therapie: Gibt es einen anderen, besseren Fokus?"],"deeskalation":"Nach Antibiogramm.","dauer":"Nach Verlauf, so kurz wie möglich.","komp":["urin","nierenparenchym"],"pitfalls":["Asymptomatische Bakteriurie beim katheterisierten Patienten wird nicht behandelt. Bei jedem Dauerkatheterträger ist der Urin nach kurzer Zeit besiedelt.","Auf der ITS besonders relevant: Bei unklarem Fieber ist der Urinbefund oft der erste positive Befund und wird dann fälschlich zum Fokus erklärt."],"quelle":"S3 043-044"},{"id":"pyelonephritis_obstruktiv","name":"Obstruktive Pyelonephritis, Zustand nach Steinsanierung","block":"Urogenital","def":"Infektion bei Harnstau — die Intervention ist die Therapie.","erreger":[{"id":"ecoli","h":"haeufig"},{"id":"proteus","h":"haeufig"},{"id":"klebsiella","h":"haeufig"},{"id":"efaecalis","h":"moeglich"},{"id":"pseudomonas","h":"moeglich"}],"therapie":[{"label":"Kalkuliert","subs":["piptazo"],"text":"4,5 g alle 6–8 h; bei ESBL oder Schock Meropenem."},{"label":"Nach Entlastung und Antibiogramm","subs":["ceftriaxon","ciprofloxacin"],"text":"Deeskalation; Chinolone bei Prostatabeteiligung."}],"kombi":"Keine.","sanierung":["Entlastung durch Harnleiterschiene oder Nephrostomie innerhalb von 6 Stunden","Ohne vollständige Steinentfernung bleibt bei infizierten Steinen die Quelle bestehen"],"diagnostik":["Sonografie und CT","Urin- und Blutkulturen"],"deeskalation":"Nach Entlastung und Antibiogramm.","dauer":"7–14 Tage je nach Verlauf.","komp":["nierenparenchym","urin"],"pitfalls":["Antibiotika allein erreichen das gestaute System nicht ausreichend.","Struvitsteine enthalten Erreger im Steinmaterial; Proteus mirabilis ist typisch."],"quelle":"—"},{"id":"nekrot_fasziitis","name":"Nekrotisierende Weichteilinfektion und Fasciitis","block":"Haut und Weichteil","def":"Fulminante Infektion der Faszien und Weichteile. Chirurgie ist die Therapie.","erreger":[{"id":"gas","h":"haeufig"},{"id":"mssa","h":"moeglich"},{"id":"mrsa","h":"moeglich"},{"id":"perfringens","h":"moeglich"},{"id":"ecoli","h":"haeufig"},{"id":"bfragilis","h":"haeufig"},{"id":"efaecalis","h":"moeglich"},{"id":"sdysgalactiae","h":"moeglich"},{"id":"aeromonas","h":"selten"}],"therapie":[{"label":"Erste Wahl","subs":["piptazo","clindamycin","vancomycin"],"text":"Pip/Tazo 4,5 g alle 6 h plus Clindamycin 600–900 mg alle 8 h plus Vancomycin. Clindamycin ist der Proteinsynthesehemmer der Wahl zur Toxinsuppression."},{"label":"Nach Erreger .","sanierung":["Débridement","Druckentlastung","Revaskularisierung — ohne Perfusion erreicht kein Antibiotikum die Wunde"],"diagnostik":["Gewebeprobe oder tiefer Abstrich nach Débridement, nicht der oberflächliche Wundabstrich","Bei Knochenkontakt (Probe-to-bone) an Osteomyelitis denken"],"deeskalation":"Nach Kultur.","dauer":"Stratifizierung und Dauer gegen die aktuelle IWGDF-Leitlinie abgleichen (ungeprüft).","komp":["weichteil","knochen","eschar"],"pitfalls":["Eine Wunde ohne klinische Infektionszeichen wird nicht antibiotisch behandelt, auch wenn der Abstrich Erreger zeigt — jede chronische Wunde ist besiedelt."],"quelle":"IWGDF (ungeprüft)"},{"id":"ssi","name":"Postoperative Wundinfektion","block":"Haut und Weichteil","def":"Infektion im Operationsgebiet. Die Eröffnung ist die Therapie.","erreger":[{"id":"mssa","h":"haeufig"},{"id":"kns","h":"haeufig"},{"id":"ecoli","h":"moeglich"},{"id":"bfragilis","h":"moeglich"},{"id":"efaecalis","h":"moeglich"},{"id":"mrsa","h":"selten"}],"therapie":[{"label":"Nach sauberen Eingriffen","subs":["ampsulb"],"text":"3 g alle 6–8 h — nur bei Behandlungsindikation."},{"label":"Nach kolorektalen oder gynäkologischen Eingriffen","subs":["piptazo"],"text":"4,5 g alle 8 h."}],"kombi":"MRSA-Abdeckung nur bei Risiko.","sanierung":["Eröffnung, Débridement, Wundpflege"],"diagnostik":["Tiefe Gewebeprobe zur Kultur"],"deeskalation":"Nach Kultur.","dauer":"Kurz, nach Sanierung.","komp":["weichteil"],"pitfalls":["Bei oberflächlicher Wundinfektion ohne systemische Zeichen genügen Eröffnung, Débridement und Wundpflege — Antibiotika sind dann nicht erforderlich.","Antibiotisch behandelt wird bei ausgedehnter Umgebungsreaktion, systemischen Zeichen, Faszienbeteiligung, Immunsuppression oder Implantatnähe."],"quelle":"—","wahl":"Eingriffsart entscheidet: sauber → Ampicillin/Sulbactam, kolorektal oder gynäkologisch → Pip/Tazo. Eröffnung geht vor."},{"id":"osteomyelitis","name":"Osteomyelitis und Osteitis","block":"Knochen und Gelenk","def":"Knoch
