irrhose","stand":"10.09.2024","regime":[{"label":"","t":"Ceftriaxon 1 × 2 g i.v.","dauer":"7 Tage","evidenz":"B","quelle":"PEG 2018","subs":["ceftriaxon"]},{"label":"","t":"Piperacillin/Tazobactam 3 × 4/0,5 g i.v.","dauer":"7 Tage","evidenz":"B","quelle":"PEG 2018","subs":["piptazo"]}],"hinweise":["An Albumingabe denken (ausdrücklicher Hinweis der Hausleitlinie)."]},"cholangitis":{"kap":"Abdominelle Infektionen","titel":"Cholezystitis und Cholangitis","stand":"10.09.2024","regime":[{"label":"","t":"Ambulant, mild bis moderat: Ceftriaxon 1–2 × 2 g + Metronidazol 3 × 400–500 mg","dauer":"3–5 Tage","evidenz":"A","quelle":"DGVS 2018, PEG 2018","subs":["metronidazol","ceftriaxon"]},{"label":"","t":"Ambulant, schwer, hohes Alter, Immundefizienz: Ceftriaxon + Metronidazol","dauer":"5–7 Tage","evidenz":"A","quelle":"Brodt, PEG 2018, DGVS 2018","subs":["metronidazol","ceftriaxon"]},{"label":"","t":"Bei Betalaktamallergie: Levofloxacin 1–2 × 500 mg + Metronidazol","dauer":"3–7 Tage","evidenz":"A","quelle":"DGVS 2018, PEG 2018","subs":["metronidazol","levofloxacin"]},{"label":"","t":"Sepsis mit Fokus Gallenwege: Ceftriaxon 1–2 × 2 g + Metronidazol 3 × 400–500 mg","dauer":"7–10 Tage","evidenz":"—","quelle":"PEG 2018, modifiziert","subs":["metronidazol","ceftriaxon"]}],"hinweise":["Die Notwendigkeit einer Antibiotikatherapie bei unkomplizierter Cholezystitis ist umstritten.","Eine akute obstruktive Cholangitis soll unverzüglich antibiotisch therapiert werden.","Bei nosokomialem Gallenfokus wie Sepsis Fokus Darm vorgehen."]},"pankreasnekrose":{"kap":"Abdominelle Infektionen","titel":"Akute Pankreatitis","stand":"10.09.2024","regime":[{"label":"","t":"Ohne infizierte Nekrosen, Pseudozysten oder Abszess: keine antibiotische Therapie","dauer":"—","evidenz":"k. A.","quelle":"PEG 2018","subs":[]},{"label":"","t":"Mit infizierten Nekrosen, Pseudozysten, Abszess: Meropenem 3 × 2 g i.v.","dauer":"7–10 Tage","evidenz":"A","quelle":"PEG 2018","subs":["meropenem"]},{"label":"","t":"Bei Betalaktamallergie: Ciprofloxacin 2 × 400 mg + Metronidazol 3 × 500 mg","dauer":"7–10 Tage","evidenz":"B","quelle":"PEG 2010, modifiziert","subs":["ciprofloxacin","metronidazol"]}],"hinweise":[]},"divertikulitis":{"kap":"Abdominelle Infektionen","titel":"Divertikulitis","stand":"10.09.2024","regime":[{"label":"","t":"Komplizierte Divertikulitis (CDD Typ 2): Cefuroxim 3 × 1,5 g + Metronidazol 3 × 400–500 mg","dauer":"4–7 Tage","evidenz":"A","quelle":"Germer 2007, PEG 2018, DGVS 2021","subs":["metronidazol","cefuroxim"]},{"label":"","t":"Komplizierte Divertikulitis: Ciprofloxacin + Metronidazol","dauer":"4–7 Tage","evidenz":"A","quelle":"PEG 2018, DGVS 2021","subs":["ciprofloxacin","metronidazol"]},{"label":"","t":"Unkompliziert mit phlegmonöser Umgebungsreaktion (CDD 1b): Amoxicillin/Clavulansäure 3 × 875/125 mg p.o.","dauer":"4–7 Tage","evidenz":"k. A.","quelle":"DGVS 2021","subs":["amoxclav"]}],"hinweise":["Bei akuter linksseitiger Divertikulitis CDD 1b ohne Risikofaktoren kann unter engmaschiger Kontrolle auf Antibiotika verzichtet werden.","Operationsindikation bei Typ 2 bis 4 unabhängig von der Antibiotikatherapie prüfen."]},"leberabszess":{"kap":"Abdominelle Infektionen","titel":"Leberabszess, bakteriell","stand":"10.09.2024","regime":[{"label":"","t":"Initial: Ceftriaxon 1 × 2 g + Metronidazol 3 × 500 mg i.v.","dauer":"10–14 Tage","evidenz":"k. A.","quelle":"Brodt, Gilbert","subs":["metronidazol","ceftriaxon"]},{"label":"","t":"Sequenztherapie: Cefpodoxim 2 × 200 mg + Metronidazol 3 × 500 mg p.o.","dauer":"≥ 14 Tage","evidenz":"k. A.","quelle":"Brodt, Gilbert","subs":["metronidazol","cefpodoxim"]}],"hinweise":["Wenn klinisch möglich, zuerst Abszesspunktion versuchen — nach Ausschluss einer Echinokokkose.","Je nach Herkunftsland an Amöbenabszess und Tuberkulose denken."]},"cdi":{"kap":"Abdominelle Infektionen","titel":"Clostridioides-difficile-Infektion","stand":"10.09.2024","regime":[{"label":"","t":"Initiale Infektion ohne Kolitiszeichen: auslösende Antibiotikatherapie absetzen, supportive Therapie, klinische Beobachtung","dauer":"2 Tage","evidenz":"—","quelle":"ESCMID 2021, DGVS 2023","subs":[]},{"label":"","t":"Initiale Infektion: Vancomycin 4 × 125 mg p.o.","dauer":"10–14 Tage","evidenz":"I, B","quelle":"IDSA 2021, ESCMID 2021, DGVS 2023","subs":["vancomycin"]},{"label":"","t":"Initiale Infektion, nicht schwer, keine Risikofaktoren: Metronidazol 3 × 400 mg p.o.","dauer":"10 Tage","evidenz":"—","quelle":"DGVS 2023","subs":["metronidazol"]},{"label":"","t":"Schwerer Verlauf: Vancomycin 4 × 125–500 mg p.o.","dauer":"10–14 Tage","evidenz":"I, A","quelle":"ESCMID 2021, DGVS 2023","subs":["vancomycin"]},{"label":"","t":"Schwerer Verlauf bei Nichtansprechen: Fidaxomicin 2 × 200 mg p.o.","dauer":"10 Tage","evidenz":"I, B","quelle":"ESCMID 2021, DGVS 2023","subs":["fidaxomicin"]},{"label":"","t":"Erstes Rezidiv nach initialer Vancomycintherapie: Fidaxomicin 2 × 200 mg p.o.","dauer":"10 Tage","evidenz":"I, B","quelle":"ACG 2021, IDSA 2021, ESCMID 2021, DGVS 2023","subs":["fidaxomicin","vancomycin"]},{"label":"","t":"Ab zweitem Rezidiv: Vancomycin im Ausschleichschema oder fäkaler Mikrobiotatransfer","dauer":"Wochen","evidenz":"—","quelle":"IDSA 2021, ACG 2021, ESCMID 2021","subs":["vancomycin"]}],"hinweise":["Bei nicht möglicher oraler Therapie: Metronidazol 3 × 500 mg i.v. oder Tigecyclin.","Bei fulminantem Verlauf chirurgisches Konsil, Operationsindikation innerhalb 24 bis 48 Stunden.","Kriterien schwerer Verlauf: Fieber > 38,5 °C, Leukozytose > 15.000/µl, Kreatininanstieg > 50 % des Ausgangswerts.","Motilitätshemmer vermeiden, PPI-Indikation prüfen.","Händewaschen mit Wasser und Seife zusätzlich zur Desinfektion — Sporen sind alkoholresistent."]},"intraabdominelle_candidose":{"kap":"Abdominelle Infektionen","titel":"Antimykotische Komponente bei nosokomialer und tertiärer Peritonitis","stand":"10.09.2024","regime":[{"label":"","t":"Caspofungin Tag 1: 1 × 70 mg, ab Tag 2: 1 × 50 mg; über 80 kg dauerhaft 70 mg — als Teil der Kombination mit Meropenem","dauer":"7–10 Tage","evidenz":"A","quelle":"PEG 2018, modifiziert","subs":["caspofungin","meropenem"]}],"hinweise":["Verdacht auf Pilzsepsis laut Sepsiskapitel: schwere Immunsuppression, hämatoonkologische Grunderkrankung, nach darmchirurgischer Operation, Anastomoseninsuffizienz."]},"sab":{"kap":"Blutstrominfektionen","titel":"Staphylococcus-aureus-Sepsis","stand":"14.07.2026","regime":[{"label":"","t":"MSSA: Cefazolin 3 × 2 g ± Rifampicin 2 × 600 mg","dauer":"≥ 14 Tage","evidenz":"k. A.","quelle":"PEG 2018, modifiziert","subs":["rifampicin","cefazolin"]},{"label":"","t":"MSSA: Flucloxacillin 6 × 2 g oder 3 × 4 g ± Rifampicin 2 × 600 mg","dauer":"≥ 14 Tage","evidenz":"k. A.","quelle":"PEG 2018, modifiziert","subs":["flucloxacillin","rifampicin"]},{"label":"","t":"MRSA: Vancomycin nach Dosierungsschema + Rifampicin 2 × 600 mg","dauer":"≥ 14 Tage","evidenz":"k. A.","quelle":"PEG 2018, modifiziert","subs":["vancomycin","rifampicin"]},{"label":"","t":"MRSA, nicht-pneumogene Sepsis: Daptomycin 1 × 9 mg/kg","dauer":"≥ 14 Tage","evidenz":"k. A.","quelle":"PEG 2018, modifiziert","subs":["daptomycin"]}],"hinweise":["Rifampicin-Zusatz bei liegendem Device oder Implantaten.","Kontrollblutkultur-Set 48 bis 72 Stunden nach Therapiebeginn.","Es gilt zusätzlich der hauseigene Standard „Blutstrominfektion / Bakteriämie mit Staphylococcus aureus“.","MSSA-Pneumonie laut Atemwegskapitel: Flucloxacillin 4–6 × 2 g oder 4 × 3 g; MRSA-Pneumonie: Linezolid 2 × 600 mg oder Vancomycin + Rifampicin 2 × 450 mg."]},"enterokokken_bakteriaemie":{"kap":"Blutstrominfektionen","titel":"Enterococcus-spp.-Sepsis","stand":"14.07.2026","regime":[{"label":"","t":"VRE: Linezolid 2 × 600 mg i.v.","dauer":"7–10 Tage","evidenz":"k. A.","quelle":"PEG 2018","subs":["linezolid"]},{"label":"","t":"VRE, nur bei intraabdominellem Fokus: Tigecyclin, Loading 100–200 mg, dann 2 × 50–100 mg","dauer":"7–10 Tage","evidenz":"k. A.","quelle":"PEG 2018","subs":["tigecyclin"]},{"label":"","t":"VRE: D 3–4 × 600 mg–1,2 g i.v.","dauer":"7–10 Tage","evidenz":"k. A.","quelle":"PEG 2018","subs":["penicillin","clindamycin"]}],"hinweise":["Kein eigenes peripartales Kapitel in den vorliegenden Unterlagen."]},"phlegmone":{"kap":"Haut- und Weichgewebeinfektionen","titel":"Phlegmone","stand":"11.06.2019","regime":[{"label":"","t":"Begrenzt, jeglicher Schweregrad: Cefazolin 3–4 × 2 g i.v.","dauer":"(5–)7 Tage","evidenz":"Ib, A","quelle":"PEG 2018, Dosis modifiziert","subs":["cefazolin"]},{"label":"","t":"Begrenzt, bei gramnegativer Besiedlung der Eintrittspforte: Cefuroxim 3 × 1,5–3 g","dauer":"(5–)7 Tage","evidenz":"C","quelle":"PEG 2018","subs":["cefuroxim"]},{"label":"","t":"Begrenzt, bei wahrscheinlichen Anaerobiern: Clindamycin 3–4 × 600 mg–1,2 g","dauer":"(5–)7 Tage","evidenz":"B","quelle":"PEG 2018","subs":["clindamycin"]},{"label":"","t":"Schwer, dringende OP-Indikation: Cefazolin 3–4 × 2 g, bis 12 g/d bei lebensbedrohlicher Infektion, plus Débridement","dauer":"5–10 Tage","evidenz":"III, C","quelle":"PEG 2018","subs":["cefazolin"]},{"label":"","t":"Tiefe Infektion, fehlendes Ansprechen: Flucloxacillin 4–6 × 2 g + Fosfomycin 3 × 5–8 g plus Débridement","dauer":"5–10 Tage","evidenz":"IIa, C","quelle":"PEG 2018, Dosis modifiziert","subs":["flucloxacillin"]}],"hinweise":["Sepsis mit Fokus Haut/Weichgewebe, ambulant erworben: Cefuroxim 3 × 1,5 g + Clindamycin 3 × 900 mg.","Erysipel unkompliziert: Penicillin V p.o.; kompliziert oder Kopfbereich: Penicillin G 4–6 × 5 Mio. I.E."]},"ssi":{"kap":"Haut- und Weichgewebeinfektionen","titel":"Postoperative Wundinfektion, Abszess, Phlegmone","stand":"11.06.2019","regime":[{"label":"","t":"Staphylogener Abszess, kritische Lokalisation oder Komorbiditäten: Cefazolin 3–4 × 2 g i.v.","dauer":"(5–)7 Tage","evidenz":"Ib, A","quelle":"PEG 2018, Dosis modifiziert","subs":["cefazolin"]},{"label":"","t":"Kompliziert, nicht allein staphylogen (Darm, Perinealgegend): Ampicillin/Sulbactam 3 × 1/0,5 g bis 2/1 g i.v.","dauer":"7 Tage","evidenz":"Ib, A","quelle":"PEG 2018","subs":["ampsulb"]},{"label":"","t":"Komplizierte schwere Weichgewebeinfektion bei mehreren Komorbiditäten: Piperacillin/Tazobactam 3–4 × 4/0,5 g, bis 3 × 8/1 g in schweren Fällen","dauer":"10 (7–14) Tage","evidenz":"Ib, A","quelle":"PEG 2018","subs":["piptazo"]},{"label":"","t":"Alternativ: Meropenem 3 × 1 g","dauer":"7–14 Tage","evidenz":"IIa, B","quelle":"PEG 2018","subs":["meropenem"]}],"hinweise":["Chirurgische Intervention erforderlich bei eitriger, anaerober Wundinfektion oder ausgedehnter Phlegmone mit Kreislaufinstabilität.","Bei verunreinigter Wunde Tetanusimpfstatus prüfen, bei Tierbiss Tollwutrisiko."]},"dfs":{"kap":"Haut- und Weichgewebeinfektionen","titel":"Fußinfektionen bei schwerem Diabetes mellitus (PEDIS)","stand":"11.06.2019","regime":[{"label":"","t":"PEDIS 2, oberflächlich < 2 cm: Cefuroxim 3 × 1,5–3 g i.v.","dauer":"5–14 Tage","evidenz":"III, B","quelle":"PEG 2018","subs":["cefuroxim"]},{"label":"","t":"PEDIS 3, tiefe Infektion: Piperacillin/Tazobactam 3 × 4/0,5 g bis 8/1 g i.v.","dauer":"7–14 Tage","evidenz":"Ib, B","quelle":"PEG 2018, modifiziert","subs":["piptazo"]},{"label":"","t":"Bei Betalaktamallergie: Ciprofloxacin + Metronidazol","dauer":"7–14 Tage","evidenz":"IV, C","quelle":"modifiziert","subs":["ciprofloxacin","metronidazol"]}],"hinweise":["PEDIS-Klassifikation Grad 1 bis 4 im Hausdokument hinterlegt.","Kritische Ischämie verschiebt den Schweregrad in Richtung schwer und kann die klinischen Zeichen abmildern."]},"febrile_neutropenie":{"kap":"Fieber unbekannter Ursache bei Neutropenie","titel":"Febrile Neutropenie","stand":"11.06.2019","regime":[{"label":"","t":"Standardrisiko, stationär: Piperacillin/Tazobactam 3–4 × 4/0,5 g i.v.","dauer":"≥ 7 Tage","evidenz":"I, A","quelle":"DGHO 2017, modifiziert","subs":["piptazo"]},{"label":"","t":"Standardrisiko ohne Ansprechen nach 96 h: Meropenem 3 × 2 g i.v.","dauer":"≥ 7 Tage","evidenz":"A","quelle":"DGHO 2017, modifiziert","subs":["meropenem"]},{"label":"","t":"Hochrisiko: Piperacillin/Tazobactam 3–4 × 4/0,5 g oder Meropenem 3 × 2 g","dauer":"≥ 7 Tage","evidenz":"I, A","quelle":"DGHO 2017, modifiziert","subs":["piptazo","meropenem"]},{"label":"","t":"Hochrisiko ohne Ansprechen nach 96 h, bei Mukositis, Katheterverdacht oder MRSA-Kolonisation: zusätzlich Vancomycin 2 × 1 g","dauer":"≥ 7 Tage","evidenz":"III, C","quelle":"DGHO 2017","subs":["vancomycin"]},{"label":"","t":"Hochrisiko ohne Ansprechen nach 96 h, Verdacht auf Pilzinfektion: Caspofungin Tag 1: 70 mg, ab Tag 2: 50 mg","dauer":"≥ 7 Tage","evidenz":"I, A","quelle":"DGHO 2017","subs":["caspofungin"]}],"hinweise":["Definitionen: Fieber einmalig ≥ 38,3 °C oder zweimalig ≥ 38,0 °C; Neutropenie < 500/µl oder < 1000/µl mit erwartetem Abfall.","Hochrisiko ab einer Neutropeniedauer von ≥ 8 Tagen; MASCC-Score ≥ 21 definiert Standardrisiko.","Therapiedauer: bei Granulozyten > 1000/µl bis 2 Tage nach Entfieberung, bei < 1000/µl bis 7 Tage nach Entfieberung.","Bestehende Pilzprophylaxe mit Posaconazol oder Itraconazol weitergeben."]},"vat":{"kap":"Atemwegsinfektionen","titel":"Akute Bronchitis und AECOPD","stand":"04.02.2022","regime":[{"label":"","t":"Akute Bronchitis: in der Regel keine Antibiotika","dauer":"—","evidenz":"k. A.","quelle":"Gilbert 2020","subs":[]},{"label":"","t":"AECOPD leicht bis mittelschwer ohne purulentes Sputum: in der Regel keine Antibiotika","dauer":"—","evidenz":"B","quelle":"DGP 2018","subs":[]},{"label":"","t":"AECOPD sehr schwer bzw. beatmet oder mit Pseudomonas-Risiko: Piperacillin/Tazobactam 3–4 × 4/0,5 g oder Meropenem 3 × 1–2 g","dauer":"8 Tage","evidenz":"B","quelle":"PEG 2018","subs":["piptazo","meropenem"]}],"hinweise":["Purulentes Sputum ist der beste klinische Hinweis auf eine bakterielle Infektion; alternativ PCT (bei ≤ 0,1 ng/ml keine Antibiose)."]},"virale_superinfektion":{"kap":"Atemwegsinfektionen","titel":"Influenza und gezielte Erregertherapie","stand":"04.02.2022","regime":[{"label":"","t":"Bei hoher Influenza-Aktivität: frühzeitige kalkulierte Gabe von Oseltamivir bei mittelschwerer und schwerer Pneumonie, nach Ausschluss beenden","dauer":"nach Verlauf","evidenz":"—","quelle":"DGP 2021","subs":["oseltamivir"]},{"label":"","t":"MSSA-Pneumonie: Flucloxacillin 4–6 × 2 g oder 4 × 3 g","dauer":"7–28 Tage (bei Bakteriämie)","evidenz":"k. A.","quelle":"PEG 2018, DGP 2021","subs":["flucloxacillin"]},{"label":"","t":"MRSA-Pneumonie: Linezolid 2 × 600 mg","dauer":"7–28 Tage","evidenz":"A-II","quelle":"IDSA 2011, PEG 2018, DGP 2017","subs":["linezolid"]}],"hinweise":["Legionellen gezielt: Clarithromycin 2 × 500 mg oder Levofloxacin 2 × 500 mg über 7 bis 10 Tage."]}},"llErreger":{},"rahmen":[{"titel":"Reevaluation und Deeskalation","text":"Die Notwendigkeit der Antibiotika-Therapie wird am dritten Tag und mindestens alle 48 Stunden reevaluiert und anhand des Antibiogramms deeskaliert."},{"titel":"Dosierung in den ersten 24 bis 48 Stunden","text":"Auch bei bekannter Nieren- oder Leberinsuffizienz wird zunächst hochdosiert therapiert. An den Folgetagen wird an eventuelle Organinsuffizienzen angepasst und bei Bedarf per TDM kontrolliert."},{"titel":"Applikationsform","text":"Betalaktame als kontinuierliche oder verlängerte Infusion, Aminoglykoside als Bolusinfusion, Fluorchinolone über einen kurzen Zeitraum. Die Initialdosis wird als Kurzinfusion gegeben; die verlängerte Applikation wird über 2 bis 4 Stunden empfohlen."},{"titel":"Definition Risikopatient","text":"Patienten mit Beatmung, vorhergehender Antibiotika-Therapie, großem chirurgischem Eingriff oder langem Aufenthalt auf Intensivstation."},{"titel":"Zusatzrisiken A bis D bei Sepsis","text":"A) Hohe MRSA-Wahrscheinlichkeit → zusätzlich Vancomycin 2 × 1 g i.v., bei Fokus Atemwege Linezolid 2 × 600 mg i.v. B) Verdacht auf Pilzsepsis (schwere Immunsuppression, hämatoonkologische Grunderkrankung, nach darmchirurgischer Operation, Anastomoseninsuffizienz) → zusätzlich Caspofungin 1 × 50 mg, über 80 kg 1 × 70 mg. C) Verdacht auf katheterassoziierte Infektion → zusätzlich Vancomycin 2 × 1 g i.v. D) Septischer Schock oder Spektrumserweiterung → Kombination anstreben mit Ciprofloxacin 3 × 400 mg i.v. oder Fosfomycin 3 × 5 g i.v."},{"titel":"Früherkennung","text":"NEWS2-Score beziehungsweise SOFA-Score, siehe hausinterne SOP Sepsis. Bei Verdacht auf Sepsis umfassende und frühzeitige Diagnostik vor raschem Therapiebeginn."},{"titel":"Procalcitonin","text":"Die PCT-gesteuerte Therapie kann eine verkürzte Antibiotika-Therapiedauer ermöglichen — siehe Kapitel „Procalcitonin-gesteuerte Antiinfektiva-Therapie“."},{"titel":"Therapiedauer bei Peritonitis — PEG-Stufenmodell","text":"Je lokaler die Infektion begrenzt ist, desto kürzer die Dauer. Stufe 1 (ambulant, ohne Perforation, minimale Peritonitis) 1 Tag · Stufe 2 (frische Perforation, lokalisiert) 3 Tage · Stufe 3 (fortgeschritten oder mit Risikofaktoren) 5 Tage · Stufe 4 (nosokomial, septischer Schock) 7 bis 10 Tage. Ohne Erfolg nach 7 bis 10 Tagen: absetzen und erneut Proben gewinnen."},{"titel":"Urindiagnostik","text":"Das ABS-Netzwerk Rhein-Neckar empfiehlt, bei stationären Patienten mit Verdacht auf oberen Harnwegsinfekt auf den Urinstatus mittels Teststreifen ganz zu verzichten. Bei stabilen Patienten mit Katheter Urin-Mikrobiologie abwarten und gezielt nach Antibiogramm behandeln."},{"titel":"Erregernachweis ist keine Therapieindikation","text":"Der alleinige Nachweis von Erregern ist für sich noch keine Indikation für eine antibiotische Therapie. Das gilt insbesondere für chronische Wunden, die regelhaft besiedelt sind, auch wenn die Keime multiresistent sind."},{"titel":"Deeskalation bei HAP","text":"Bei klinischer Besserung ohne Nachweis eines respiratorischen Pathogens soll auf eine Monotherapie mit dem Betalaktam der Initialkombination deeskaliert werden. Bei Erregernachweis auf gezielte Monotherapie mit schmalem Spektrum. Eine initiale kalkulierte MRSA-Therapie soll beendet werden, wenn kein MRSA nachgewiesen wurde."}],"strategien":[],"prinzipien":[],"fehler":[],"eucast":[],"konflikte":[{"fokus":"cdi","titel":"CDI: Erstlinie","haus":"Vancomycin 4 × 125 mg p.o. über 10 bis 14 Tage; Fidaxomicin erst bei Nichtansprechen im schweren Verlauf und beim ersten Rezidiv.","app":"Fidaxomicin als präferierte Erstlinie bei initialer Infektion und erstem Rezidiv.","einordnung":"Die aktualisierte DGVS-Leitlinie stellt Fidaxomicin nach vorn, weil es die Mikrobiotadiversität schont und die Rezidivrate senkt. Das Hauskapitel ist vom 10.09.2024 und führt Vancomycin zuerst — es zitiert die DGVS 2023 an gleicher Stelle. Im Zweifel Hausvorgabe folgen und die Abweichung im ABS-Team ansprechen."},{"fokus":"peritonitis_ambulant","titel":"Cefuroxim bei lokalisierter Peritonitis","haus":"Cefuroxim 3 × 1,5 g + Metronidazol über 3 Tage bei frischer Perforation ohne MRE-Risiko.","app":"Piperacillin/Tazobactam als Erstlinie.","einordnung":"Das Hausresistogramm vom 19.02.2025 weist Cefuroxim gegen E. coli und Klebsiella nur mit 80 bis 89 % aus. Bei lokalisierter Peritonitis mit kurzer Therapiedauer und guter Fokussanierung ist das vertretbar; bei Sepsiszeichen sollte das breitere Regime gewählt werden."},{"fokus":"divertikulitis","titel":"Cefuroxim bei komplizierter Divertikulitis","haus":"Cefuroxim 3 × 1,5 g + Metronidazol über 4 bis 7 Tage.","app":"Piperacillin/Tazobactam.","einordnung":"Gleiche Einordnung wie bei der Peritonitis: die lokale Cefuroxim-Wirksamkeit gegen Enterobacterales liegt im gelben Bereich."},{"fokus":"scap","titel":"Makrolidwahl bei schwerer CAP","haus":"Clarithromycin 2 × 500 mg, Tag 1 bis 3.","app":"Azithromycin wegen des geringeren Interaktionspotenzials.","einordnung":"Die Hausleitlinie nennt Azithromycin selbst als Makrolid der Wahl bei älteren Patienten und bei interaktionsrelevanter Komedikation — im sCAP-Regime steht jedoch Clarithromycin. Auf der Intensivstation mit Midazolam, Statinen und Calcineurininhibitoren ist die Interaktionslage regelhaft relevant."},{"fokus":"aspiration","titel":"Anaerobierabdeckung bei Aspiration","haus":"Ampicillin/Sulbactam oder Ceftriaxon plus Clindamycin 3 × 600 mg.","app":"Keine routinemäßige Anaerobiererweiterung; Clindamycin bleibt für Lungenabszess, nekrotisierende Pneumonie und Empyem.","einordnung":"Das Hauskapitel ist von 2022 und kombiniert Ceftriaxon mit Clindamycin. Ampicillin/Sulbactam als Alternative deckt Anaerobier bereits ab — dort ist kein Clindamycin nötig. Zusätzlich: Clindamycin wirkt im Haus bei S. aureus nur unter 80 %."},{"fokus":"urosepsis","titel":"Cefepim bei nosokomialer Urosepsis","haus":"Cefepim 3 × 1–2 g i.v.","app":"Piperacillin/Tazobactam, bei ESBL oder Schock Meropenem.","einordnung":"Cefepim ist im Hausresistogramm nicht aufgeführt, eine lokale Wirksamkeitsaussage fehlt also. Cefepim deckt zudem keine Enterokokken ab, die im Erregerspektrum der komplizierten Harnwegsinfektion ausdrücklich genannt sind."},{"fokus":"nekrot_fasziitis","titel":"Regime bei nekrotisierender Fasciitis","haus":"Meropenem 3 × 2 g + Clindamycin 3 × 900 mg über 7 bis 10 Tage.","app":"Piperacillin/Tazobactam + Clindamycin + Vancomycin.","einordnung":"Die Hausvorgabe ist enger und verzichtet auf die kalkulierte MRSA-Abdeckung. Das passt zum Resistogramm, das für S. aureus einen niedrigen MRSA-Anteil nahelegt. Bei bekannter MRSA-Kolonisation ist die Ergänzung nach Zusatzrisiko A vorgesehen."},{"fokus":"sab","titel":"MSSA-Bakteriämie","haus":"Cefazolin 3 × 2 g oder Flucloxacillin 6 × 2 g beziehungsweise 3 × 4 g, jeweils ± Rifampicin bei Device.","app":"Flucloxacillin als Erstlinie, Cefazolin als Alternative.","einordnung":"Kein Widerspruch — Hausleitlinie und App decken sich. Zusätzlich verbindlich: hauseigener Standard „Blutstrominfektion / Bakteriämie mit Staphylococcus aureus“ und Kontrollblutkultur nach 48 bis 72 Stunden."}],"auffaellig":[],"referenzen":[{"titel":"Wiener Liste — Dosierung parenteraler Antibiotika","quelle":"Modifiziert nach Kompendium der antimikrobiellen Therapie, Thalhammer/Grabein, 3. Auflage 2008. Basierend auf 70 kg Körpergewicht.","nutzen":"Hängt auf Station und ist die gewohnte Referenz für Dosierungen bei normaler und eingeschränkter Nierenfunktion, intermittierender Hämodialyse und kontinuierlicher Hämofiltration.","abweichungen":[{"sub":"vancomycin","wiener":"2 × 1,0–2,0 g nach Talspiegel","app":"Loading 25–30 mg/kg, dann AUC-gesteuert mit Ziel-AUC 400–600 mg·h/l","grund":"Die Talspiegelsteuerung gilt als überholt; das frühere Ziel von 15–20 mg/l erhöht das AKI-Risiko."},{"sub":"daptomycin","wiener":"1 × 4–6 mg/kg","app":"8–10 mg/kg bei Bakteriämie und Endokarditis","grund":"Höhere Dosierungen sind seit Erscheinen der Liste Standard bei tiefen Infektionen."},{"sub":"fosfomycin","wiener":"3 × 3,0–5,0 g","app":"mindestens 12 g/d, bei ZNS-Infektion 16–24 g/d","grund":"EMA-Harmonisierung 2020 mit angehobener Minimaldosierung."},{"sub":"meropenem","wiener":"3 × 0,5–2,0 g","app":"1 g alle 8 h, bei ZNS und Pseudomonas 2 g alle 8 h über 3 h","grund":"Prolongierte Infusion und Hochdosis bei schwerer Infektion sind neuer als die Liste."}],"hinweis":"Die Liste ist von 2008. Wo diese App abweicht, folgt sie neuerer Evidenz — die Abweichung ist oben begründet. Für alles Übrige decken sich beide."},{"titel":"Antiinfektiva-Aktivität bei klinisch wichtigen Infektionserregern (Pfizer-Poster)","quelle":"Modifiziert nach Hof Antibiotika Pocketcard 2010, Thalhammer/Grabein, PEG-Resistenzstudie, GENARS, ARS, GERMAP.","nutzen":"Generische Erreger-Wirkstoff-Matrix über Bakterien und Pilze — dieselbe Systematik wie der Erregerteil dieser App, nur ohne lokale Daten.","abweichungen":[],"hinweis":"Als allgemeine Orientierung deckungsgleich mit der hier hinterlegten Matrix. Wo lokale Daten vorliegen, geht das Hausresistogramm vor."}],"status":{"standard":["Hausstandard","Routinemäßig im Haus verwendet."],"erweitert":["kein Hausstandard","Leitliniengerecht, aber nicht Routine — ggf. anfordern."],"none":["nicht bewertet","Für diese Substanz liegt keine Einordnung des Hauses vor."]},"formular":{"ampsulb":{"status":"standard"},"piptazo":{"status":"standard"},"meropenem":{"status":"standard"},"cefepim":{"status":"standard"},"cefuroxim":{"status":"standard"},"metronidazol":{"status":"standard"},"azithromycin":{"status":"standard"},"clarithromycin":{"status":"standard"},"fosfomycin":{"status":"standard"},"vancomycin":{"status":"standard"},"linezolid":{"status":"standard"},"caspofungin":{"status":"standard"},"flucloxacillin":{"status":"erweitert"},"cefazolin":{"status":"erweitert"},"ampicillin":{"status":"erweitert"},"penicillin":{"status":"erweitert"},"ceftriaxon":{"status":"erweitert"},"gentamicin":{"status":"erweitert"},"clindamycin":{"status":"erweitert"},"ciprofloxacin":{"status":"erweitert"},"cotrimoxazol":{"status":"erweitert"},"rifampicin":{"status":"erweitert"},"daptomycin":{"status":"erweitert"},"fidaxomicin":{"status":"erweitert"},"fluconazol":{"status":"erweitert"},"voriconazol":{"status":"erweitert"},"ambisome":{"status":"erweitert"},"ceftazidim_avibactam":{"status":"erweitert"},"cefiderocol":{"status":"erweitert"},"oseltamivir":{"status":"erweitert"},"aciclovir":{"status":"erweitert"},"ceftazidim":{"status":"erweitert"},"moxifloxacin":{"status":"none"},"levofloxacin":{"status":"none"},"amoxclav":{"status":"none"},"amoxicillin":{"status":"none"},"doxycyclin":{"status":"none"},"tigecyclin":{"status":"none"},"eravacyclin":{"status":"none"},"ceftolozan_tazobactam":{"status":"none"},"sulbactam_durlobactam":{"status":"none"},"isavuconazol":{"status":"none"},"amikacin":{"status":"none"},"tobramycin":{"status":"none"},"colistin":{"status":"none"},"teicoplanin":{"status":"none"},"cefotaxim":{"status":"none"},"pivmecillinam":{"status":"none"},"nitrofurantoin":{"status":"none"},"cefpodoxim":{"status":"none"},"cefaclor":{"status":"none"},"penicillin_v":{"status":"none"}},"preis":[],"resistenz":{"titel":"Hausresistogramm DSK Speyer","typ":"ampel","meta":[["Quelle","MVZ Labor Dr. Limbach, Heidelberg — Abteilung Mikrobiologie, HyBase-Statistik"],["Auswertung","ab 01.01.2024"], /* ---------- Resistenz ---------- */
function rgCell(z, sid){
  const R = H().resistenz, sur = (R.surrogat || {})[sid];
  if (sur && sur.staph && z.fam === 'staph' && z.w[sur.staph] != null) return {v: z.w[sur.staph], k: sur.staph, sur: true};
  const c = R.spalten.find(c => c.subs.includes(sid));
  if (c && z.w[c.k] != null) return {v: z.w[c.k], k: c.k};
  if (sur && sur.ersatz && z.w[sur.ersatz] != null) return {v: z.w[sur.ersatz], k: sur.ersatz, sur: true};
  return null;
}
const rgZeilen = eid => H().resistenz.zeilen.filter(z => z.erreger.includes(eid)).sort((a, b) => (b.n || 0) - (a.n || 0));
function rgWert(eid, sid){ for (const z of rgZeilen(eid)){ const c = rgCell(z, sid); if (c) return Object.assign({z}, c); } return null; }
function kat(v){ if (v == null) return null; if (typeof v === 'string') return v; return v <= 10 ? 'g' : v <= 20 ? 'y' : v <= 50 ? 'r' : 'x'; }
const KAT_WORT_P = {g: '≤ 10 % resistent', y: '11–20 % resistent', r: '21–50 % resistent', x: '> 50 % resistent'};
const KAT_WORT_A = {g: '90–100 % wirksam', y: '80–89 % wirksam', r: 'unter 80 % wirksam'};
function rcell(v, klein){
  if (v == null) return `<span class="rc rc-n">–</span>`;
  const c = kat(v);
  if (typeof v === 'string') return `<span class="sq sq-${c}" title="${KAT_WORT_A[c]}"></span>`;
  return `<span class="rc rc-${c}${klein ? ' sm' : ''}">${v}${klein ? '' : ' %'}</span>`;
}
const nHinweis = n => n == null ? '' : n < 32 ? `<span class="nklein">n = ${n}, nicht belastbar</span>` : `<span class="nn">n = ${n}</span>`;
function abgleich(f, subs){
  const out = {}, seen = {};
  f.erreger.filter(x => x.h !== 'selten').forEach(x => {
    const e = ER[x.id]; if (!e) return;
    subs.forEach(sid => {
      const w = e.w[sid]; if (!w || w === 'unwirksam') return;
      const r = rgWert(e.id, sid); if (!r) return;
      const c = kat(r.v); if (c === 'g') return;
      if (r.z.n != null && r.z.n < 10) return;
      const key = sid + '|' + r.z.name; if (seen[key]) return; seen[key] = 1;
      (out[sid] = out[sid] || []).push({e, h: x.h, v: r.v, z: r.z, sur: r.sur, c});
    });
  });
  Object.values(out).forEach(a => a.sort((p, q) => (typeof q.v === 'number' ? q.v : 0) - (typeof p.v === 'number' ? p.v : 0)));
  return out;
}
function rgKarte(f, subs, fid){
  const R = H().resistenz; if (!R || !subs.length) return '';
  const a = abgleich(f, subs), keys = subs.filter(s => a[s]);
  const aus = (R.ausnahmen || {})[fid] || {};
  const body = keys.length ? keys.map(sid => `<div class="rgl"><b>${esc(S[sid].name)}</b>
      <div class="rgl-v">${a[sid].map(x => `<button class="rgi" onclick="go('#/err/${x.e.id}')">${rcell(x.v)}<span>${esc(x.e.kurz)}</span>${x.z.n != null && x.z.n < 32 ? '<i>n<32</i>' : ''}</button>`).join('')}</div>
      ${aus[sid] ? `<p class="note">${esc(aus[sid])}</p>` : ''}</div>`).join('')
    : `<p class="ok">Bei den häufigen und möglichen Erregern dieses Fokus liegt keine lokale Resistenzrate über 10 %.</p>`;
  return `<div class="card rgk"><h3>Lokale Resistenz · ${esc(H().kurz)}</h3>${body}
    <p class="note">Geprüft: ${subs.map(s => esc(S[s].name)).join(', ')} gegen die häufigen und möglichen Erreger. Werte unter 10 Isolaten sind ausgeblendet.
    <button class="lk" onclick="go('#/resistenz')">Resistenzlage</button></p></div>`;
}

  Object.entries(h.llErreger || {}).forEach(([eid, l]) => { if (!l.aliasFokus) add(l.titel, h.kurz + ' · Kap. ' + l.kap, '#/err/' + eid, 'hausleitlinie mre ' + l.regime.map(r => r.t).join(' ')); });
  const P = [['Resistenzlage', '#/resistenz', 'resistenz resistogramm antibiogramm lokal', 'resistenz'], ['OP-Prophylaxe', '#/prophylaxe', 'pap perioperativ prophylaxe endokarditisprophylaxe blutegel cefazolin', 'prophylaxe'], ['Freigabe und Dosis', '#/formular', 'hausliste oberarzt reserve gba freigabe dosis', 'formular'], ['PEN-FAST', '#/allergie', 'penicillinallergie allergie pen-fast delabeling', 'allergie'], ['Vancomycin-Rechner', '#/dosierhilfen', 'vancomycin loading talspiegel auc tdm gentamicin dosiergewicht rechner', 'dosierhilfen'], ['Leitlinie', '#/leitlinie', 'hausleitlinie kapitel abweichungen auffälligkeiten', 'leitlinie'], ['Stationsreferenzen', '#/referenzen', 'wiener liste poster', 'referenzen'], ['Stewardship', '#/abs', 'time-out deeskalation abs stewardship', null]];
  P.forEach(p => { if (!p[3] || (h.seiten || {})[p[3]]) add(p[0], 'Seite', p[1], p[2]); });
  DATA.REGIONEN.forEach(r => add(r.name, 'Fokus-Schnellwahl', r.foki.length === 1 ? '#/fokus/' + r.foki[0] : '#/region/' + r.id, 'fokus region'));

  DATA.ERREGER.forEach(e => { if (e.alias) i.find(x => x.h === '#/err/' + e.id).k += ' ' + e.alias; });

function suggest(v){
  const box = document.getElementById('sugg'), hb = document.getElementById('homebody'); v = (v || '').trim().toLowerCase();
  if (v.length < 2){ box.innerHTML = ''; hb.style.display = ''; return; }
  IDX = IDX || searchIndex();
  const words = v.split(/\s+/);
  const hits = IDX.filter(x => words.every(w => x.k.includes(w)))
    .sort((a, b) => (b.t.toLowerCase().startsWith(v) - a.t.toLowerCase().startsWith(v)) || (b.t.toLowerCase().includes(v) - a.t.toLowerCase().includes(v))).slice(0, 14);
  hb.style.display = 'none';
  box.innerHTML = hits.length ? `<div class="list" style="margin-top:10px">${hits.map(x => `<button class="row" onclick="go('${x.h}')"><div class="rt"><b>${esc(x.t)}</b><small>${esc(x.s)}</small></div>${chev()}</button>`).join('')}</div>`
    : `<p class="empty">Nichts gefunden. Kürzeres Stichwort oder andere Schreibweise versuchen.</p>`;
}

const LQ = {};

function listePage(view, kopf, groups, order, itemFn, keyFn){
  $app.innerHTML = kopf + `<div class="search lsearch"><input id="lq" type="search" placeholder="In dieser Liste suchen …" autocomplete="off" autocorrect="off" spellcheck="false" value="${esc(LQ[view] || '')}"></div><div id="lres"></div>`;

function amp(v, wort){ return `<span class="penval"><span class="amp ${v}">${AMPEL[v] || ''}</span>${wort ? `<span class="ampw">${wort[v] || ''}</span>` : ''}</span>`; }
function lokalTabelle(eid){
  const R = H().resistenz, zs = rgZeilen(eid); if (!zs.length) return '';

    const e = ER[eid];

    const vals = R.spalten.filter(c => z.w[c.k] != null && !intr.includes(c)).map(c => ({c, v: z.w[c.k]}));
    vals.sort((a, b) => (typeof a.v === 'number' ? a.v : {g: 0, y: 15, r: 30}[a.v]) - (typeof b.v === 'number' ? b.v : {g: 0, y: 15, r: 30}[b.v]));
    const g3 = R.typ === 'prozent' ? [['wirksam', vals.filter(x => kat(x.v) === 'g')], ['eingeschränkt', vals.filter(x => ['y', 'r'].includes(kat(x.v)))], ['nicht empfohlen', vals.filter(x => kat(x.v) === 'x')]]

const r250 = x => Math.round(x / 250) * 250;
function viewDosierhilfen(){
  const h = H(), V = h.vanco; if (!V) return viewHome();
  renderBar('Dosierhilfen', {h: '#/dosierhilfen', l: 'Dosierhilfen'});
  const d = ls('ifk_dosis', {kg: '', gfr: '', cm: '', sex: 'm'});
  $app.innerHTML = `<p class="kicker">${esc(h.kurz)} · Kap. 22 und 5.5</p><h1>Dosierhilfen</h1><p class="lede">Rechnen nach den Hausregeln; ersetzt weder TDM noch VancoEasy.</p>
    <div class="card"><h3>Eingaben</h3>
      <div class="inp"><label>Gewicht<input id="kg" type="number" inputmode="decimal" value="${esc(d.kg)}" placeholder="kg"></label>
      <label>GFR<input id="gfr" type="number" inputmode="decimal" value="${esc(d.gfr)}" placeholder="ml/min"></label>
      <label>Größe<input id="cm" type="number" inputmode="decimal" value="${esc(d.cm)}" placeholder="cm"></label>
      <label>Geschlecht<select id="sex"><option value="m"${d.sex === 'm' ? ' selected' : ''}>männlich</option><option value="w"${d.sex === 'w' ? ' selected' : ''}>weiblich</option></select></label></div></div>
    <div class="card haus" id="vanco"></div>
    <div class="card haus" id="genta"></div>
    ${sec('Vancomycin-Leitfaden', `<p>${esc(V.loading)}</p><table class="tb"><thead><tr><th>GFR</th><th>Folgedosis</th><th>TDM</th></tr></thead><tbody>${V.folge.map(f => `<tr><td class="er">${esc(f.gfr)}</td><td>${esc(f.dosis)}</td><td>${esc(f.tdm)}</td></tr>`).join('')}</tbody></table><p class="sub-h">Ziele</p>${ul(V.ziele)}<p class="sub-h">Regeln</p>${ul(V.regeln)}<p class="hk-ref">${esc(V.ref)}</p>`)}`;
  ['kg', 'gfr', 'cm', 'sex'].forEach(k => document.getElementById(k).addEventListener('input', rechne));
  rechne();
}
function rechne(){
  const g = k => document.getElementById(k).value;
  const d = {kg: g('kg'), gfr: g('gfr'), cm: g('cm'), sex: g('sex')}; save('ifk_dosis', d);
  const kg = parseFloat(d.kg), gfr = parseFloat(d.gfr), cm = parseFloat(d.cm);
  const v = document.getElementById('vanco'), ge = document.getElementById('genta');
  if (!(kg > 0)){ v.innerHTML = `<div class="hk-kopf"><span class="hk-tag">Vancomycin</span></div><p class="note">Gewicht eingeben.</p>`; }
  else {
    const lo = Math.min(2000, r250(25 * kg)), hi = Math.min(2000, r250(30 * kg)), dauer = x => Math.ceil(x / 600 * 60);
    let folge = '<p class="note">GFR eingeben für Folgedosis und TDM-Zeitpunkt.</p>';
    if (gfr >= 0 && d.gfr !== ''){
      const f = gfr > 50 ? {d: [15, 20], i: 'alle 8–12 h', t: 'Talspiegel unmittelbar vor der 5. Dosis'} : gfr >= 20 ? {d: [15, 20], i: 'alle 24 h', t: 'Talspiegel nach 48 h (vor der 3. Dosis)'} : {d: [10, 15], i: 'erst, wenn der Talspiegel im Zielbereich ist', t: 'Talspiegel nach 48 h'};
      folge = `<dl class="dl"><dt>Folgedosis</dt><dd><b>${r250(f.d[0] * kg)}–${r250(f.d[1] * kg)} mg</b> ${f.i}</dd><dt>TDM</dt><dd>${f.t}</dd><dt>Ziel</dt><dd>Talspiegel 15–20 mg/l (kompliziert), AUC24/MHK 400–600</dd></dl>`;
    }
    const pap = kg <= 80 ? 1000 : kg <= 90 ? 1500 : 2000;
    v.innerHTML = `<div class="hk-kopf"><span class="hk-tag">Vancomycin · Kap. 22</span></div>
      <div class="big">${lo === hi ? lo : lo + '–' + hi} mg<small>Initialdosis (25–30 mg/kg, max. 2 g)</small></div>
      <p class="note">Infusionsdauer bei max. 600 mg/h: mindestens ${dauer(hi)} min.${30 * kg > 2000 ? ' Obergrenze 2 g greift.' : ''}</p>${folge}
      <p class="sub-h">PAP (Tab. 5.5)</p><p>${pap / 1000} g über ${pap <= 1000 ? 60 : pap === 1500 ? 90 : 120} min, Start 60–120 min vor Schnitt, Wiederholung nach 8 h.</p>`;
  }
  if (!(kg > 0 && cm > 0)){ ge.innerHTML = `<div class="hk-kopf"><span class="hk-tag">Gentamicin · Dosiergewicht</span></div><p class="note">Gewicht und Größe eingeben.</p>`; return; }
  const ibw = (d.sex === 'm' ? 50 : 45) + 0.91 * (cm - 152.4);
  const adj = kg > 1.2 * ibw, dw = adj ? ibw + 0.4 * (kg - ibw) : kg;
  const mg = (x, max) => { let r = Math.round(x * dw / 10) * 10; return max ? Math.min(r, max) : r; };
  ge.innerHTML = `<div class="hk-kopf"><span class="hk-tag">Gentamicin · Kap. 5.5</span></div>
    <dl class="dl"><dt>Idealgewicht</dt><dd>${ibw.toFixed(1).replace('.',',')} kg</dd><dt>Dosiergewicht</dt><dd><b>${dw.toFixed(1).replace('.',',')} kg</b> ${adj ? '(> 20 % über Idealgewicht: IBW + 0,4 × Differenz)' : '(tatsächliches Gewicht)'}</dd></dl>
    <table class="tb"><thead><tr><th>Indikation</th><th>mg/kg</th><th>Dosis</th></tr></thead><tbody>
    <tr><td class="er">PAP (Single Shot)</td><td>5</td><td><b>${mg(5, 540)} mg</b>${5 * dw > 540 ? ' (max. 540)' : ''}</td></tr>
    <tr><td class="er">Therapie, Standard (Hausliste)</td><td>6</td><td><b>${mg(6)} mg</b> 1 × tgl.</td></tr>
    <tr><td class="er">Endokarditis (Synergie)</td><td>3</td><td><b>${mg(3)} mg</b> 1 × tgl.</td></tr></tbody></table>
    <p class="note">Idealgewicht nach Hausformel: Männer 50, Frauen 45 + 0,91 × (Größe − 152,4 cm). Spiegelkontrolle, keine Wiederholungsdosis in der PAP.</p>`;
}

    <div class="card"><dl class="dl">${DATA.ABK.map(a => `<dt class="abk-k">${esc(a[0])}</dt><dd>${esc(a[1])}</dd>`).join('')}</dl></div>
    <div class="card"><h3>Zeichen und Farben</h3>
      <p class="sub-h">Lokale Resistenz (R %)</p><div class="rglegend">${['g', 'y', 'r', 'x'].map(c => `<span><span class="rc rc-${c} sm">${{g: 5, y: 15, r: 35, x: 80}[c]}</span>${KAT_WORT_P[c]}</span>`).join('')}</div>
      <p class="sub-h">Wirksamkeit gegen einen Erreger</p>${wirkLegend()}
      <p class="sub-h">Gewebepenetration</p>${penLegend()}
      <p class="sub-h">Häufigkeit im Erregerspektrum</p><div class="legend"><div><span class="dot haeufig"></span><span><b>häufig</b> — muss kalkuliert abgedeckt sein</span></div><div><span class="dot moeglich"></span><span><b>möglich</b> — bei Risikofaktoren oder schwerem Verlauf</span></div><div><span class="dot selten"></span><span><b>selten</b> — nur bei Nachweis oder besonderer Konstellation</span></div></div>
      <p class="sub-h">Freigabe</p><div class="legend"><div>${'<span class="st st-oa">OA</span>'}<span>Oberarztantibiotikum</span></div><div><span class="st st-res">Reserve</span><span>Reserveantibiotikum nach G-BA</span></div><div><span class="mk-h">H</span><span>Kapitel in der Hausleitlinie</span></div><div><span class="mk-l">L</span><span>lokale Resistenzdaten vorhanden</span></div></div>
      <p class="sub-h">Evidenz der Begleittherapie</p><div class="legend"><div><span class="badge ev-belastbar">belastbar</span><span>mehrere übereinstimmende RCT</span></div><div><span class="badge ev-solide">solide</span><span>Leitlinie mit guter Datengrundlage</span></div><div><span class="badge ev-begrenzt">begrenzt</span><span>kleine oder schwache Studien</span></div><div><span class="badge ev-umstritten">umstritten</span><span>widersprüchliche Studienlage</span></div></div></div>`;
}

/* ---------- Einstellungen ---------- */
function viewEinstellungen(){
  renderBar('Einstellungen', null);
  const akt = H().id, dark = ls('ifk_theme', 'light') === 'dark';
  setTimeout(() => { const o = document.getElementById('offl'); if (!o) return;
    o.textContent = location.protocol === 'file:' ? 'lokale Datei' : (navigator.serviceWorker && navigator.serviceWorker.controller) ? 'aktiv — App ist offline gespeichert' : 'Browser-Cache'; }, 60);
  $app.innerHTML = `<h1>Einstellungen</h1>
    <div class="card"><h3>Haus</h3><p class="note" style="margin-top:0">Bestimmt Hausleitlinie, Resistenzlage, Freigabestatus und Hausseiten. Die allgemeinen Inhalte bleiben gleich.</p>
      ${Object.values(DATA.HAEUSER).map(h => `<button class="tg ${h.id === akt ? 'on' : ''}" onclick="setHaus('${h.id}')"><span class="tg-b rund">${h.id === akt ? '●' : ''}</span><span class="tg-t"><b>${esc(h.name)}</b><br><small>${esc(h.dok.titel)} · ${esc(h.dok.stand)}</small></span></button>`).join('')}</div>
    <div class="card"><h3>Darstellung</h3><button class="tg ${dark ? 'on' : ''}" onclick="save('ifk_theme','${dark ? 'light' : 'dark'}');initTheme();route(true)"><span class="tg-b">${dark ? '✓' : ''}</span><span class="tg-t">Dunkle Ansicht</span></button></div>
    <div class="card"><h3>Inhalt</h3><dl class="dl"><dt>Foki</dt><dd>${DATA.FOKI.length}</dd><dt>Erreger</dt><dd>${DATA.ERREGER.length}</dd><dt>Substanzen</dt><dd>${DATA.SUBS.length}</dd><dt>Kompartimente</dt><dd>${DATA.KOMP.length}</dd></dl>
      <p class="note">Empfehlungen: zuerst die Hausleitlinie, darunter die Leitlinienlage mit Evidenz. Abweichungen werden benannt, nicht stillschweigend aufgelöst.</p></div>
    <div class="card"><h3>Version und Speicher</h3><dl class="dl"><dt>Version</dt><dd>${esc(APP_VERSION)}</dd><dt>Offline</dt><dd id="offl">wird geprüft …</dd></dl>
      <p class="note">Favoriten, zuletzt Angesehenes und Eingaben bleiben auf diesem Gerät.</p>
      <button class="lk" onclick="if(confirm('Favoriten, Verlauf und Eingaben löschen?')){['ifk_fav','ifk_recent','ifk_dosis','ifk_penfast'].forEach(k=>localStorage.removeItem(k));route(true)}">Gespeicherte Daten löschen</button></div>
    <p class="foot">Entscheidungshilfe, kein Ersatz für Antibiogramm, Leitlinie, Mikrobiologie und klinisches Urteil. Grundlagen u. a. S3 020-013 (2024), S3 067/011 (02/2026), S3 Sepsis (2025), ESC 2023, DGVS S2k, ECMM 2019/2025, BALANCE, STOP-IT, MERINO.</p>`;
}

/* ---------- Router ---------- */
function route(keep){
  const p = (location.hash.replace(/^#/, '') || '/').split('/').filter(Boolean);
  const y = window.scrollY;
  const sd = H().seiten || {};
  switch (p[0]){
    case 'subs': viewSubs(); break; case 'sub': viewSub(p[1]); break;
    case 'foki': viewFoki(); break; case 'fokus': viewFokus(p[1]); break;
    case 'erreger': viewErreger(); break; case 'err': viewErr(p[1]); break;
    case 'regionen': viewRegionen(); break; case 'region': viewRegion(p[1]); break;
    case 'komp': p[1] ? viewKomp(p[1]) : viewKompListe(); break;
    case 'kombi': viewKombi(); break; case 'schwanger': viewSchwanger(); break;
    case 'abk': viewAbk(); break; case 'abs': viewAbs(); break;
    case 'leitlinie': viewLeitlinie(); break; case 'resistenz': viewResistenz(); break;
    case 'prophylaxe': sd.prophylaxe ? viewProphylaxe() : viewHome(); break;
    case 'formular': viewFormular(); break;
    case 'allergie': sd.allergie ? viewAllergie() : viewHome(); break;
    case 'dosierhilfen': sd.dosierhilfen ? viewDosierhilfen() : viewHome(); break;
    case 'referenzen': viewReferenzen(); break;
    case 'einstellungen': case 'ueber': viewEinstellungen(); break;
    default: viewHome();
  }
  if (keep === true) window.scrollTo(0, y); else window.scrollTo(0, 0);
}
window.addEventListener('hashchange', () => route());
window.addEventListener('scroll', () => document.getElementById('hdr').classList.toggle('scrolled', window.scrollY > 4), {passive: true});
route();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}

</script>
</body>
</html>
